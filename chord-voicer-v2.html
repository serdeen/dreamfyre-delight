<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep House Chord Voicer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #07090d;
    --surface: #0d1117;
    --surface2: #141b24;
    --border: #1a2635;
    --jade: #00c896;
    --jade-dim: #00c89633;
    --jade-glow: #00c89655;
    --amber: #ffaa00;
    --amber-dim: #ffaa0033;
    --text: #b8c4d0;
    --text-dim: #4a5a6a;
    --white: #e0e8f0;
    --cream: #f0e8d8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 48px;
  }

  .container {
    width: 100%;
    max-width: 820px;
  }

  header {
    margin-bottom: 32px;
    text-align: center;
  }

  header h1 {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--jade);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-bottom: 6px;
  }

  header p {
    font-size: 0.62rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  /* Root note selector */
  .root-row {
    display: flex;
    gap: 4px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .root-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .root-btn:hover {
    border-color: var(--jade);
    color: var(--jade);
    box-shadow: 0 0 10px var(--jade-dim);
  }

  .root-btn.active {
    background: var(--jade);
    color: var(--bg);
    border-color: var(--jade);
    box-shadow: 0 0 18px var(--jade-glow);
  }

  /* Chord type grid */
  .chord-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 6px;
    margin-bottom: 28px;
  }

  .chord-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    padding: 8px 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.12s;
    text-align: center;
  }

  .chord-btn .name {
    display: block;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
    font-size: 0.68rem;
  }

  .chord-btn .intervals {
    display: block;
    font-size: 0.5rem;
    color: var(--text-dim);
  }

  .chord-btn:hover {
    border-color: var(--jade);
    color: var(--jade);
  }

  .chord-btn.active {
    background: var(--jade-dim);
    border-color: var(--jade);
    color: var(--jade);
  }

  /* BPM & duration controls */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    flex-wrap: wrap;
  }

  .ctrl-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .ctrl-group label {
    font-size: 0.55rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .num-input {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    width: 60px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--white);
    border-radius: 4px;
    padding: 5px 8px;
    text-align: center;
  }

  .num-input:focus {
    outline: none;
    border-color: var(--jade);
    box-shadow: 0 0 8px var(--jade-dim);
  }

  .action-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 8px 18px;
    border: 1px solid var(--jade);
    background: transparent;
    color: var(--jade);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .action-btn:hover {
    background: var(--jade);
    color: var(--bg);
    box-shadow: 0 0 16px var(--jade-glow);
  }

  .action-btn:active { transform: scale(0.95); }

  .action-btn.playing {
    background: var(--jade);
    color: var(--bg);
    box-shadow: 0 0 20px var(--jade-glow);
    animation: breathe 0.8s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    from { box-shadow: 0 0 12px var(--jade-glow); }
    to { box-shadow: 0 0 24px var(--jade-glow); }
  }

  .stop-btn {
    border-color: var(--amber);
    color: var(--amber);
  }

  .stop-btn:hover {
    background: var(--amber);
    color: var(--bg);
    box-shadow: 0 0 16px var(--amber-dim);
  }

  .duration-note {
    font-size: 0.58rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* Chord display */
  .chord-display {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    text-align: center;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .chord-display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, var(--jade-dim) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .chord-display.playing::before {
    opacity: 1;
  }

  .chord-name-main {
    font-family: 'Playfair Display', serif;
    font-size: 3.2rem;
    font-weight: 600;
    color: var(--white);
    letter-spacing: 0.04em;
    position: relative;
    z-index: 1;
    transition: color 0.2s;
  }

  .chord-display.playing .chord-name-main {
    color: var(--jade);
    text-shadow: 0 0 30px var(--jade-glow);
  }

  .chord-type-sub {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }

  .voicing-label {
    font-size: 0.6rem;
    color: var(--jade);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 12px;
    position: relative;
    z-index: 1;
  }

  /* Voicing keyboard */
  .voicing-section {
    margin-bottom: 24px;
  }

  .section-title {
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .voicing-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .voicing-tab {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    padding: 5px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .voicing-tab:hover { border-color: var(--jade); color: var(--jade); }
  .voicing-tab.active { background: var(--jade-dim); border-color: var(--jade); color: var(--jade); }

  .voicing-keys {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    justify-content: center;
  }

  .voicing-key {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 52px;
  }

  .voicing-key-name {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text);
    text-align: center;
  }

  .voicing-key-note {
    font-size: 0.48rem;
    color: var(--text-dim);
    text-align: center;
  }

  .voicing-key.active .voicing-key-name {
    color: var(--jade);
  }

  .voicing-key.active .voicing-key-note {
    color: var(--jade);
  }

  /* Inversions selector */
  .inversions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .inv-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    padding: 5px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .inv-btn:hover { border-color: var(--amber); color: var(--amber); }
  .inv-btn.active { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }

  /* Note detail */
  .note-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .note-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
    transition: border-color 0.15s;
  }

  .note-card.playing {
    border-color: var(--jade);
    box-shadow: 0 0 10px var(--jade-dim);
  }

  .note-card .nn {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--white);
  }

  .note-card.playing .nn {
    color: var(--jade);
  }

  .note-card .ni {
    font-size: 0.5rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .note-card .nfreq {
    font-size: 0.5rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* Scale degree row */
  .degree-row {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-top: 10px;
  }

  .degree-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: all 0.12s;
  }

  .degree-dot.root { background: var(--jade); border-color: var(--jade); box-shadow: 0 0 6px var(--jade-glow); }
  .degree-dot.chord { background: var(--amber); border-color: var(--amber); }

  /* Footer hint */
  .hint {
    font-size: 0.58rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 24px;
    line-height: 1.8;
  }

  .hint kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Chord Voicer</h1>
    <p>Extended deep house voicings — browse, hear, hold</p>
  </header>

  <!-- Root notes -->
  <div class="root-row" id="rootRow"></div>

  <!-- Chord types -->
  <div class="chord-grid" id="chordGrid"></div>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="ctrl-group">
      <label>BPM</label>
      <input class="num-input" id="bpmInput" type="number" value="124" min="60" max="140">
    </div>
    <div class="ctrl-group">
      <label>Hold (beats)</label>
      <div class="ctrl-row">
        <input class="num-input" id="holdBeats" type="number" value="4" min="1" max="16">
        <span class="duration-note" id="durationNote">1 bar</span>
      </div>
    </div>
    <div class="ctrl-group">
      <label>Voicing</label>
      <div class="inversions" id="inversions"></div>
    </div>
    <button class="action-btn" id="playBtn">&#9654; Play</button>
    <button class="action-btn stop-btn" id="stopBtn">&#9632; Stop</button>
  </div>

  <!-- Chord display -->
  <div class="chord-display" id="chordDisplay">
    <div class="chord-name-main" id="chordName">—</div>
    <div class="chord-type-sub" id="chordType">Select a root &amp; chord type</div>
    <div class="voicing-label" id="voicingLabel"></div>
  </div>

  <!-- Voicing keyboard -->
  <div class="voicing-section">
    <div class="section-title">Current Voicing</div>
    <div class="voicing-tabs" id="voicingTabs"></div>
    <div class="voicing-keys" id="voicingKeys"></div>
  </div>

  <!-- Note detail grid -->
  <div class="voicing-section">
    <div class="section-title">Voiced Notes</div>
    <div class="note-grid" id="noteGrid"></div>
    <div class="degree-row" id="degreeRow"></div>
  </div>

  <div class="hint">
    <kbd>Space</kbd> Play/Stop &nbsp;·&nbsp; <kbd>↑↓</kbd> Navigate chords &nbsp;·&nbsp; <kbd>1-4</kbd> Voicing inversions
  </div>
</div>

<script>
// ─── Data ────────────────────────────────────────────────────────────────────

const ROOTS = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
// Enharmonic display map
const DISPLAY_MAP = { 'D#': 'Eb', 'G#': 'Ab', 'A#': 'Bb', 'C#': 'C#', 'F#': 'F#' };

const CHORD_TYPES = [
  { id: 'maj',     name: 'Maj',     intervals: [0,4,7],         desc: 'Major triad' },
  { id: 'min',     name: 'min',     intervals: [0,3,7],         desc: 'Minor triad' },
  { id: 'sus2',    name: 'sus2',    intervals: [0,2,7],         desc: 'Suspended 2' },
  { id: 'sus4',    name: 'sus4',    intervals: [0,5,7],         desc: 'Suspended 4' },
  { id: 'maj7',    name: 'maj7',    intervals: [0,4,7,11],      desc: 'Major 7th' },
  { id: 'min7',    name: 'min7',    intervals: [0,3,7,10],      desc: 'Minor 7th' },
  { id: '7',       name: '7',        intervals: [0,4,7,10],      desc: 'Dominant 7th' },
  { id: 'maj9',    name: 'maj9',    intervals: [0,4,7,11,14],    desc: 'Major 9th' },
  { id: 'min9',    name: 'min9',    intervals: [0,3,7,10,14],    desc: 'Minor 9th' },
  { id: '9',       name: '9',        intervals: [0,4,7,10,14],    desc: 'Dominant 9th' },
  { id: '7sus4',   name: '7sus4',   intervals: [0,5,7,10],       desc: '7 sus4' },
  { id: 'add9',    name: 'add9',    intervals: [0,4,7,14],       desc: 'Add 9' },
  { id: '6',       name: '6',        intervals: [0,4,7,9],        desc: '6th' },
  { id: '6/9',     name: '6/9',     intervals: [0,4,7,9,14],     desc: '6/9' },
  { id: 'maj11',   name: 'maj11',  intervals: [0,4,7,11,14,17],  desc: 'Major 11th' },
  { id: 'min11',   name: 'min11',  intervals: [0,3,7,10,14,17], desc: 'Minor 11th' },
  { id: 'aug',     name: 'aug',     intervals: [0,4,8],           desc: 'Augmented' },
  { id: 'dim',     name: 'dim',     intervals: [0,3,6],           desc: 'Diminished' },
  { id: '7b9',     name: '7♭9',    intervals: [0,4,7,10,13],    desc: '7 flat 9' },
  { id: '7#9',     name: '7♯9',    intervals: [0,4,7,10,15],    desc: '7 sharp 9' },
  { id: '7b5',     name: '7♭5',   intervals: [0,4,8,10],        desc: '7 flat 5' },
  { id: '7#5',     name: '7♯5',   intervals: [0,4,6,10],        desc: '7 sharp 5' },
];

const VOICINGS = [
  { id: 'close',  label: 'Close',  desc: 'Tight voicing — root in bass' },
  { id: 'spread', label: 'Spread',  desc: 'Wide voicing — spread over 2+ octaves' },
  { id: 'piano',  label: 'Piano',   desc: 'Right-hand piano style' },
  { id: 'left',   label: 'Left',    desc: 'Left-hand root position' },
];

// ─── State ───────────────────────────────────────────────────────────────────

let selectedRoot = 0;   // index into ROOTS
let selectedChord = 0;  // index into CHORD_TYPES
let selectedVoicing = 0;
let selectedInversion = 0;
let isPlaying = false;
let currentTimeout = null;
let audioCtx = null;
let bpm = 124;
let holdBeats = 4;
let currentOscillators = [];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function midiNote(rootMidi, interval) {
  return rootMidi + interval;
}

function midiToFreq(n) {
  return 440 * Math.pow(2, (n - 69) / 12);
}

function rootMidi(rootIdx, octave = 3) {
  return NOTE_NAMES.indexOf(ROOTS[rootIdx]) + (octave + 1) * 12;
}

// ─── Chord computation ─────────────────────────────────────────────────────────

function getChordNotes(rootIdx, chordIdx, voicingIdx, octave = 3) {
  const intervals = CHORD_TYPES[chordIdx].intervals;
  const baseMidi = rootMidi(rootIdx, octave);

  let midiNotes = intervals.map(i => baseMidi + i);

  // Apply voicing transformations
  switch (voicingIdx) {
    case 0: // close — minimal movement
      break;
    case 1: // spread — spread over octaves
      midiNotes = midiNotes.map((n, i) => n + Math.floor(i / 3));
      break;
    case 2: // piano — root 3rd 5th, upper voices stacked
      midiNotes = midiNotes.map((n, i) => {
        if (i === 0) return n; // root in bass
        return n + Math.floor((i - 1) / 3);
      });
      break;
    case 3: // left — bass note only, rest upper
      midiNotes = midiNotes.map((n, i) => i === 0 ? n : n + 1);
      break;
  }

  // Inversions: rotate notes up (last goes to bass)
  for (let inv = 0; inv < selectedInversion && midiNotes.length > 1; inv++) {
    const last = midiNotes.pop();
    midiNotes.unshift(last + 12);
  }

  return midiNotes;
}

// ─── Audio ────────────────────────────────────────────────────────────────────

function playChord(midiNotes, durationSec) {
  initAudio();
  stopChord();

  const now = audioCtx.currentTime;
  const volume = 0.12;

  midiNotes.forEach((midi, i) => {
    const freq = midiToFreq(midi);

    const osc = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    const reverbGain = audioCtx.createGain();

    osc.type = i === 0 ? 'triangle' : 'sine';
    osc2.type = 'sine';
    osc.frequency.value = freq;
    osc2.frequency.value = freq * 2;

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, now);
    filter.frequency.exponentialRampToValueAtTime(2000 + i * 200, now + 0.02);
    filter.frequency.exponentialRampToValueAtTime(600, now + durationSec * 0.8);
    filter.Q.value = 0.8;

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume / Math.sqrt(midiNotes.length), now + 0.01);
    gain.gain.setValueAtTime(volume / Math.sqrt(midiNotes.length), now + durationSec * 0.6);
    gain.gain.exponentialRampToValueAtTime(0.001, now + durationSec);

    reverbGain.gain.value = 0.3;

    osc.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    gain.connect(reverbGain);

    osc.start(now);
    osc2.start(now);
    osc.stop(now + durationSec + 0.1);
    osc2.stop(now + durationSec + 0.1);

    currentOscillators.push(osc, osc2);
  });
}

function stopChord() {
  currentOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
  currentOscillators = [];
}

// ─── Build UI ─────────────────────────────────────────────────────────────────

function buildRootRow() {
  const el = document.getElementById('rootRow');
  el.innerHTML = '';
  ROOTS.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'root-btn' + (i === selectedRoot ? ' active' : '');
    btn.textContent = r;
    btn.addEventListener('click', () => { selectedRoot = i; updateAll(); });
    el.appendChild(btn);
  });
}

function buildChordGrid() {
  const el = document.getElementById('chordGrid');
  el.innerHTML = '';
  CHORD_TYPES.forEach((ct, i) => {
    const btn = document.createElement('button');
    btn.className = 'chord-btn' + (i === selectedChord ? ' active' : '');
    btn.innerHTML = `<span class="name">${ct.name}</span><span class="intervals">${ct.desc}</span>`;
    btn.addEventListener('click', () => { selectedChord = i; updateAll(); });
    el.appendChild(btn);
  });
}

function buildVoicingTabs() {
  const el = document.getElementById('voicingTabs');
  el.innerHTML = '';
  VOICINGS.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = 'voicing-tab' + (i === selectedVoicing ? ' active' : '');
    btn.textContent = v.label;
    btn.title = v.desc;
    btn.addEventListener('click', () => { selectedVoicing = i; updateAll(); });
    el.appendChild(btn);
  });
}

function buildInversions() {
  const el = document.getElementById('inversions');
  el.innerHTML = '';
  const chord = CHORD_TYPES[selectedChord];
  const maxInv = Math.min(chord.intervals.length - 1, 3);

  for (let i = 0; i <= maxInv; i++) {
    const btn = document.createElement('button');
    btn.className = 'inv-btn' + (i === selectedInversion ? ' active' : '');
    btn.textContent = i === 0 ? 'R' : `${i}`;
    btn.title = i === 0 ? 'Root position' : `${i} inversion`;
    btn.addEventListener('click', () => { selectedInversion = i; updateAll(); });
    el.appendChild(btn);
  }
}

function buildDegreeRow(midiNotes) {
  const el = document.getElementById('degreeRow');
  el.innerHTML = '';
  const chord = CHORD_TYPES[selectedChord];
  chord.intervals.forEach((interval, i) => {
    const dot = document.createElement('div');
    dot.className = 'degree-dot';
    if (i === 0) dot.classList.add('root');
    else if (midiNotes && i < midiNotes.length) dot.classList.add('chord');
    el.appendChild(dot);
  });
}

function updateDisplay(midiNotes) {
  const root = ROOTS[selectedRoot];
  const chord = CHORD_TYPES[selectedChord];
  const voicing = VOICINGS[selectedVoicing];

  document.getElementById('chordName').textContent = root + chord.name;
  document.getElementById('chordType').textContent = chord.desc + ' · ' + voicing.desc;
  document.getElementById('voicingLabel').textContent = `Voicing: ${voicing.label} · ${selectedInversion === 0 ? 'Root' : selectedInversion + ' inv'}`;

  // Note grid
  const noteGrid = document.getElementById('noteGrid');
  noteGrid.innerHTML = '';
  if (midiNotes) {
    const noteNames = midiNotes.map(m => {
      const n = NOTE_NAMES[m % 12];
      const oct = Math.floor(m / 12) - 1;
      return { name: n, octave: oct, freq: midiToFreq(m).toFixed(1) };
    });

    noteNames.forEach((nn, i) => {
      const card = document.createElement('div');
      card.className = 'note-card';
      card.innerHTML = `
        <div class="nn">${nn.name}${nn.octave}</div>
        <div class="ni">${['1','♭2','2','♭3','3','4','♯4/♭5','5','♯5','6','♭7','7'][CHORD_TYPES[selectedChord].intervals[i] % 12]}</div>
        <div class="nfreq">${nn.freq} Hz</div>
      `;
      noteGrid.appendChild(card);
    });
  }

  buildDegreeRow(midiNotes);

  // Voicing keyboard
  buildVoicingKeys(midiNotes);
}

function buildVoicingKeys(midiNotes) {
  const el = document.getElementById('voicingKeys');
  el.innerHTML = '';
  if (!midiNotes) return;

  const noteNames = midiNotes.map(m => {
    const n = NOTE_NAMES[m % 12];
    const oct = Math.floor(m / 12) - 1;
    return { name: n + oct, full: n, octave: oct };
  });

  noteNames.forEach((nn, i) => {
    const key = document.createElement('div');
    key.className = 'voicing-key';
    key.innerHTML = `
      <div class="voicing-key-name">${nn.name}</div>
      <div class="voicing-key-note">${['1','2','3','4','5','6','7'][i] || ''}</div>
    `;
    key.addEventListener('mousedown', () => {
      initAudio();
      const freq = midiToFreq(midiNotes[i]);
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.value = freq;
      const now = audioCtx.currentTime;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.2, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.9);
    });
    el.appendChild(key);
  });
}

function updateAll() {
  // Update root buttons
  document.querySelectorAll('.root-btn').forEach((b, i) => {
    b.classList.toggle('active', i === selectedRoot);
  });

  // Update chord buttons
  document.querySelectorAll('.chord-btn').forEach((b, i) => {
    b.classList.toggle('active', i === selectedChord);
  });

  // Update voicing tabs
  document.querySelectorAll('.voicing-tab').forEach((b, i) => {
    b.classList.toggle('active', i === selectedVoicing);
  });

  buildInversions();

  const midiNotes = getChordNotes(selectedRoot, selectedChord, selectedVoicing, 3);
  updateDisplay(midiNotes);

  if (isPlaying) {
    stopChord();
    const beatDuration = 60 / bpm;
    const durationSec = beatDuration * holdBeats;
    document.getElementById('chordDisplay').classList.add('playing');
    playChord(midiNotes, durationSec);
    currentTimeout = setTimeout(() => {
      stopChord();
      document.getElementById('chordDisplay').classList.remove('playing');
      isPlaying = false;
      document.getElementById('playBtn').classList.remove('playing');
      document.getElementById('playBtn').textContent = '▶ Play';
    }, durationSec * 1000);
  }
}

// ─── Playback ─────────────────────────────────────────────────────────────────

function playCurrent() {
  if (isPlaying) return;
  isPlaying = true;
  const midiNotes = getChordNotes(selectedRoot, selectedChord, selectedVoicing, 3);
  const beatDuration = 60 / bpm;
  const durationSec = beatDuration * holdBeats;

  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('playBtn').textContent = '▶ Playing…';
  document.getElementById('chordDisplay').classList.add('playing');
  playChord(midiNotes, durationSec);

  // Animate note cards
  document.querySelectorAll('.note-card').forEach((c, i) => {
    setTimeout(() => c.classList.add('playing'), 50);
    setTimeout(() => c.classList.remove('playing'), durationSec * 800);
  });

  currentTimeout = setTimeout(() => {
    stopChord();
    isPlaying = false;
    document.getElementById('playBtn').classList.remove('playing');
    document.getElementById('playBtn').textContent = '▶ Play';
    document.getElementById('chordDisplay').classList.remove('playing');
  }, durationSec * 1000);
}

function stopCurrent() {
  clearTimeout(currentTimeout);
  stopChord();
  isPlaying = false;
  document.getElementById('playBtn').classList.remove('playing');
  document.getElementById('playBtn').textContent = '▶ Play';
  document.getElementById('chordDisplay').classList.remove('playing');
}

// ─── Event listeners ──────────────────────────────────────────────────────────

document.getElementById('playBtn').addEventListener('click', playCurrent);
document.getElementById('stopBtn').addEventListener('click', stopCurrent);

document.getElementById('bpmInput').addEventListener('change', (e) => {
  bpm = parseInt(e.target.value) || 124;
  e.target.value = bpm;
  updateDurationNote();
});

document.getElementById('holdBeats').addEventListener('change', (e) => {
  holdBeats = parseInt(e.target.value) || 4;
  e.target.value = holdBeats;
  updateDurationNote();
});

function updateDurationNote() {
  const bars = holdBeats / 4;
  document.getElementById('durationNote').textContent = bars === 1 ? '1 bar' : `${bars} bars`;
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;

  if (e.code === 'Space') {
    e.preventDefault();
    isPlaying ? stopCurrent() : playCurrent();
  }
  if (e.key === 'ArrowRight') {
    selectedChord = (selectedChord + 1) % CHORD_TYPES.length;
    updateAll();
  }
  if (e.key === 'ArrowLeft') {
    selectedChord = (selectedChord - 1 + CHORD_TYPES.length) % CHORD_TYPES.length;
    updateAll();
  }
  if (e.key === 'ArrowUp') {
    selectedRoot = (selectedRoot + 1) % ROOTS.length;
    updateAll();
  }
  if (e.key === 'ArrowDown') {
    selectedRoot = (selectedRoot - 1 + ROOTS.length) % ROOTS.length;
    updateAll();
  }
  if (e.key >= '1' && e.key <= '4') {
    const inv = parseInt(e.key) - 1;
    const maxInv = CHORD_TYPES[selectedChord].intervals.length - 1;
    if (inv <= maxInv) {
      selectedInversion = inv;
      updateAll();
    }
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────

buildRootRow();
buildChordGrid();
buildVoicingTabs();
buildInversions();
updateDurationNote();
updateAll();

// Pre-select C minor 7
selectedRoot = ROOTS.indexOf('C');
selectedChord = CHORD_TYPES.findIndex(c => c.id === 'min7');
updateAll();
</script>
</body>
