<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groove Shuffler</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d1a;
    color: #e9d5ff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 24px;
  }
  h1 {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #7c3aed;
    opacity: 0.7;
  }
  .bpm-display {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #13132a;
    border: 1px solid #2d2b55;
    border-radius: 12px;
    padding: 12px 28px;
  }
  .bpm-value {
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 56px;
    font-weight: 700;
    color: #e9d5ff;
    line-height: 1;
    min-width: 100px;
    text-align: center;
    letter-spacing: -2px;
  }
  .bpm-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #7c3aed;
    text-transform: uppercase;
  }
  .bpm-controls { display: flex; flex-direction: column; gap: 6px; }
  .bpm-btn {
    background: #1e1c3a;
    border: 1px solid #3d3a6a;
    color: #e9d5ff;
    width: 36px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .bpm-btn:hover { background: #2d2b55; border-color: #7c3aed; }
  .bpm-btn:active { transform: scale(0.94); background: #3d3a7a; }
  .tap-btn {
    background: #1e1c3a;
    border: 1px solid #3d3a6a;
    color: #a855f7;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .tap-btn:hover { background: #2d2b55; border-color: #a855f7; }
  .tap-btn:active { transform: scale(0.94); background: #3d3a7a; }
  .tap-btn.tapped { background: #3d2a6a; border-color: #a855f7; color: #e9d5ff; }

  .main-row {
    display: flex;
    align-items: center;
    gap: 32px;
    background: #13132a;
    border: 1px solid #2d2b55;
    border-radius: 16px;
    padding: 24px 32px;
  }

  /* SHUFFLE KNOB */
  .knob-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .knob-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #7c3aed;
  }
  .knob-wrap {
    position: relative;
    width: 100px; height: 100px;
  }
  .knob-svg { width: 100px; height: 100px; cursor: grab; }
  .knob-svg:active { cursor: grabbing; }
  .knob-value {
    font-family: ui-monospace, monospace;
    font-size: 20px;
    font-weight: 700;
    color: #e9d5ff;
    text-align: center;
  }

  /* TRANSPORT */
  .transport { display: flex; gap: 12px; align-items: center; }
  .transport-btn {
    background: #1e1c3a;
    border: 1px solid #3d3a6a;
    color: #e9d5ff;
    width: 52px; height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .transport-btn:hover { background: #2d2b55; border-color: #7c3aed; }
  .transport-btn:active { transform: scale(0.94); }
  .transport-btn.playing { background: #2d1a4a; border-color: #7c3aed; color: #c4b5fd; }

  /* STEP GRID */
  .grid-container { width: 100%; max-width: 900px; }
  .lane {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 6px;
  }
  .lane-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #7c3aed;
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }
  .steps {
    display: flex;
    gap: 3px;
    position: relative;
  }
  .step {
    width: 48px; height: 36px;
    background: #1a1a30;
    border: 1px solid #2d2b55;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.1s, box-shadow 0.12s;
    position: relative;
  }
  .step:hover { background: #252345; border-color: #5b21b6; }
  .step:active { transform: scale(0.92); }
  .step.on { background: #4c1d95; border-color: #7c3aed; box-shadow: 0 0 8px #7c3aed55; }
  .step.on:hover { background: #5b21b6; }
  .step.current { border-color: #e9d5ff; box-shadow: 0 0 0 2px #e9d5ff55; }
  .step.swing-step { /* nothing extra by default */ }
  .step.swing-step.on { background: #6d28d9; }
  .beat-marker {
    position: absolute;
    top: -14px;
    font-size: 9px;
    color: #3d3a6a;
    letter-spacing: 0.1em;
    font-family: ui-monospace, monospace;
  }

  /* SWING VISUAL INDICATOR */
  .swing-bar {
    width: 100%;
    max-width: 900px;
    height: 4px;
    background: #1a1a30;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .swing-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #a855f7);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .grid-hint {
    font-size: 10px;
    color: #3d3a6a;
    letter-spacing: 0.1em;
    text-align: center;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>Groove Shuffler</h1>

<div class="bpm-display">
  <div>
    <div class="bpm-label">BPM</div>
    <div class="bpm-value" id="bpmVal">124</div>
  </div>
  <div class="bpm-controls">
    <button class="bpm-btn" id="bpmUp">&#9650;</button>
    <button class="bpm-btn" id="bpmDown">&#9660;</button>
  </div>
  <button class="tap-btn" id="tapBtn">TAP</button>
</div>

<div class="main-row">
  <div class="knob-section">
    <div class="knob-label">Shuffle</div>
    <div class="knob-wrap">
      <svg class="knob-svg" id="knob" viewBox="0 0 100 100">
        <!-- Track arc -->
        <circle cx="50" cy="50" r="38" fill="none" stroke="#2d2b55" stroke-width="6" stroke-dasharray="179 239" stroke-dashoffset="90" stroke-linecap="round" transform="rotate(135 50 50)"/>
        <!-- Value arc -->
        <circle id="knobArc" cx="50" cy="50" r="38" fill="none" stroke="#7c3aed" stroke-width="6" stroke-dasharray="0 239" stroke-dashoffset="90" stroke-linecap="round" transform="rotate(135 50 50)"/>
        <!-- Knob body -->
        <circle cx="50" cy="50" r="30" fill="#1e1c3a" stroke="#3d3a6a" stroke-width="2"/>
        <!-- Indicator line -->
        <line id="knobLine" x1="50" y1="50" x2="50" y2="26" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="knob-value" id="shuffleVal">0%</div>
  </div>

  <div class="transport">
    <button class="transport-btn" id="playBtn">&#9654;</button>
    <button class="transport-btn" id="stopBtn">&#9632;</button>
  </div>
</div>

<div class="swing-bar"><div class="swing-fill" id="swingFill" style="width:0%"></div></div>
<div class="grid-hint">click steps to toggle &bull; odd steps swing when shuffle &gt; 0</div>

<div class="grid-container" id="grid"></div>

<script>
(function() {
  let audioCtx = null;
  let isPlaying = false;
  let currentStep = -1;
  let nextNoteTime = 0;
  let schedulerTimer = null;
  let bpm = 124;
  let shuffle = 0;
  let tapTimes = [];

  const STEPS = 16;
  const LANES = ['Kick', 'Hat', 'Clap'];
  const laneSteps = { Kick: [0,4,8,12], Hat: [2,6,10,14,1,3,5,7,9,11,13,15], Clap: [4,12] };
  const state = {};
  LANES.forEach(l => state[l] = new Array(STEPS).fill(false));

  // ---- Audio ----
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playKick(time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(60, time);
    osc.frequency.exponentialRampToValueAtTime(30, time + 0.08);
    gain.gain.setValueAtTime(0.9, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
    osc.start(time); osc.stop(time + 0.4);
  }

  function playHat(time) {
    const bufSize = audioCtx.sampleRate * 0.08;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bpf = audioCtx.createBiquadFilter();
    bpf.type = 'bandpass'; bpf.frequency.value = 7000; bpf.Q.value = 0.8;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.25, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
    src.connect(bpf); bpf.connect(gain); gain.connect(audioCtx.destination);
    src.start(time);
  }

  function playClap(time) {
    const bufSize = audioCtx.sampleRate * 0.15;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const hpf = audioCtx.createBiquadFilter();
    hpf.type = 'highpass'; hpf.frequency.value = 1000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.5, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
    src.connect(hpf); hpf.connect(gain); gain.connect(audioCtx.destination);
    src.start(time);
  }

  function scheduleNote(step, time) {
    LANES.forEach(lane => {
      if (state[lane][step]) {
        if (lane === 'Kick') playKick(time);
        else if (lane === 'Hat') playHat(time);
        else if (lane === 'Clap') playClap(time);
      }
    });
  }

  function scheduler() {
    const stepDur = 60.0 / bpm / 4; // 16th note duration
    const lookAhead = 0.1;
    const scheduleAhead = 0.05;

    while (nextNoteTime < audioCtx.currentTime + lookAhead) {
      // Determine swing delay for odd steps
      let delay = 0;
      if (currentStep % 2 === 1) {
        delay = (shuffle / 100) * (stepDur / 3);
      }

      scheduleNote(currentStep, nextNoteTime + delay);

      // Advance step
      currentStep = (currentStep + 1) % STEPS;
      nextNoteTime += stepDur;

      // Update UI
      setTimeout(() => {
        if (isPlaying) highlightStep(currentStep);
      }, (nextNoteTime - audioCtx.currentTime) * 1000);
    }

    schedulerTimer = setTimeout(scheduler, scheduleAhead * 1000);
  }

  function highlightStep(step) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('current'));
    const el = document.getElementById('step-' + step);
    if (el) {
      el.classList.add('current');
      setTimeout(() => el.classList.remove('current'), 80);
    }
  }

  function startPlayback() {
    initAudio();
    if (isPlaying) return;
    isPlaying = true;
    currentStep = -1;
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
    document.getElementById('playBtn').classList.add('playing');
  }

  function stopPlayback() {
    isPlaying = false;
    if (schedulerTimer) clearTimeout(schedulerTimer);
    document.getElementById('playBtn').classList.remove('playing');
    document.querySelectorAll('.step').forEach(s => s.classList.remove('current'));
    currentStep = -1;
  }

  // ---- Grid UI ----
  function buildGrid() {
    const container = document.getElementById('grid');
    container.innerHTML = '';
    LANES.forEach(lane => {
      const row = document.createElement('div');
      row.className = 'lane';

      const label = document.createElement('div');
      label.className = 'lane-label';
      label.textContent = lane;
      row.appendChild(label);

      const stepsDiv = document.createElement('div');
      stepsDiv.className = 'steps';

      for (let s = 0; s < STEPS; s++) {
        const cell = document.createElement('div');
        cell.className = 'step' + (s % 2 === 1 ? ' swing-step' : '');
        cell.id = 'step-' + s;

        // Beat number
        if (s % 4 === 0) {
          const marker = document.createElement('div');
          marker.className = 'beat-marker';
          marker.textContent = s + 1;
          marker.style.left = '4px';
          cell.appendChild(marker);
        }

        cell.addEventListener('click', () => {
          initAudio();
          state[lane][s] = !state[lane][s];
          cell.classList.toggle('on', state[lane][s]);
          // Preview sound
          if (state[lane][s]) {
            const t = audioCtx ? audioCtx.currentTime : 0;
            if (lane === 'Kick') playKick(t);
            else if (lane === 'Hat') playHat(t);
            else if (lane === 'Clap') playClap(t);
          }
        });

        stepsDiv.appendChild(cell);
      }
      row.appendChild(stepsDiv);
      container.appendChild(row);
    });

    // Set default pattern
    [0,4,8,12].forEach(s => { state['Kick'][s] = true; document.getElementById('step-'+s).classList.add('on'); });
    [2,6,10,14].forEach(s => { state['Hat'][s] = true; document.getElementById('step-'+s).classList.add('on'); });
    [4,12].forEach(s => { state['Clap'][s] = true; document.getElementById('step-'+s).classList.add('on'); });
  }

  // ---- Knob ----
  let knobDragging = false;
  let knobStartY = 0;
  let knobStartVal = 0;

  function updateKnob(val) {
    shuffle = Math.round(Math.max(0, Math.min(100, val)));
    document.getElementById('shuffleVal').textContent = shuffle + '%';
    document.getElementById('swingFill').style.width = shuffle + '%';

    // Update SVG arc (270 degree range, 0=135deg, 100=405deg)
    const arcLen = (shuffle / 100) * 202;
    document.getElementById('knobArc').setAttribute('stroke-dasharray', arcLen + ' 239');

    // Rotate indicator line
    const angle = 135 + (shuffle / 100) * 270;
    const rad = angle * Math.PI / 180;
    const x2 = 50 + 24 * Math.sin(rad);
    const y2 = 50 - 24 * Math.cos(rad);
    document.getElementById('knobLine').setAttribute('x2', x2);
    document.getElementById('knobLine').setAttribute('y2', y2);
  }

  function setupKnob() {
    const knob = document.getElementById('knob');
    knob.addEventListener('mousedown', e => {
      knobDragging = true;
      knobStartY = e.clientY;
      knobStartVal = shuffle;
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!knobDragging) return;
      const dy = knobStartY - e.clientY;
      updateKnob(knobStartVal + dy * 0.5);
    });
    window.addEventListener('mouseup', () => { knobDragging = false; });
    knob.addEventListener('touchstart', e => {
      knobDragging = true;
      knobStartY = e.touches[0].clientY;
      knobStartVal = shuffle;
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchmove', e => {
      if (!knobDragging) return;
      const dy = knobStartY - e.touches[0].clientY;
      updateKnob(knobStartVal + dy * 0.5);
    }, { passive: false });
    window.addEventListener('touchend', () => { knobDragging = false; });
    updateKnob(0);
  }

  // ---- BPM Controls ----
  function setBpm(val) {
    bpm = Math.max(60, Math.min(160, val));
    document.getElementById('bpmVal').textContent = bpm;
  }

  document.getElementById('bpmUp').addEventListener('click', () => setBpm(bpm + 1));
  document.getElementById('bpmDown').addEventListener('click', () => setBpm(bpm - 1));
  document.getElementById('bpmVal').addEventListener('wheel', e => {
    e.preventDefault();
    setBpm(bpm + (e.deltaY > 0 ? -1 : 1));
  });

  // Tap tempo
  document.getElementById('tapBtn').addEventListener('click', () => {
    initAudio();
    const now = performance.now();
    tapTimes.push(now);
    if (tapTimes.length > 4) tapTimes.shift();
    document.getElementById('tapBtn').classList.add('tapped');
    setTimeout(() => document.getElementById('tapBtn').classList.remove('tapped'), 120);
    if (tapTimes.length >= 2) {
      const intervals = [];
      for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
      const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
      if (avg > 200 && avg < 2000) setBpm(Math.round(60000/avg));
    }
  });

  // Transport
  document.getElementById('playBtn').addEventListener('click', startPlayback);
  document.getElementById('stopBtn').addEventListener('click', stopPlayback);

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); isPlaying ? stopPlayback() : startPlayback(); }
    if (e.code === 'ArrowUp') setBpm(bpm + 1);
    if (e.code === 'ArrowDown') setBpm(bpm - 1);
  });

  buildGrid();
  setupKnob();
})();
</script>
</body>
</html>
