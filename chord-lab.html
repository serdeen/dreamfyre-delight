<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎸 Chord Lab</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #00ff9d;
    --accent2: #00b4ff;
    --accent3: #ff6b6b;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --active-note: #00ff9d;
    --inactive-key: #1f2937;
    --black-key: #111827;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  /* Root selector */
  .root-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 6px;
  }

  /* Chord type grid */
  .chord-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }

  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 4px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 500;
    transition: all 0.15s;
    text-align: center;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn.active {
    background: rgba(0,255,157,0.12);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 10px rgba(0,255,157,0.2);
  }

  /* Chord display */
  .chord-display {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .chord-name {
    font-size: 2.8rem;
    font-weight: 800;
    color: var(--accent);
    min-width: 120px;
    text-shadow: 0 0 20px rgba(0,255,157,0.4);
  }

  .notes-list {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .note-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .note-badge .note {
    background: rgba(0,180,255,0.15);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
  }

  .note-badge .interval {
    font-size: 0.65rem;
    color: var(--text-dim);
  }

  /* Controls row */
  .controls-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .play-btn {
    background: linear-gradient(135deg, #00ff9d, #00b4ff);
    color: #000;
    border: none;
    padding: 12px 28px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }

  .play-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 20px rgba(0,255,157,0.4);
  }

  .play-btn:active {
    transform: scale(0.97);
  }

  .strum-btn {
    background: rgba(255,107,107,0.1);
    border: 1px solid var(--accent3);
    color: var(--accent3);
    padding: 12px 20px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .strum-btn:hover {
    background: rgba(255,107,107,0.2);
    transform: scale(1.03);
  }

  .arp-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  .toggle-switch {
    width: 40px;
    height: 22px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 11px;
    position: relative;
    transition: background 0.2s;
    cursor: pointer;
  }

  .toggle-switch.on {
    background: rgba(0,255,157,0.3);
    border-color: var(--accent);
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: all 0.2s;
  }

  .toggle-switch.on::after {
    left: 20px;
    background: var(--accent);
  }

  /* Sliders */
  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 120px;
  }

  .slider-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(0,255,157,0.5);
  }

  /* Piano keyboard */
  .piano-container {
    overflow-x: auto;
    padding: 8px 0;
  }

  .piano {
    display: flex;
    position: relative;
    height: 100px;
    user-select: none;
  }

  .white-key {
    width: 36px;
    height: 100px;
    background: var(--inactive-key);
    border: 1px solid var(--border);
    border-radius: 0 0 6px 6px;
    margin-right: 2px;
    position: relative;
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
    font-size: 0.6rem;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .white-key.lit {
    background: var(--active-note);
    color: #000;
    box-shadow: 0 0 15px rgba(0,255,157,0.6);
    font-weight: 700;
  }

  .white-key:hover:not(.lit) {
    background: var(--surface2);
  }

  .black-key {
    width: 24px;
    height: 62px;
    background: var(--black-key);
    border: 1px solid #000;
    border-radius: 0 0 4px 4px;
    position: absolute;
    top: 0;
    z-index: 2;
    cursor: pointer;
    transition: background 0.1s;
    flex-shrink: 0;
  }

  .black-key.lit {
    background: var(--accent);
    box-shadow: 0 0 12px rgba(0,255,157,0.7);
  }

  .black-key:hover:not(.lit) {
    background: #374151;
  }

  /* Scale helper */
  .scale-helper {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .scale-note {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.12s;
  }

  .scale-note:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .status-bar {
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 8px;
    height: 18px;
  }

  @media (max-width: 600px) {
    .root-grid { grid-template-columns: repeat(6, 1fr); }
    .chord-grid { grid-template-columns: repeat(4, 1fr); }
    .chord-name { font-size: 2rem; }
    .controls-row { gap: 8px; }
  }
</style>
</head>
<body>

<h1>🎸 Chord Lab</h1>
<p class="subtitle">Explore chords. Hear them. Feel them.</p>

<!-- Root note -->
<div class="card">
  <div class="card-title">Root Note</div>
  <div class="root-grid" id="rootGrid"></div>
</div>

<!-- Chord type -->
<div class="card">
  <div class="card-title">Chord Type</div>
  <div class="chord-grid" id="chordGrid"></div>
</div>

<!-- Chord display -->
<div class="card">
  <div class="card-title">Selected Chord</div>
  <div class="chord-display">
    <div class="chord-name" id="chordName">Cmaj</div>
    <div class="notes-list" id="notesList"></div>
  </div>
</div>

<!-- Controls -->
<div class="card">
  <div class="card-title">Play</div>
  <div class="controls-row">
    <button class="play-btn" onclick="playChord()">▶ Play</button>
    <button class="strum-btn" onclick="strumChord()">♪ Strum</button>
    <label class="arp-toggle" onclick="toggleArp()">
      <div class="toggle-switch" id="arpSwitch"></div>
      <span>Arpeggio</span>
    </label>
    <div class="slider-group">
      <div class="slider-label">
        <span>BPM</span>
        <span id="bpmVal">120</span>
      </div>
      <input type="range" id="bpmSlider" min="60" max="200" value="120" oninput="document.getElementById('bpmVal').textContent=this.value">
    </div>
    <div class="slider-group">
      <div class="slider-label">
        <span>Sustain</span>
        <span id="susVal">1.2s</span>
      </div>
      <input type="range" id="susSlider" min="3" max="30" value="12" oninput="document.getElementById('susVal').textContent=(this.value/10).toFixed(1)+'s'">
    </div>
  </div>
  <div class="status-bar" id="statusBar">Ready</div>
</div>

<!-- Piano -->
<div class="card">
  <div class="card-title">Keyboard (2 octaves — C3 to B4)</div>
  <div class="piano-container">
    <div class="piano" id="piano"></div>
  </div>
</div>

<!-- Scale helper -->
<div class="card">
  <div class="card-title">Scale Tones (relative to chord)</div>
  <div class="scale-helper" id="scaleHelper"></div>
</div>

<script>
// ─── Music theory data ───────────────────────────────────────────────
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const CHORD_TYPES = {
  'maj':   { intervals:[0,4,7],       name:'Major',   intervalNames:['Root','M3','P5'] },
  'min':   { intervals:[0,3,7],       name:'Minor',   intervalNames:['Root','m3','P5'] },
  '7':     { intervals:[0,4,7,10],    name:'Dom 7',   intervalNames:['Root','M3','P5','m7'] },
  'maj7':  { intervals:[0,4,7,11],    name:'Maj 7',   intervalNames:['Root','M3','P5','M7'] },
  'min7':  { intervals:[0,3,7,10],    name:'Min 7',   intervalNames:['Root','m3','P5','m7'] },
  'dom9':  { intervals:[0,4,7,10,14], name:'Dom 9',   intervalNames:['Root','M3','P5','m7','M9'] },
  'sus2':  { intervals:[0,2,7],       name:'Sus 2',   intervalNames:['Root','M2','P5'] },
  'sus4':  { intervals:[0,5,7],       name:'Sus 4',   intervalNames:['Root','P4','P5'] },
  'dim':   { intervals:[0,3,6],       name:'Dim',     intervalNames:['Root','m3','d5'] },
  'aug':   { intervals:[0,4,8],       name:'Aug',     intervalNames:['Root','M3','A5'] },
  'add9':  { intervals:[0,4,7,14],    name:'Add 9',   intervalNames:['Root','M3','P5','M9'] },
  'dim7':  { intervals:[0,3,6,9],     name:'Dim 7',   intervalNames:['Root','m3','d5','d7'] },
};

// Major scale intervals for the scale helper
const MAJOR_SCALE = [0,2,4,5,7,9,11];
const MINOR_SCALE = [0,2,3,5,7,8,10];

let currentRoot = 0;   // C
let currentType = 'maj';
let arpOn = false;
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ─── Frequency calculator ─────────────────────────────────────────────
// A4 = 440Hz, MIDI note 69
// C3 = MIDI 48, C4 = MIDI 60
function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function noteToMidi(noteIdx, octave) {
  return (octave + 1) * 12 + noteIdx;
}

// ─── Sound synthesis ──────────────────────────────────────────────────
function playNote(freq, startTime, duration, gain) {
  const ctx = getAudioCtx();
  const t = startTime || ctx.currentTime;
  const sus = parseFloat(document.getElementById('susSlider').value) / 10;

  // Two oscillators for richer piano-ish tone
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gainNode = ctx.createGain();
  const masterGain = ctx.createGain();

  osc1.type = 'triangle';
  osc2.type = 'sine';
  osc1.frequency.value = freq;
  osc2.frequency.value = freq * 2.01;  // slight detune for warmth

  gainNode.gain.setValueAtTime(0, t);
  gainNode.gain.linearRampToValueAtTime((gain || 0.4), t + 0.008);
  gainNode.gain.exponentialRampToValueAtTime(0.001, t + sus);

  masterGain.gain.value = 0.5;

  osc1.connect(masterGain);
  osc2.connect(gainNode);
  gainNode.connect(masterGain);
  masterGain.connect(ctx.destination);

  osc1.start(t);
  osc2.start(t);
  osc1.stop(t + sus + 0.1);
  osc2.stop(t + sus + 0.1);
}

// ─── Get chord notes ──────────────────────────────────────────────────
function getChordMidis() {
  const type = CHORD_TYPES[currentType];
  return type.intervals.map(interval => {
    const noteIdx = (currentRoot + interval) % 12;
    const octave = interval < 12 ? 3 : 4;
    return { midi: noteToMidi(noteIdx, octave), noteIdx };
  });
}

// ─── Play functions ───────────────────────────────────────────────────
function playChord() {
  const ctx = getAudioCtx();
  const notes = getChordMidis();

  if (arpOn) {
    const bpm = parseInt(document.getElementById('bpmSlider').value);
    const stepTime = 60 / bpm * 0.5;
    notes.forEach((n, i) => {
      playNote(midiToFreq(n.midi), ctx.currentTime + i * stepTime, 0.8, 0.5);
    });
    // Final chord hit
    const lastTime = ctx.currentTime + notes.length * stepTime;
    notes.forEach(n => playNote(midiToFreq(n.midi), lastTime, 1.2, 0.3));
    setStatus('Arpeggio ♩♩♩ → chord');
  } else {
    notes.forEach(n => playNote(midiToFreq(n.midi), null, 1.0, 0.45));
    setStatus('Chord played');
  }
  flashKeys(notes.map(n => n.noteIdx));
}

function strumChord() {
  const ctx = getAudioCtx();
  const notes = getChordMidis();
  notes.forEach((n, i) => {
    playNote(midiToFreq(n.midi), ctx.currentTime + i * 0.04, 0.9, 0.5);
  });
  setStatus('Strummed ♫');
  flashKeys(notes.map(n => n.noteIdx));
}

function flashKeys(noteIndices) {
  updatePiano();
  setTimeout(updatePiano, 1500);
}

// ─── State ────────────────────────────────────────────────────────────
function toggleArp() {
  arpOn = !arpOn;
  document.getElementById('arpSwitch').classList.toggle('on', arpOn);
}

function setStatus(msg) {
  document.getElementById('statusBar').textContent = msg;
  setTimeout(() => document.getElementById('statusBar').textContent = 'Ready', 2500);
}

// ─── UI rendering ────────────────────────────────────────────────────
function renderRootButtons() {
  const grid = document.getElementById('rootGrid');
  grid.innerHTML = '';
  NOTES.forEach((note, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn' + (i === currentRoot ? ' active' : '');
    btn.textContent = note;
    btn.onclick = () => { currentRoot = i; refresh(); };
    grid.appendChild(btn);
  });
}

function renderChordButtons() {
  const grid = document.getElementById('chordGrid');
  grid.innerHTML = '';
  Object.entries(CHORD_TYPES).forEach(([key, def]) => {
    const btn = document.createElement('button');
    btn.className = 'btn' + (key === currentType ? ' active' : '');
    btn.textContent = def.name;
    btn.onclick = () => { currentType = key; refresh(); };
    grid.appendChild(btn);
  });
}

function renderChordDisplay() {
  const type = CHORD_TYPES[currentType];
  const rootName = NOTES[currentRoot];
  const suffix = currentType === 'maj' ? '' : currentType;
  document.getElementById('chordName').textContent = rootName + suffix;

  const notesList = document.getElementById('notesList');
  notesList.innerHTML = '';
  type.intervals.forEach((interval, i) => {
    const noteIdx = (currentRoot + interval) % 12;
    const div = document.createElement('div');
    div.className = 'note-badge';
    div.innerHTML = `<div class="note">${NOTES[noteIdx]}</div><div class="interval">${type.intervalNames[i]}</div>`;
    notesList.appendChild(div);
  });
}

// ─── Piano ────────────────────────────────────────────────────────────
// Two octaves: C3 to B4 (MIDI 48-71, then 72=C5 end)
// White keys: C D E F G A B per octave
// Black key offsets within octave: C#=1, D#=3, F#=6, G#=8, A#=10 (semitone offsets)
const WHITE_SEMITONES = [0,2,4,5,7,9,11]; // C D E F G A B
const BLACK_SEMITONES = [1,3,null,6,8,10,null]; // C# D# - F# G# A# -

function buildPiano() {
  const piano = document.getElementById('piano');
  piano.innerHTML = '';

  let whiteX = 0;
  for (let oct = 3; oct <= 4; oct++) {
    for (let w = 0; w < 7; w++) {
      const semi = WHITE_SEMITONES[w];
      const noteIdx = semi; // relative to C

      const wKey = document.createElement('div');
      wKey.className = 'white-key';
      wKey.dataset.noteIdx = noteIdx;
      wKey.dataset.oct = oct;
      wKey.textContent = (w === 0) ? `C${oct}` : '';
      wKey.onclick = () => {
        playNote(midiToFreq(noteToMidi(noteIdx, oct)), null, 0.8, 0.5);
      };
      piano.appendChild(wKey);

      // Add black key if applicable
      if (BLACK_SEMITONES[w] !== null) {
        const bSemi = BLACK_SEMITONES[w];
        const bKey = document.createElement('div');
        bKey.className = 'black-key';
        bKey.dataset.noteIdx = bSemi;
        bKey.dataset.oct = oct;
        // Position black key: after the white key
        const totalWhitesBefore = (oct - 3) * 7 + w;
        bKey.style.left = (totalWhitesBefore * 38 + 25) + 'px';
        bKey.onclick = () => {
          playNote(midiToFreq(noteToMidi(bSemi, oct)), null, 0.8, 0.5);
        };
        piano.appendChild(bKey);
      }
    }
  }
}

function updatePiano() {
  const type = CHORD_TYPES[currentType];
  const chordNoteIndices = new Set(type.intervals.map(i => (currentRoot + i) % 12));

  document.querySelectorAll('.white-key, .black-key').forEach(key => {
    const noteIdx = parseInt(key.dataset.noteIdx);
    key.classList.toggle('lit', chordNoteIndices.has(noteIdx));
  });
}

// ─── Scale helper ─────────────────────────────────────────────────────
function renderScaleHelper() {
  const helper = document.getElementById('scaleHelper');
  helper.innerHTML = '';

  // Show notes of the major scale of the current root
  const scaleType = ['min','min7','dim','dim7'].includes(currentType) ? MINOR_SCALE : MAJOR_SCALE;
  const scaleName = scaleType === MINOR_SCALE ? 'Natural Minor' : 'Major';

  const label = document.createElement('span');
  label.style.cssText = 'font-size:0.7rem;color:var(--text-dim);align-self:center;margin-right:4px;';
  label.textContent = `${NOTES[currentRoot]} ${scaleName}:`;
  helper.appendChild(label);

  scaleType.forEach(interval => {
    const noteIdx = (currentRoot + interval) % 12;
    const span = document.createElement('span');
    span.className = 'scale-note';
    span.textContent = NOTES[noteIdx];
    span.onclick = () => {
      currentRoot = noteIdx;
      refresh();
    };
    helper.appendChild(span);
  });
}

// ─── Main refresh ────────────────────────────────────────────────────
function refresh() {
  renderRootButtons();
  renderChordButtons();
  renderChordDisplay();
  updatePiano();
  renderScaleHelper();
}

// ─── Init ─────────────────────────────────────────────────────────────
buildPiano();
refresh();

// Keyboard shortcuts: Space = play, S = strum, A = toggle arp
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); playChord(); }
  if (e.key === 's' || e.key === 'S') strumChord();
  if (e.key === 'a' || e.key === 'A') toggleArp();
  // Arrow keys: cycle root
  if (e.code === 'ArrowRight') { currentRoot = (currentRoot + 1) % 12; refresh(); }
  if (e.code === 'ArrowLeft') { currentRoot = (currentRoot + 11) % 12; refresh(); }
  // Number keys 1-9 for chord types
  const typeKeys = Object.keys(CHORD_TYPES);
  const num = parseInt(e.key) - 1;
  if (!isNaN(num) && num >= 0 && num < typeKeys.length) { currentType = typeKeys[num]; refresh(); }
});
</script>

</body>
</html>
