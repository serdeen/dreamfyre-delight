<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM Tap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #08060f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    font-family: 'Space Mono', monospace;
    color: #fff;
    user-select: none;
  }

  .header {
    text-align: center;
  }

  .header h1 {
    font-size: 0.75rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 8px;
  }

  .header p {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.15);
    letter-spacing: 3px;
  }

  /* BPM Display */
  .bpm-display {
    text-align: center;
    position: relative;
  }

  .bpm-number {
    font-size: clamp(7rem, 28vw, 12rem);
    font-weight: 700;
    line-height: 1;
    color: #e040fb;
    text-shadow: 0 0 60px rgba(224, 64, 251, 0.4), 0 0 120px rgba(224, 64, 251, 0.15);
    transition: transform 0.06s ease;
    letter-spacing: -4px;
  }

  .bpm-number.tapped {
    transform: scale(1.04);
  }

  .bpm-label {
    font-size: 0.9rem;
    letter-spacing: 8px;
    color: rgba(224, 64, 251, 0.5);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Tempo classification */
  .tempo-info {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-top: 8px;
  }

  .tempo-badge {
    font-size: 0.6rem;
    letter-spacing: 3px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(224, 64, 251, 0.1);
    border: 1px solid rgba(224, 64, 251, 0.2);
    color: rgba(224, 64, 251, 0.6);
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .tempo-badge.active {
    background: rgba(224, 64, 251, 0.25);
    border-color: rgba(224, 64, 251, 0.6);
    color: #e040fb;
    box-shadow: 0 0 12px rgba(224, 64, 251, 0.3);
  }

  /* Tap Button */
  .tap-zone {
    position: relative;
    width: clamp(180px, 55vw, 240px);
    height: clamp(180px, 55vw, 240px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .tap-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(224, 64, 251, 0.25);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .tap-zone:hover .tap-ring {
    border-color: rgba(224, 64, 251, 0.5);
  }

  .tap-ring-fill {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224, 64, 251, 0.12) 0%, transparent 70%);
    transition: opacity 0.3s;
  }

  .tap-zone:active .tap-ring-fill {
    background: radial-gradient(circle, rgba(224, 64, 251, 0.35) 0%, transparent 70%);
  }

  .tap-text {
    font-size: 0.75rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    position: relative;
    z-index: 1;
    pointer-events: none;
    transition: color 0.15s;
  }

  .tap-zone:hover .tap-text { color: rgba(255,255,255,0.7); }
  .tap-zone:active .tap-text { color: #e040fb; }

  /* Ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid #e040fb;
    animation: ripple-out 0.5s ease-out forwards;
    pointer-events: none;
  }

  @keyframes ripple-out {
    0%   { transform: scale(0.5); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* Tap counter */
  .tap-count {
    font-size: 0.65rem;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
  }

  /* Interval flash */
  .interval-flash {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.2rem;
    color: rgba(224, 64, 251, 0.5);
    pointer-events: none;
    opacity: 0;
    font-weight: 700;
    letter-spacing: 2px;
    transition: none;
  }

  .interval-flash.show {
    animation: flash-up 0.5s ease-out forwards;
  }

  @keyframes flash-up {
    0%   { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(0.9); }
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
  }

  .ctrl-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3);
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    border-color: rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.7);
  }

  .ctrl-btn:active {
    transform: scale(0.96);
    background: rgba(255,255,255,0.05);
  }

  /* Keyboard hint */
  .kb-hint {
    font-size: 0.55rem;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.1);
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* Beat indicator dots */
  .beat-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 4px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(224, 64, 251, 0.15);
    transition: background 0.1s, box-shadow 0.1s;
  }

  .dot.active {
    background: #e040fb;
    box-shadow: 0 0 8px rgba(224, 64, 251, 0.8);
  }
</style>
</head>
<body>

<div class="header">
  <h1>BPM Tap</h1>
  <p>tap in rhythm · find the tempo</p>
</div>

<div class="bpm-display">
  <div class="bpm-number" id="bpmNum">—</div>
  <div class="bpm-label">BPM</div>
  <div class="tempo-info">
    <span class="tempo-badge" id="badgeDeep" data-min="120" data-max="126">Deep House</span>
    <span class="tempo-badge" id="badgeTech" data-min="124" data-max="130">Tech House</span>
    <span class="tempo-badge" id="badgeDrum" data-min="140" data-max="174">Drum & Bass</span>
  </div>
  <div class="beat-dots" id="beatDots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<div class="tap-zone" id="tapZone">
  <div class="tap-ring-fill"></div>
  <div class="tap-ring"></div>
  <span class="tap-text">tap</span>
</div>

<div class="tap-count" id="tapCount">0 taps</div>

<div class="controls">
  <button class="ctrl-btn" id="clearBtn">clear</button>
  <button class="ctrl-btn" id="halfBtn">÷ 2</button>
  <button class="ctrl-btn" id="doubleBtn">× 2</button>
</div>

<div class="interval-flash" id="intervalFlash"></div>
<div class="kb-hint">or press spacebar</div>

<script>
const bpmNum = document.getElementById('bpmNum');
const tapCount = document.getElementById('tapCount');
const tapZone = document.getElementById('tapZone');
const intervalFlash = document.getElementById('intervalFlash');
const beatDots = document.getElementById('beatDots').children;
const badges = [document.getElementById('badgeDeep'), document.getElementById('badgeTech'), document.getElementById('badgeDrum')];

let taps = [];
let beatIndex = 0;
let beatIntervalId = null;
let lastTapTime = 0;

function calcBPM() {
  if (taps.length < 2) return null;
  const intervals = [];
  for (let i = 1; i < taps.length; i++) {
    intervals.push(taps[i] - taps[i - 1]);
  }
  // Use last 8 intervals max, discard extremes
  const recent = intervals.slice(-8);
  recent.sort((a, b) => a - b);
  const trimmed = recent.slice(1, -1); // drop min and max
  const avg = trimmed.length > 0 ? trimmed.reduce((a, b) => a + b, 0) / trimmed.length : recent[0];
  return Math.round(60000 / avg);
}

function updateDisplay(bpm) {
  bpmNum.textContent = bpm !== null ? bpm : '—';
  tapCount.textContent = `${taps.length} tap${taps.length !== 1 ? 's' : ''}`;

  badges.forEach(b => {
    const min = parseInt(b.dataset.min);
    const max = parseInt(b.dataset.max);
    b.classList.toggle('active', bpm !== null && bpm >= min && bpm <= max);
  });
}

function flashInterval(ms) {
  intervalFlash.textContent = ms + 'ms';
  intervalFlash.classList.remove('show');
  void intervalFlash.offsetWidth;
  intervalFlash.classList.add('show');
}

function advanceDot() {
  beatDots[beatIndex % 4].classList.remove('active');
  beatIndex++;
  beatDots[(beatIndex - 1) % 4].classList.add('active');
}

function doTap() {
  const now = performance.now();

  // Auto-reset after 3s silence
  if (taps.length > 0 && now - lastTapTime > 3000) {
    taps = [];
    updateDisplay(null);
  }

  lastTapTime = now;

  if (taps.length > 0) {
    const interval = Math.round(now - taps[taps.length - 1]);
    flashInterval(interval);
  }

  taps.push(now);
  advanceDot();

  const bpm = calcBPM();
  updateDisplay(bpm);

  // Visual feedback
  bpmNum.classList.add('tapped');
  setTimeout(() => bpmNum.classList.remove('tapped'), 80);

  // Ripple
  const rect = tapZone.getBoundingClientRect();
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.cssText = `width:${rect.width}px;height:${rect.height}px;left:0;top:0;`;
  tapZone.appendChild(ripple);
  setTimeout(() => ripple.remove(), 500);
}

tapZone.addEventListener('mousedown', e => { e.preventDefault(); doTap(); });
tapZone.addEventListener('touchstart', e => { e.preventDefault(); doTap(); }, { passive: false });

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    doTap();
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  taps = [];
  updateDisplay(null);
  Array.from(beatDots).forEach(d => d.classList.remove('active'));
  beatIndex = 0;
});

document.getElementById('halfBtn').addEventListener('click', () => {
  const bpm = calcBPM();
  if (bpm !== null) {
    taps = [];
    const half = Math.round(bpm / 2);
    bpmNum.textContent = half;
    updateDisplay(half);
  }
});

document.getElementById('doubleBtn').addEventListener('click', () => {
  const bpm = calcBPM();
  if (bpm !== null) {
    taps = [];
    const dbl = Math.round(bpm * 2);
    bpmNum.textContent = dbl;
    updateDisplay(dbl);
  }
});
</script>
</body>
</html>
