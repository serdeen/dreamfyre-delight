<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melodic Step Sequencer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #07070e;
    --surface: #0f0f1a;
    --surface2: #161625;
    --border: #1e1e32;
    --cyan: #00e5ff;
    --cyan-dim: #00e5ff33;
    --cyan-glow: #00e5ff55;
    --magenta: #ff00aa;
    --magenta-dim: #ff00aa33;
    --text: #c8c8e8;
    --text-dim: #5a5a7a;
    --white: #e8e8ff;
    --grid-line: #1a1a2e;
    --step-active: #00e5ff;
    --step-accent: #ff00aa;
    --step-off: #131322;
    --key-white: #1e1e32;
    --key-black: #0a0a14;
    --key-white-playing: #00e5ff;
    --key-black-playing: #00a0bb;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }

  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .title-block h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    color: var(--cyan);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .title-block p {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .control-group label {
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .bpm-display {
    font-family: 'Space Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--white);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    width: 90px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .bpm-display:hover {
    border-color: var(--cyan-dim);
    box-shadow: 0 0 12px var(--cyan-dim);
  }

  .bpm-display:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 16px var(--cyan-glow);
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    transition: all 0.12s ease;
    min-width: 52px;
  }

  .btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 10px var(--cyan-dim);
  }

  .btn:active {
    transform: scale(0.95);
  }

  .btn.playing {
    background: var(--cyan);
    color: var(--bg);
    border-color: var(--cyan);
    box-shadow: 0 0 20px var(--cyan-glow);
  }

  .btn.accent-btn.active {
    background: var(--magenta);
    color: var(--bg);
    border-color: var(--magenta);
    box-shadow: 0 0 16px var(--magenta-dim);
  }

  .main-area {
    width: 100%;
    max-width: 960px;
  }

  .sequencer-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 16px 16px;
    overflow-x: auto;
  }

  .sequencer-row {
    display: flex;
    align-items: center;
    margin-bottom: 3px;
    min-width: 700px;
  }

  .note-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--text-dim);
    width: 36px;
    text-align: right;
    padding-right: 10px;
    flex-shrink: 0;
    transition: color 0.1s;
  }

  .note-label.playing {
    color: var(--cyan);
  }

  .note-label.accent-label {
    color: var(--magenta);
  }

  .steps {
    display: flex;
    gap: 3px;
    flex: 1;
  }

  .step {
    flex: 1;
    height: 32px;
    background: var(--step-off);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.08s, box-shadow 0.08s, transform 0.08s;
    position: relative;
    min-width: 28px;
  }

  .step:hover {
    border-color: var(--cyan-dim);
    background: #1a1a30;
  }

  .step.on {
    background: var(--step-active);
    border-color: var(--cyan);
    box-shadow: 0 0 8px var(--cyan-glow);
  }

  .step.accent-step {
    background: var(--step-accent);
    border-color: var(--magenta);
    box-shadow: 0 0 8px var(--magenta-dim);
  }

  .step.current {
    transform: scaleY(1.1);
    box-shadow: 0 0 14px var(--cyan);
  }

  .step.current.accent-step {
    box-shadow: 0 0 14px var(--magenta);
  }

  /* Beat marker — every 4th step */
  .step.beat-marker {
    border-left: 2px solid #2a2a44;
  }

  .step-num {
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-family: 'Space Mono', monospace;
    font-size: 0.48rem;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.1s;
    pointer-events: none;
  }

  .step.on .step-num,
  .step.accent-step .step-num {
    opacity: 1;
    color: var(--bg);
  }

  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }

  .step-numbers {
    display: flex;
    gap: 3px;
    flex: 1;
    margin-left: 46px;
    min-width: 654px;
  }

  .step-num-label {
    flex: 1;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    color: var(--text-dim);
    min-width: 28px;
  }

  .step-num-label.beat {
    color: var(--text);
    font-weight: 700;
  }

  .velocity-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }

  .vel-label {
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    width: 36px;
    text-align: right;
    padding-right: 10px;
  }

  .vel-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .vel-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--cyan);
    cursor: pointer;
    box-shadow: 0 0 6px var(--cyan-glow);
  }

  .vel-value {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text);
    min-width: 36px;
  }

  .piano-roll-container {
    width: 100%;
    max-width: 960px;
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 16px 12px;
  }

  .piano {
    display: flex;
    height: 120px;
    min-width: 700px;
    position: relative;
    border-radius: 0 0 6px 6px;
    overflow: hidden;
  }

  .piano-keys {
    display: flex;
    position: relative;
    z-index: 2;
  }

  .white-key {
    width: 36px;
    height: 100%;
    background: linear-gradient(180deg, #d8d8f0 0%, #b8b8d8 100%);
    border-right: 1px solid #8888aa;
    border-radius: 0 0 3px 3px;
    cursor: pointer;
    transition: background 0.08s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
  }

  .white-key span {
    font-family: 'Space Mono', monospace;
    font-size: 0.5rem;
    color: #8888aa;
  }

  .white-key:hover { background: linear-gradient(180deg, #c8c8e8 0%, #a8a8c8 100%); }
  .white-key.playing { background: linear-gradient(180deg, var(--cyan) 0%, #00b8cc 100%); }

  .black-key {
    width: 22px;
    height: 62%;
    background: linear-gradient(180deg, #1a1a28 0%, #0a0a14 100%);
    border-right: 1px solid #000;
    border-radius: 0 0 3px 3px;
    position: absolute;
    top: 0;
    z-index: 3;
    cursor: pointer;
    transition: background 0.08s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
  }

  .black-key span {
    font-family: 'Space Mono', monospace;
    font-size: 0.42rem;
    color: #444;
  }

  .black-key:hover { background: linear-gradient(180deg, #2a2a3a 0%, #1a1a28 100%); }
  .black-key.playing { background: linear-gradient(180deg, var(--cyan) 0%, #007a8a 100%); }

  .piano-highlight-row {
    position: absolute;
    left: 0; right: 0;
    height: calc(100% / 17);
    z-index: 1;
    pointer-events: none;
    display: flex;
  }

  .piano-note-indicator {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    font-weight: 700;
    color: var(--cyan);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .piano-note-indicator .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
  }

  .top-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .top-bar h2 {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-right: auto;
  }

  .octave-controls {
    display: flex;
    gap: 4px;
  }

  .octave-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .octave-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
  }

  .octave-display {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--text);
    padding: 4px 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .mode-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.62rem;
    color: var(--text-dim);
  }

  .mode-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.2s;
  }

  .mode-dot.live {
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 0.5s ease-in-out infinite alternate;
  }

  @keyframes pulse {
    from { opacity: 0.7; }
    to { opacity: 1; }
  }

  .pattern-bank {
    display: flex;
    gap: 6px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .pattern-bank label {
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 6px;
  }

  .pattern-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    padding: 5px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .pattern-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
  }

  .pattern-btn.active {
    background: var(--cyan-dim);
    border-color: var(--cyan);
    color: var(--cyan);
  }

  .preset-hint {
    font-size: 0.62rem;
    color: var(--text-dim);
    margin-top: 12px;
    font-style: italic;
  }

  .clear-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    padding: 5px 12px;
    background: transparent;
    border: 1px solid #3a1a1a;
    color: #aa5555;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
    margin-left: auto;
  }

  .clear-btn:hover {
    border-color: #ff4444;
    color: #ff6666;
    background: #1a0000;
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-label {
    font-size: 0.58rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--text);
    font-weight: 700;
  }

  /* Keyboard shortcuts hint */
  .shortcuts {
    width: 100%;
    max-width: 960px;
    display: flex;
    gap: 16px;
    margin-top: 16px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    flex-wrap: wrap;
  }

  .shortcut {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.6rem;
    color: var(--text-dim);
  }

  .shortcut kbd {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Melodic Step Sequencer</h1>
    <p>16-step piano roll · BPM sync · Web Audio</p>
  </div>
  <div class="controls">
    <div class="control-group">
      <label>BPM</label>
      <input class="bpm-display" id="bpmInput" type="number" value="124" min="40" max="200">
    </div>
    <div class="control-group">
      <label>Tap</label>
      <button class="btn" id="tapBtn">TAP</button>
    </div>
    <div class="control-group">
      <label>Swing</label>
      <button class="btn" id="swingBtn">SWING</button>
    </div>
    <div class="control-group">
      <label>Play</label>
      <button class="btn" id="playBtn">&#9654;</button>
    </div>
    <div class="control-group">
      <label>Stop</label>
      <button class="btn" id="stopBtn">&#9632;</button>
    </div>
    <div class="control-group">
      <label>Accent</label>
      <button class="btn accent-btn" id="accentBtn">ACC</button>
    </div>
  </div>
</header>

<div class="main-area">
  <div class="sequencer-container">
    <div id="sequencerGrid"></div>
    <div class="step-numbers" id="stepNumbers"></div>

    <div class="bottom-bar">
      <div class="pattern-bank">
        <div>
          <label>Patterns</label>
          <button class="pattern-btn" data-pattern="0">A</button>
          <button class="pattern-btn" data-pattern="1">B</button>
          <button class="pattern-btn" data-pattern="2">C</button>
          <button class="pattern-btn" data-pattern="3">D</button>
        </div>
      </div>
      <button class="clear-btn" id="clearBtn">CLEAR ALL</button>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Step</span>
          <span class="stat-value" id="currentStep">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Notes</span>
          <span class="stat-value" id="noteCount">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Mode</span>
          <span class="mode-indicator">
            <span class="mode-dot" id="modeDot"></span>
            <span id="modeLabel">Stopped</span>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="top-bar" style="max-width:960px; width:100%; margin-top:20px;">
  <h2>Piano Roll</h2>
  <div class="octave-controls">
    <button class="octave-btn" id="octDown">−</button>
    <span class="octave-display" id="octDisplay">C4</span>
    <button class="octave-btn" id="octUp">+</button>
  </div>
</div>

<div class="piano-roll-container">
  <div class="piano" id="piano"></div>
</div>

<div class="shortcuts">
  <div class="shortcut"><kbd>Space</kbd> Play/Stop</div>
  <div class="shortcut"><kbd>A</kbd> Toggle Accent mode</div>
  <div class="shortcut"><kbd>C</kbd> Clear pattern</div>
  <div class="shortcut"><kbd>1-4</kbd> Select pattern</div>
  <div class="shortcut"><kbd>↑↓</kbd> Octave</div>
  <div class="shortcut"><kbd>T</kbd> Tap BPM</div>
</div>

<script>
const NOTES = [
  { note: 'C',  octave: 4, isBlack: false },
  { note: 'C#', octave: 4, isBlack: true },
  { note: 'D',  octave: 4, isBlack: false },
  { note: 'D#', octave: 4, isBlack: true },
  { note: 'E',  octave: 4, isBlack: false },
  { note: 'F',  octave: 4, isBlack: false },
  { note: 'F#', octave: 4, isBlack: true },
  { note: 'G',  octave: 4, isBlack: false },
  { note: 'G#', octave: 4, isBlack: true },
  { note: 'A',  octave: 4, isBlack: false },
  { note: 'A#', octave: 4, isBlack: true },
  { note: 'B',  octave: 4, isBlack: false },
  { note: 'C',  octave: 5, isBlack: false },
  { note: 'C#', octave: 5, isBlack: true },
  { note: 'D',  octave: 5, isBlack: false },
  { note: 'D#', octave: 5, isBlack: true },
  { note: 'E',  octave: 5, isBlack: false },
];

const NUM_STEPS = 16;
const NUM_PATTERNS = 4;

// 4 patterns, each: {steps: [{noteIdx, accent}, ...]}
let patterns = [
  { steps: Array(NUM_STEPS).fill(null) },
  { steps: Array(NUM_STEPS).fill(null) },
  { steps: Array(NUM_STEPS).fill(null) },
  { steps: Array(NUM_STEPS).fill(null) },
];

let currentPattern = 0;
let accentMode = false;
let isPlaying = false;
let currentStep = -1;
let octaveOffset = 0; // shifts which octave the grid targets
let bpm = 124;
let swing = 0; // 0-100
let nextNoteTime = 0;
let schedulerTimer = null;
let lastTapTime = 0;
let tapTimes = [];
let velocity = 0.85;

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function midiToFreq(midiNote) {
  return 440 * Math.pow(2, (midiNote - 69) / 12);
}

function midiNote(noteIdx) {
  const n = NOTES[noteIdx % NOTES.length];
  const oct = n.octave + Math.floor(noteIdx / NOTES.length) + octaveOffset;
  const noteMap = {'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11};
  return 12 + oct * 12 + noteMap[n.note];
}

function playNote(noteIdx, vel = 0.8, accent = false) {
  initAudio();
  const freq = midiToFreq(midiNote(noteIdx));
  const volume = accent ? vel * 1.2 : vel * 0.8;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc.type = accent ? 'sawtooth' : 'square';
  osc.frequency.value = freq;

  filter.type = 'lowpass';
  filter.frequency.value = accent ? 3200 : 2000;
  filter.Q.value = 1.2;

  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume * 0.18, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.5);
}

function playNotePiano(noteIdx, vel = 0.8) {
  initAudio();
  const freq = midiToFreq(midiNote(noteIdx));

  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const masterGain = audioCtx.createGain();

  osc.type = 'triangle';
  osc2.type = 'sine';
  osc.frequency.value = freq;
  osc2.frequency.value = freq * 2;

  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vel * 0.12, now + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

  masterGain.gain.value = 0.6;

  osc.connect(gain);
  osc2.connect(gain);
  gain.connect(masterGain);
  masterGain.connect(audioCtx.destination);

  osc.start(now);
  osc2.start(now);
  osc.stop(now + 1.3);
  osc2.stop(now + 1.3);
}

function buildSequencerGrid() {
  const grid = document.getElementById('sequencerGrid');
  grid.innerHTML = '';

  // Build rows top to bottom (highest note first)
  for (let row = NOTES.length - 1; row >= 0; row--) {
    const rowEl = document.createElement('div');
    rowEl.className = 'sequencer-row';

    const label = document.createElement('div');
    label.className = 'note-label';
    label.id = `label-${row}`;
    const n = NOTES[row % NOTES.length];
    label.textContent = n.note + (n.octave + Math.floor(row / NOTES.length));
    if (n.isBlack) label.style.color = '#2a2a44';
    rowEl.appendChild(label);

    const stepsEl = document.createElement('div');
    stepsEl.className = 'steps';

    for (let s = 0; s < NUM_STEPS; s++) {
      const step = document.createElement('div');
      step.className = 'step' + (s % 4 === 0 ? ' beat-marker' : '');
      step.dataset.row = row;
      step.dataset.step = s;

      const num = document.createElement('span');
      num.className = 'step-num';
      num.textContent = s + 1;
      step.appendChild(num);

      step.addEventListener('mousedown', (e) => {
        e.preventDefault();
        toggleStep(row, s, e.shiftKey || accentMode);
      });

      step.addEventListener('mouseenter', (e) => {
        if (e.buttons === 1) toggleStep(row, s, e.shiftKey || accentMode);
      });

      stepsEl.appendChild(step);
    }

    rowEl.appendChild(stepsEl);
    grid.appendChild(rowEl);
  }

  // Step numbers
  const stepNums = document.getElementById('stepNumbers');
  stepNums.innerHTML = '';
  for (let s = 0; s < NUM_STEPS; s++) {
    const sp = document.createElement('div');
    sp.className = 'step-num-label' + (s % 4 === 0 ? ' beat' : '');
    sp.textContent = s + 1;
    stepNums.appendChild(sp);
  }
}

function toggleStep(row, step, forceAccent = false) {
  initAudio();
  const pattern = patterns[currentPattern];
  const existing = pattern.steps[step];

  if (existing && existing.noteIdx === row) {
    // Remove note
    pattern.steps[step] = null;
  } else {
    // Add note
    pattern.steps[step] = { noteIdx: row, accent: forceAccent || accentMode };
    playNote(row, 0.8, forceAccent || accentMode);
  }

  renderGrid();
  updateStats();
}

function renderGrid() {
  const pattern = patterns[currentPattern];

  // Clear all highlights
  document.querySelectorAll('.step').forEach(el => {
    el.classList.remove('on', 'accent-step', 'current');
  });

  // Render active notes
  pattern.steps.forEach((cell, s) => {
    if (cell) {
      const el = document.querySelector(`.step[data-row="${cell.noteIdx}"][data-step="${s}"]`);
      if (el) {
        el.classList.add(cell.accent ? 'accent-step' : 'on');
      }
    }
  });

  // Current step indicator
  if (currentStep >= 0) {
    pattern.steps.forEach((cell, s) => {
      if (cell && s === currentStep) {
        const el = document.querySelector(`.step[data-row="${cell.noteIdx}"][data-step="${s}"]`);
        if (el) el.classList.add('current');
      }
    });
  }

  // Note labels playing
  document.querySelectorAll('.note-label').forEach(el => el.classList.remove('playing', 'accent-label'));
  if (currentStep >= 0) {
    const cell = pattern.steps[currentStep];
    if (cell) {
      const label = document.getElementById(`label-${cell.noteIdx}`);
      if (label) {
        label.classList.add(cell.accent ? 'accent-label' : 'playing');
      }
    }
  }

  updatePatternButtons();
}

function buildPiano() {
  const piano = document.getElementById('piano');
  piano.innerHTML = '';

  // White keys first
  NOTES.forEach((n, i) => {
    if (!n.isBlack) {
      const key = document.createElement('div');
      key.className = 'white-key';
      key.dataset.noteIdx = i;
      key.innerHTML = '<span>' + n.note + n.octave + '</span>';
      key.addEventListener('mousedown', () => {
        initAudio();
        playNotePiano(i, 0.85);
        key.classList.add('playing');
        setTimeout(() => key.classList.remove('playing'), 200);
      });
      piano.appendChild(key);
    }
  });

  // Black keys overlay (positioned absolutely)
  const whiteKeyWidth = 36;
  const blackKeyWidth = 22;
  const positions = [0, 1, 3, 4, 5, 7, 8, 10, 11, 12, 13, 15, 16, 17];
  // C#(1), D#(3), F#(6), G#(8), A#(10), C#(13), D#(15), F#(18), G#(20), A#(22)
  const blackPositions = [1, 3, 6, 8, 10, 13, 15, 18, 20, 22];

  NOTES.forEach((n, i) => {
    if (n.isBlack) {
      const key = document.createElement('div');
      key.className = 'black-key';
      key.dataset.noteIdx = i;

      const pos = blackPositions.filter(p => p <= i).length - 1;
      const leftPx = pos * whiteKeyWidth + (whiteKeyWidth - blackKeyWidth / 2);
      key.style.left = leftPx + 'px';

      key.innerHTML = '<span>' + n.note + '</span>';
      key.addEventListener('mousedown', () => {
        initAudio();
        playNotePiano(i, 0.85);
        key.classList.add('playing');
        setTimeout(() => key.classList.remove('playing'), 200);
      });
      piano.appendChild(key);
    }
  });
}

// Scheduler
function getStepDuration(step) {
  const baseStepMs = (60000 / bpm) / 4; // 16th note
  if (step % 2 === 1 && swing > 0) {
    return baseStepMs * (1 + swing / 200);
  } else if (step % 2 === 0 && swing > 0 && step > 0) {
    return baseStepMs * (1 - swing / 200);
  }
  return baseStepMs;
}

function scheduler() {
  const pattern = patterns[currentPattern];
  const now = audioCtx ? audioCtx.currentTime : 0;

  while (nextNoteTime < now + 0.1) {
    const cell = pattern.steps[currentStep];
    if (cell) {
      playNote(cell.noteIdx, velocity, cell.accent);
    }

    // Advance
    currentStep = (currentStep + 1) % NUM_STEPS;
    const dur = getStepDuration(currentStep === 0 ? NUM_STEPS - 1 : currentStep - 1);
    nextNoteTime += dur / 1000;

    // Update UI
    renderGrid();
    document.getElementById('currentStep').textContent = currentStep;
  }
}

function startSequencer() {
  initAudio();
  if (isPlaying) return;
  isPlaying = true;
  currentStep = -1;
  nextNoteTime = audioCtx.currentTime + 0.05;

  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('modeDot').classList.add('live');
  document.getElementById('modeLabel').textContent = 'Playing';

  schedulerTimer = setInterval(scheduler, 25);
}

function stopSequencer() {
  if (!isPlaying) return;
  isPlaying = false;
  clearInterval(schedulerTimer);
  schedulerTimer = null;
  currentStep = -1;

  document.getElementById('playBtn').classList.remove('playing');
  document.getElementById('modeDot').classList.remove('live');
  document.getElementById('modeLabel').textContent = 'Stopped';
  document.getElementById('currentStep').textContent = '—';

  renderGrid();
}

function updateStats() {
  const count = patterns[currentPattern].steps.filter(s => s !== null).length;
  document.getElementById('noteCount').textContent = count;
}

function updatePatternButtons() {
  document.querySelectorAll('.pattern-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.pattern) === currentPattern);
  });
}

// Tap tempo
function handleTap() {
  const now = Date.now();
  tapTimes.push(now);
  if (tapTimes.length > 4) tapTimes.shift();
  if (tapTimes.length >= 2) {
    const intervals = [];
    for (let i = 1; i < tapTimes.length; i++) {
      intervals.push(tapTimes[i] - tapTimes[i - 1]);
    }
    const avg = intervals.reduce((a, b) => a + b, 0) / intervals.length;
    const newBpm = Math.round(60000 / avg);
    if (newBpm >= 40 && newBpm <= 200) {
      bpm = newBpm;
      document.getElementById('bpmInput').value = bpm;
    }
  }
}

// Event listeners
document.getElementById('playBtn').addEventListener('click', () => {
  if (isPlaying) stopSequencer(); else startSequencer();
});

document.getElementById('stopBtn').addEventListener('click', stopSequencer);

document.getElementById('tapBtn').addEventListener('click', handleTap);

document.getElementById('accentBtn').addEventListener('click', () => {
  accentMode = !accentMode;
  document.getElementById('accentBtn').classList.toggle('active', accentMode);
});

document.getElementById('bpmInput').addEventListener('change', (e) => {
  let val = parseInt(e.target.value);
  if (val < 40) val = 40;
  if (val > 200) val = 200;
  bpm = val;
  e.target.value = bpm;
});

document.getElementById('swingBtn').addEventListener('click', () => {
  swing = swing === 0 ? 50 : swing === 50 ? 75 : 0;
  document.getElementById('swingBtn').textContent = 'SW ' + swing + '%';
  document.getElementById('swingBtn').style.borderColor = swing > 0 ? 'var(--magenta)' : '';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  patterns[currentPattern].steps = Array(NUM_STEPS).fill(null);
  renderGrid();
  updateStats();
});

document.querySelectorAll('.pattern-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentPattern = parseInt(btn.dataset.pattern);
    renderGrid();
    updateStats();
  });
});

document.getElementById('octUp').addEventListener('click', () => {
  octaveOffset++;
  document.getElementById('octDisplay').textContent = 'C' + (4 + octaveOffset + 1);
});

document.getElementById('octDown').addEventListener('click', () => {
  octaveOffset--;
  document.getElementById('octDisplay').textContent = 'C' + (4 + octaveOffset + 1);
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;

  if (e.code === 'Space') {
    e.preventDefault();
    if (isPlaying) stopSequencer(); else startSequencer();
  }
  if (e.key === 'a' || e.key === 'A') {
    accentMode = !accentMode;
    document.getElementById('accentBtn').classList.toggle('active', accentMode);
  }
  if (e.key === 'c' || e.key === 'C') {
    patterns[currentPattern].steps = Array(NUM_STEPS).fill(null);
    renderGrid();
    updateStats();
  }
  if (e.key >= '1' && e.key <= '4') {
    currentPattern = parseInt(e.key) - 1;
    renderGrid();
    updateStats();
  }
  if (e.key === 'ArrowUp') {
    octaveOffset++;
    document.getElementById('octDisplay').textContent = 'C' + (4 + octaveOffset + 1);
  }
  if (e.key === 'ArrowDown') {
    octaveOffset--;
    document.getElementById('octDisplay').textContent = 'C' + (4 + octaveOffset + 1);
  }
  if (e.key === 't' || e.key === 'T') {
    handleTap();
  }
});

// Velocity slider
function buildVelocitySlider() {
  const container = document.createElement('div');
  container.className = 'velocity-row';
  container.style.cssText = 'max-width:960px; width:100%; margin-top: 12px;';

  const label = document.createElement('span');
  label.className = 'vel-label';
  label.textContent = 'VEL';

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.className = 'vel-slider';
  slider.min = 20;
  slider.max = 100;
  slider.value = 85;
  slider.addEventListener('input', (e) => {
    velocity = parseInt(e.target.value) / 100;
    e.target.nextElementSibling.textContent = Math.round(velocity * 100);
  });

  const val = document.createElement('span');
  val.className = 'vel-value';
  val.textContent = '85';

  container.appendChild(label);
  container.appendChild(slider);
  container.appendChild(val);

  const mainArea = document.querySelector('.main-area');
  mainArea.appendChild(container);
}

// Init
buildSequencerGrid();
buildPiano();
buildVelocitySlider();
updateStats();
updatePatternButtons();

// Load a default pattern — deep house style bassline
(function loadDefaultPattern() {
  // C minor feel: C3, Eb3, F3, G3 across steps
  const noteMap = NOTES.reduce((acc, n, i) => {
    acc[n.note + n.octave] = i;
    return acc;
  }, {});

  function getRow(note, oct) {
    return NOTES.findIndex(n => n.note === note && n.octave === oct);
  }

  // Pattern A: 16-step melodic sequence
  const patternA = [
    { step: 0,  note: 'C3',  accent: true },
    { step: 2,  note: 'Eb3', accent: false },
    { step: 4,  note: 'G3',  accent: false },
    { step: 6,  note: 'Bb3', accent: false },
    { step: 8,  note: 'C4',  accent: true },
    { step: 10, note: 'Eb4', accent: false },
    { step: 12, note: 'G3',  accent: false },
    { step: 14, note: 'Bb3', accent: false },
  ];

  patternA.forEach(({ step, note, accent }) => {
    const row = getRow(note.slice(0, -1), parseInt(note.slice(-1)));
    if (row >= 0) {
      patterns[0].steps[step] = { noteIdx: row, accent };
    }
  });

  renderGrid();
  updateStats();
})();
</script>
