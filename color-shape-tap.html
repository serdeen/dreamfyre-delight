<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color & Shape Tap!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #ff3b3b;
    --blue: #3b7aff;
    --yellow: #ffd600;
    --green: #3bcc6e;
    --orange: #ff8c3b;
    --purple: #9b3bff;
    --pink: #ff3baa;
    --teal: #00c8c8;
    --bg: #f0f4ff;
    --text: #2a3a5a;
  }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }

  header {
    text-align: center;
    padding: 20px 16px 8px;
    width: 100%;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .subtitle {
    font-size: 0.75rem;
    color: #7a8aaa;
    margin-top: 2px;
  }

  .score-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 8px 16px;
    width: 100%;
  }

  .score-pill {
    background: white;
    border-radius: 40px;
    padding: 6px 20px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .score-pill .emoji {
    font-size: 1.1rem;
  }

  /* Challenge area */
  .challenge-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 8px 16px;
    min-height: 200px;
  }

  .challenge-label {
    font-size: 0.8rem;
    color: #7a8aaa;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .challenge-shape {
    width: 120px;
    height: 120px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    margin-bottom: 16px;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    transition: transform 0.1s;
  }

  .challenge-shape:active {
    transform: scale(0.92);
  }

  .challenge-name {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text);
    text-align: center;
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes celebrate {
    0%   { transform: scale(1) rotate(0deg); }
    25%  { transform: scale(1.3) rotate(-8deg); }
    50%  { transform: scale(1.3) rotate(8deg); }
    75%  { transform: scale(1.2) rotate(-4deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .celebrate {
    animation: celebrate 0.5s ease-out;
  }

  /* Grid of buttons */
  .button-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 12px 16px 20px;
    width: 100%;
    max-width: 480px;
  }

  .big-btn {
    border: none;
    border-radius: 20px;
    height: 80px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: 'Nunito', sans-serif;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    position: relative;
    overflow: hidden;
  }

  .big-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.1s;
  }

  .big-btn:hover::after { opacity: 1; }
  .big-btn:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

  .big-btn .icon { font-size: 2rem; }
  .big-btn .label { font-size: 0.7rem; font-weight: 800; color: rgba(0,0,0,0.7); }

  .btn-red { background: var(--red); }
  .btn-blue { background: var(--blue); }
  .btn-yellow { background: var(--yellow); }
  .btn-green { background: var(--green); }
  .btn-orange { background: var(--orange); }
  .btn-purple { background: var(--purple); }
  .btn-pink { background: var(--pink); }
  .btn-teal { background: var(--teal); }

  /* Star burst */
  .stars {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .star {
    position: absolute;
    font-size: 2rem;
    animation: starFly 0.8s ease-out forwards;
  }

  @keyframes starFly {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-120px) scale(0.5); opacity: 0; }
  }

  /* Feedback message */
  .feedback {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.5rem;
    font-weight: 800;
    pointer-events: none;
    z-index: 200;
    animation: feedbackPop 0.6s ease-out forwards;
    white-space: nowrap;
  }

  @keyframes feedbackPop {
    0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    30%  { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) translateY(-40px) scale(1); opacity: 0; }
  }

  /* Progress bar */
  .progress-bar {
    width: 100%;
    max-width: 480px;
    height: 8px;
    background: #dde4f0;
    border-radius: 4px;
    overflow: hidden;
    margin: 0 16px 8px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), #7dff6e);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<header>
  <h1>Color & Shape Tap! 🌟</h1>
  <p class="subtitle">Tap the right color!</p>
</header>

<div class="score-bar">
  <div class="score-pill">
    <span class="emoji" id="scoreEmoji">⭐</span>
    <span id="scoreText">0 correct</span>
  </div>
  <div class="score-pill">
    <span class="emoji">🔥</span>
    <span id="streakText">0 streak</span>
  </div>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill" style="width: 0%"></div>
</div>

<div class="challenge-area">
  <div class="challenge-label">Find this:</div>
  <div class="challenge-shape" id="challengeShape">🔴</div>
  <div class="challenge-name" id="challengeName">Red</div>
</div>

<div class="button-grid" id="buttonGrid"></div>

<script>
const COLORS = [
  { name: 'Red',    emoji: '🔴', class: 'btn-red',   cssVar: '#ff3b3b', speech: 'Red' },
  { name: 'Blue',   emoji: '🔵', class: 'btn-blue',  cssVar: '#3b7aff', speech: 'Blue' },
  { name: 'Yellow', emoji: '🟡', class: 'btn-yellow',cssVar: '#ffd600', speech: 'Yellow' },
  { name: 'Green',  emoji: '🟢', class: 'btn-green', cssVar: '#3bcc6e', speech: 'Green' },
  { name: 'Orange', emoji: '🟠', class: 'btn-orange',cssVar: '#ff8c3b', speech: 'Orange' },
  { name: 'Purple', emoji: '🟣', class: 'btn-purple',cssVar: '#9b3bff', speech: 'Purple' },
  { name: 'Pink',   emoji: '💗', class: 'btn-pink',  cssVar: '#ff3baa', speech: 'Pink' },
  { name: 'Teal',   emoji: '🩵', class: 'btn-teal',  cssVar: '#00c8c8', speech: 'Teal' },
];

const SHAPES = [
  { name: 'Circle',   emoji: '⚫',  speech: 'Circle' },
  { name: 'Square',   emoji: '🟥',  speech: 'Square' },
  { name: 'Triangle', emoji: '🔺',  speech: 'Triangle' },
  { name: 'Star',     emoji: '⭐',  speech: 'Star' },
  { name: 'Heart',    emoji: '❤️',  speech: 'Heart' },
  { name: 'Moon',     emoji: '🌙',  speech: 'Moon' },
  { name: 'Sun',      emoji: '☀️',  speech: 'Sun' },
  { name: 'Flower',   emoji: '🌸',  speech: 'Flower' },
];

let mode = 'colors'; // 'colors' or 'shapes'
let score = 0;
let streak = 0;
let correctAnswer = null;
let speechSynth = window.speechSynthesis;
let attempts = 0;
const TARGET = 10;

function speak(text) {
  if (!speechSynth) return;
  speechSynth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9;
  u.pitch = 1.2;
  speechSynth.speak(u);
}

function initAudio() {
  // Touch audio via Web Audio for feedback
  if (!window.audioCtx) {
    window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSuccess() {
  initAudio();
  const ctx = window.audioCtx;
  const now = ctx.currentTime;
  [523, 659, 784].forEach((freq, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.15, now + i * 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
    o.connect(g); g.connect(ctx.destination);
    o.start(now + i * 0.08);
    o.stop(now + i * 0.08 + 0.35);
  });
}

function playError() {
  initAudio();
  const ctx = window.audioCtx;
  const now = ctx.currentTime;
  [200, 150].forEach((freq, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.08, now + i * 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.2);
    o.connect(g); g.connect(ctx.destination);
    o.start(now + i * 0.12);
    o.stop(now + i * 0.12 + 0.25);
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function spawnStars(x, y) {
  const container = document.getElementById('stars');
  const emojis = ['⭐', '🌟', '✨', '💫', '🌈'];
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = (x + (Math.random() - 0.5) * 80) + 'px';
    s.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
    container.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

function showFeedback(text, color) {
  const el = document.createElement('div');
  el.className = 'feedback';
  el.textContent = text;
  el.style.color = color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function updateProgress() {
  const pct = Math.min(100, (score / TARGET) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
}

function newChallenge() {
  attempts = 0;

  if (mode === 'colors') {
    const pool = SHAPES; // use shapes too for variety
    const choice = COLORS[Math.floor(Math.random() * COLORS.length)];
    correctAnswer = choice;
    document.getElementById('challengeShape').textContent = choice.emoji;
    document.getElementById('challengeShape').style.background = choice.cssVar + '33';
    document.getElementById('challengeName').textContent = choice.name;

    // Speak after short delay
    setTimeout(() => speak(choice.speech), 300);
  } else {
    const choice = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    correctAnswer = choice;
    document.getElementById('challengeShape').textContent = choice.emoji;
    document.getElementById('challengeShape').style.background = 'white';
    document.getElementById('challengeName').textContent = choice.name;
    setTimeout(() => speak(choice.speech), 300);
  }
}

function buildButtons() {
  const grid = document.getElementById('buttonGrid');
  grid.innerHTML = '';

  const items = mode === 'colors' ? COLORS : SHAPES;
  shuffle(items).forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'big-btn ' + (mode === 'colors' ? item.class : 'btn-teal');
    btn.innerHTML = `<span class="icon">${item.emoji}</span><span class="label">${item.name}</span>`;
    btn.addEventListener('click', (e) => handleTap(item, e));
    grid.appendChild(btn);
  });
}

function handleTap(item, e) {
  attempts++;
  const isCorrect = item.name === correctAnswer.name;

  if (isCorrect) {
    score++;
    streak++;
    playSuccess();

    const rect = e.target.closest('.big-btn').getBoundingClientRect();
    spawnStars(rect.left + rect.width / 2, rect.top);

    const messages = ['⭐ Great!', '🌟 Yay!', '👏 Super!', '🎉 Woohoo!', '✨ Amazing!', '💯 Perfect!'];
    showFeedback(messages[Math.floor(Math.random() * messages.length)], '#3bcc6e');

    document.getElementById('challengeShape').classList.add('celebrate');
    setTimeout(() => document.getElementById('challengeShape').classList.remove('celebrate'), 600);

    document.getElementById('scoreText').textContent = score + ' correct';
    document.getElementById('streakText').textContent = streak + ' streak';
    updateProgress();

    if (score >= TARGET) {
      setTimeout(() => {
        showFeedback('🎊 YOU DID IT! 🎊', '#ffd600');
        speak('You did it! Great job!');
      }, 400);
      setTimeout(newChallenge, 2000);
    } else {
      setTimeout(newChallenge, 600);
    }
  } else {
    streak = 0;
    playError();
    document.getElementById('streakText').textContent = '0 streak';

    const rect = e.target.closest('.big-btn').getBoundingClientRect();
    showFeedback('🙈 Try again!', '#ff6b6b');
    speak('Try again! ' + correctAnswer.speech);

    // Wiggle the challenge
    const shape = document.getElementById('challengeShape');
    shape.style.animation = 'none';
    shape.offsetHeight; // reflow
    shape.style.animation = 'celebrate 0.3s ease';
  }
}

// Toggle between colors and shapes
function setMode(m) {
  mode = m;
  buildButtons();
  newChallenge();
}

// Build buttons and start
buildButtons();
newChallenge();

// Auto-switch every 10 challenges
setInterval(() => {
  setMode(mode === 'colors' ? 'shapes' : 'colors');
}, 0); // Let user decide — no auto-switch
</script>
</body>
</html>
