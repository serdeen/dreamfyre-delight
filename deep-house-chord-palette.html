<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Palette — Deep House</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #06060e;
    --surface: #0d0d1c;
    --surface2: #141428;
    --border: #1e1e3a;
    --border2: #2a2a50;
    --text: #e2d9f3;
    --text-dim: #6b6280;
    --root: #8b5cf6;
    --chord: #a78bfa;
    --note: #c4b5fd;
    --play: #34d399;
    --play-dim: #065f46;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  h1 { font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--root); opacity: 0.7; }

  .top {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 24px;
  }
  .bpm-row { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bpm-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); }
  .bpm-val {
    font-family: ui-monospace, monospace; font-size: 28px; font-weight: 700;
    color: var(--text); line-height: 1;
  }
  .bpm-btns { display: flex; gap: 4px; }
  .bpm-btn {
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
    width: 26px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .bpm-btn:hover { border-color: var(--root); }
  .bpm-btn:active { transform: scale(0.9); }

  .octave-row { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .oct-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); }
  .oct-val { font-family: ui-monospace, monospace; font-size: 20px; font-weight: 700; color: var(--chord); }
  .oct-btns { display: flex; gap: 4px; }
  .oct-btn {
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
    width: 26px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .oct-btn:hover { border-color: var(--chord); }
  .oct-btn:active { transform: scale(0.9); }

  .voicing-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); }
  .voicing-btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .voi-btn {
    padding: 4px 10px; border-radius: 5px; cursor: pointer;
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim);
    transition: all 0.12s;
  }
  .voi-btn:hover { border-color: var(--chord); color: var(--chord); }
  .voi-btn.active { background: var(--chord); border-color: var(--chord); color: #000; }

  /* ROOT NOTE SELECTOR */
  .root-selector {
    display: flex; gap: 6px; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 16px;
  }
  .root-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); }
  .note-btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .note-btn {
    width: 32px; height: 28px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600;
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .note-btn:hover { border-color: var(--root); color: var(--root); }
  .note-btn.active { background: var(--root); border-color: var(--root); color: #fff; }

  /* CHORD TYPE */
  .type-selector {
    display: flex; gap: 5px; flex-wrap: wrap; justify-content: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 16px;
    max-width: 700px;
  }
  .type-btn {
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
    font-size: 10px; letter-spacing: 0.05em; font-weight: 600;
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim);
    transition: all 0.12s;
  }
  .type-btn:hover { border-color: var(--chord); color: var(--chord); }
  .type-btn.active { background: var(--chord); border-color: var(--chord); color: #000; }

  /* CHORD DISPLAY */
  .chord-display {
    width: 100%; max-width: 720px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
    text-align: center;
  }
  .chord-name {
    font-family: ui-monospace, monospace; font-size: 48px; font-weight: 800;
    color: var(--text); letter-spacing: -1px; line-height: 1; margin-bottom: 4px;
  }
  .chord-type-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
  .chord-notes {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px;
  }
  .note-chip {
    padding: 6px 14px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border2);
    font-family: ui-monospace, monospace; font-size: 14px; font-weight: 700;
    color: var(--note); letter-spacing: 0.05em;
    transition: all 0.12s;
  }
  .note-chip.root { background: var(--root); border-color: var(--root); color: #fff; }
  .note-chip:hover { border-color: var(--chord); color: var(--chord); cursor: pointer; }
  .note-chip.root:hover { background: var(--root); color: #fff; }

  /* VOICING VISUAL */
  .voicing-visual {
    display: flex; justify-content: center; align-items: flex-end;
    gap: 4px; height: 100px; margin: 16px 0;
  }
  .key-block {
    width: 40px; border-radius: 4px 4px 0 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 6px;
    transition: all 0.12s;
    position: relative;
  }
  .key-block:hover { transform: scaleY(1.05); }
  .key-block.black { background: #1a1a2e; border: 1px solid #2a2a50; }
  .key-block.white { background: #d4c8e8; border: 1px solid #a89bc4; }
  .key-block.playing { background: var(--play) !important; border-color: var(--play) !important; }
  .key-note {
    font-size: 9px; font-weight: 700; font-family: ui-monospace, monospace;
    color: var(--text-dim);
  }
  .key-block.white .key-note { color: #4a3a6a; }
  .key-block.playing .key-note { color: #fff; }

  /* PROGRESSIONS */
  .prog-section {
    width: 100%; max-width: 720px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 20px;
  }
  .prog-title { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
  .prog-grid { display: flex; flex-direction: column; gap: 6px; }
  .prog-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .prog-label { font-size: 9px; color: var(--text-dim); width: 60px; flex-shrink: 0; letter-spacing: 0.05em; }
  .prog-chords { display: flex; gap: 5px; flex-wrap: wrap; }
  .prog-btn {
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
    font-size: 11px; font-family: ui-monospace, monospace; font-weight: 700;
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim);
    transition: all 0.12s;
  }
  .prog-btn:hover { border-color: var(--play); color: var(--play); }
  .prog-btn.active { background: var(--play-dim); border-color: var(--play); color: var(--play); }

  .play-prog-btn {
    padding: 10px 28px; border-radius: 8px; cursor: pointer;
    font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700;
    background: var(--play-dim); border: 1px solid var(--play); color: var(--play);
    transition: all 0.12s; margin-top: 12px;
  }
  .play-prog-btn:hover { background: var(--play); color: #000; }
  .play-prog-btn:active { transform: scale(0.95); }

  .stop-btn {
    padding: 10px 20px; border-radius: 8px; cursor: pointer;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim);
    transition: all 0.12s; margin-top: 12px;
  }
  .stop-btn:hover { border-color: var(--text-dim); color: var(--text); }

  /* PLAY CONTROLS */
  .play-controls { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>

<h1>Chord Palette — Deep House</h1>

<div class="top">
  <div class="bpm-row">
    <div class="bpm-label">BPM</div>
    <div class="bpm-val" id="bpmVal">124</div>
    <div class="bpm-btns">
      <button class="bpm-btn" id="bpmDn">&#9660;</button>
      <button class="bpm-btn" id="bpmUp">&#9650;</button>
    </div>
  </div>

  <div class="octave-row">
    <div class="oct-label">Octave</div>
    <div class="oct-val" id="octVal">3</div>
    <div class="oct-btns">
      <button class="oct-btn" id="octDn">&#9660;</button>
      <button class="oct-btn" id="octUp">&#9650;</button>
    </div>
  </div>

  <div>
    <div class="voicing-label" style="margin-bottom:6px;text-align:center">Voicing</div>
    <div class="voicing-btns">
      <button class="voi-btn active" data-voi="spread">Spread</button>
      <button class="voi-btn" data-voi="close">Close</button>
      <button class="voi-btn" data-voi="left">Left Hand</button>
      <button class="voi-btn" data-voi="right">Right Hand</button>
      <button class="voi-btn" data-voi="root">Root Only</button>
    </div>
  </div>

  <div class="play-controls">
    <button class="play-prog-btn" id="playChordBtn" style="margin:0">Play Chord</button>
    <button class="stop-btn" id="stopBtn">Stop</button>
  </div>
</div>

<div class="root-selector">
  <div class="root-label">Root:</div>
  <div class="note-btns">
    <button class="note-btn active" data-note="C">C</button>
    <button class="note-btn" data-note="C#">C#</button>
    <button class="note-btn" data-note="D">D</button>
    <button class="note-btn" data-note="D#">Eb</button>
    <button class="note-btn" data-note="E">E</button>
    <button class="note-btn" data-note="F">F</button>
    <button class="note-btn" data-note="F#">F#</button>
    <button class="note-btn" data-note="G">G</button>
    <button class="note-btn" data-note="G#">Ab</button>
    <button class="note-btn" data-note="A">A</button>
    <button class="note-btn" data-note="A#">Bb</button>
    <button class="note-btn" data-note="B">B</button>
  </div>
</div>

<div class="type-selector">
  <button class="type-btn" data-intervals="0,4,7">maj</button>
  <button class="type-btn" data-intervals="0,3,7">min</button>
  <button class="type-btn" data-intervals="0,4,7,11">maj7</button>
  <button class="type-btn active" data-intervals="0,3,7,10">min7</button>
  <button class="type-btn" data-intervals="0,4,7,10">7</button>
  <button class="type-btn" data-intervals="0,3,7,11">m(maj7)</button>
  <button class="type-btn" data-intervals="0,4,8,11">maj9</button>
  <button class="type-btn" data-intervals="0,3,7,10,14">min9</button>
  <button class="type-btn" data-intervals="0,4,7,10,14">9</button>
  <button class="type-btn" data-intervals="0,4,7,11,14">maj9#11</button>
  <button class="type-btn" data-intervals="0,3,7,10,13">min11</button>
  <button class="type-btn" data-intervals="0,4,7,11,18">maj13</button>
  <button class="type-btn" data-intervals="0,3,7,10,17">m13</button>
  <button class="type-btn" data-intervals="0,4,7,10,18">13</button>
  <button class="type-btn" data-intervals="0,5,7">sus4</button>
  <button class="type-btn" data-intervals="0,2,7">sus2</button>
  <button class="type-btn" data-intervals="0,4,8">aug</button>
  <button class="type-btn" data-intervals="0,3,6">dim</button>
</div>

<div class="chord-display">
  <div class="chord-name" id="chordName">Dm7</div>
  <div class="chord-type-label" id="chordTypeLabel">minor 7</div>
  <div class="chord-notes" id="chordNotes"></div>
  <div class="voicing-visual" id="voicingVisual"></div>
</div>

<div class="prog-section">
  <div class="prog-title">Deep House Progressions — Key of C</div>
  <div class="prog-grid">
    <div class="prog-row">
      <div class="prog-label">ii — V — I</div>
      <div class="prog-chords">
        <button class="prog-btn" data-chord="Dm7">Dm7</button>
        <button class="prog-btn" data-chord="G9">G9</button>
        <button class="prog-btn" data-chord="Cmaj9">Cmaj9</button>
      </div>
    </div>
    <div class="prog-row">
      <div class="prog-label">i — VII — VI</div>
      <div class="prog-chords">
        <button class="prog-btn" data-chord="Dm7">Dm7</button>
        <button class="prog-btn" data-chord="Cmaj7">Cmaj7</button>
        <button class="prog-btn" data-chord="Bm7b5">Bm7♭5</button>
      </div>
    </div>
    <div class="prog-row">
      <div class="prog-label">i — iv — VI</div>
      <div class="prog-chords">
        <button class="prog-btn" data-chord="Dm7">Dm7</button>
        <button class="prog-btn" data-chord="Gm7">Gm7</button>
        <button class="prog-btn" data-chord="Bm7b5">Bm7♭5</button>
      </div>
    </div>
    <div class="prog-row">
      <div class="prog-label">I — III — VI — II</div>
      <div class="prog-chords">
        <button class="prog-btn" data-chord="Cmaj9">Cmaj9</button>
        <button class="prog-btn" data-chord="Em7">Em7</button>
        <button class="prog-btn" data-chord="Am7">Am7</button>
        <button class="prog-btn" data-chord="Dm7">Dm7</button>
      </div>
    </div>
    <div class="prog-row">
      <div class="prog-label">I — iv — VI — V</div>
      <div class="prog-chords">
        <button class="prog-btn" data-chord="Cmaj9">Cmaj9</button>
        <button class="prog-btn" data-chord="Fmaj9">Fmaj9</button>
        <button class="prog-btn" data-chord="Am7">Am7</button>
        <button class="prog-btn" data-chord="G9">G9</button>
      </div>
    </div>
    <div class="prog-row">
      <div class="prog-label">Min9 groove</div>
      <div class="prog-chords">
        <button class="prog-btn" data-chord="Dm9">Dm9</button>
        <button class="prog-btn" data-chord="Em9">Em9</button>
        <button class="prog-btn" data-chord="Am7">Am7</button>
        <button class="prog-btn" data-chord="Gm9">Gm9</button>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="play-prog-btn" id="playProgBtn">Play Progression</button>
    <button class="stop-btn" id="stopProgBtn">Stop</button>
  </div>
</div>

<script>
(function() {
  let audioCtx = null;
  let currentRoot = 'D';
  let currentIntervals = [0, 3, 7, 10];
  let currentVoicing = 'spread';
  let octave = 3;
  let bpm = 124;
  let isPlaying = false;
  let progScheduler = null;
  let nextNoteTime = 0;
  let progIndex = 0;
  let progChords = [];

  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const BLACK_KEYS = ['C#','D#','F#','G#','A#'];
  const NOTE_HZ = { 'C':261.63,'C#':277.18,'D':293.66,'D#':311.13,'E':329.63,'F':349.23,'F#':369.99,'G':392.00,'G#':415.30,'A':440.00,'A#':466.16,'B':493.88 };

  const TYPE_LABELS = {
    '0,4,7': 'major', '0,3,7': 'minor', '0,4,7,11': 'major 7',
    '0,3,7,10': 'minor 7', '0,4,7,10': 'dominant 7', '0,3,7,11': 'minor major 7',
    '0,4,7,11,14': 'major 9', '0,3,7,10,14': 'minor 9', '0,4,7,10,14': 'dominant 9',
    '0,4,7,11,18': 'major 13', '0,3,7,10,17': 'minor 13', '0,4,7,10,18': 'dominant 13',
    '0,4,8': 'augmented', '0,3,6': 'diminished', '0,5,7': 'sus4', '0,2,7': 'sus2'
  };

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function midiToHz(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function noteToMidi(note, oct) {
    const idx = NOTE_NAMES.indexOf(note.replace('b','#').replace('Eb','D#').replace('Ab','G#').replace('Bb','A#').replace('Db','C#').replace('Gb','F#'));
    return (oct + 1) * 12 + idx;
  }

  function playNote(hz, time, dur, vol=0.25) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const_COMP = audioCtx.createDynamicsCompressor();
    osc.type = 'triangle';
    osc.frequency.value = hz;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.01);
    gain.gain.setValueAtTime(vol, time + dur - 0.02);
    gain.gain.linearRampToValueAtTime(0, time + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(time); osc.stop(time + dur);
  }

  function playChordAt(time) {
    const baseMidi = noteToMidi(currentRoot, octave);
    const hzs = currentIntervals.map(i => midiToHz(baseMidi + i));

    // Apply voicing
    let voicings = hzs;
    if (currentVoicing === 'close') {
      // All within one octave
    } else if (currentVoicing === 'left') {
      voicings = hzs.filter((_, i) => i <= 2).map(h => h * 0.5);
      voicings.push(...hzs.filter((_, i) => i > 2));
    } else if (currentVoicing === 'right') {
      voicings = hzs.filter((_, i) => i <= 1).map(h => h * 0.5);
      voicings.push(...hzs.filter((_, i) => i > 1));
    } else if (currentVoicing === 'root') {
      voicings = [hzs[0]];
    }
    // 'spread' = default voicing

    const dur = 60 / bpm * 1.5;
    voicings.forEach(hz => playNote(hz, time, dur, 0.22));
  }

  function playSingle() {
    initAudio();
    playChordAt(audioCtx.currentTime + 0.05);
  }

  // ---- UI ----
  function getChordName() {
    const root = currentRoot.replace('#', '♯');
    const intervals = currentIntervals.join(',');
    const suffix = TYPE_LABELS[intervals] || '';
    return root + (suffix.includes('minor') && !suffix.includes('minor major') ? 'm' : '') + (suffix.includes('dominant') ? '7' : '');
  }

  function getNoteNames() {
    const baseIdx = NOTE_NAMES.indexOf(currentRoot.replace('b','#').replace('Eb','D#').replace('Ab','G#').replace('Bb','A#').replace('Db','C#').replace('Gb','F#'));
    return currentIntervals.map(i => NOTE_NAMES[(baseIdx + i) % 12]);
  }

  function render() {
    document.getElementById('chordName').textContent = getChordName();
    const intervals = currentIntervals.join(',');
    document.getElementById('chordTypeLabel').textContent = TYPE_LABELS[intervals] || 'chord';

    const notesEl = document.getElementById('chordNotes');
    notesEl.innerHTML = '';
    getNoteNames().forEach((n, i) => {
      const chip = document.createElement('div');
      chip.className = 'note-chip' + (i === 0 ? ' root' : '');
      chip.textContent = n;
      chip.addEventListener('click', () => playNote(NOTE_HZ[n] * Math.pow(2, octave - 4), audioCtx.currentTime, 0.4, 0.3));
      notesEl.appendChild(chip);
    });

    renderKeyboard();
  }

  function renderKeyboard() {
    const visual = document.getElementById('voicingVisual');
    visual.innerHTML = '';

    const notes = getNoteNames();
    const baseMidi = noteToMidi(currentRoot, octave);
    const midiNotes = currentIntervals.map(i => baseMidi + i);

    // Piano keyboard: C3 to C5
    const startMidi = 48; // C3
    const endMidi = 72;   // C5

    for (let m = startMidi; m < endMidi; m++) {
      const noteName = NOTE_NAMES[m % 12];
      const isBlack = BLACK_KEYS.includes(noteName);
      const octaveNum = Math.floor(m / 12) - 1;
      const isActive = midiNotes.includes(m);
      const isRoot = m === baseMidi;

      const block = document.createElement('div');
      block.className = 'key-block ' + (isBlack ? 'black' : 'white');
      if (isActive) block.classList.add('playing');
      if (isRoot) {
        block.style.boxShadow = '0 0 8px #8b5cf6';
      }

      const noteLabel = document.createElement('div');
      noteLabel.className = 'key-note';
      noteLabel.textContent = noteName + octaveNum;
      block.appendChild(noteLabel);

      block.style.height = (isBlack ? 50 : 80) + 'px';

      block.addEventListener('click', () => {
        initAudio();
        playNote(midiToHz(m), audioCtx.currentTime, 0.5, 0.3);
        block.classList.add('playing');
        setTimeout(() => block.classList.remove('playing'), 300);
      });

      visual.appendChild(block);
    }
  }

  // Root selector
  document.querySelectorAll('.note-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRoot = btn.dataset.note;
      render();
    });
  });

  // Type selector
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentIntervals = btn.dataset.intervals.split(',').map(Number);
      render();
    });
  });

  // Voicing
  document.querySelectorAll('.voi-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.voi-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentVoicing = btn.dataset.voi;
      render();
    });
  });

  // BPM
  document.getElementById('bpmUp').addEventListener('click', () => {
    bpm = Math.min(140, bpm + 1); document.getElementById('bpmVal').textContent = bpm;
  });
  document.getElementById('bpmDn').addEventListener('click', () => {
    bpm = Math.max(90, bpm - 1); document.getElementById('bpmVal').textContent = bpm;
  });

  // Octave
  document.getElementById('octUp').addEventListener('click', () => {
    octave = Math.min(5, octave + 1); document.getElementById('octVal').textContent = octave; render();
  });
  document.getElementById('octDn').addEventListener('click', () => {
    octave = Math.max(2, octave - 1); document.getElementById('octVal').textContent = octave; render();
  });

  // Play/stop
  document.getElementById('playChordBtn').addEventListener('click', playSingle);
  document.getElementById('stopBtn').addEventListener('click', () => {
    // Stop not needed for single hits
  });

  // Progression play
  let progPlaying = false;
  let progTimer = null;
  let progNextTime = 0;
  let progIdx = 0;

  function playProgression() {
    const btns = document.querySelectorAll('.prog-btn.active');
    if (btns.length === 0) return;
    progChords = Array.from(btns).map(b => b.dataset.chord);
    if (progChords.length === 0) return;

    initAudio();
    progPlaying = true;
    progIdx = 0;
    progNextTime = audioCtx.currentTime + 0.05;
    scheduleProgression();
  }

  function scheduleProgression() {
    if (!progPlaying || progChords.length === 0) return;
    const lookAhead = 0.2;
    const scheduleAhead = 0.05;
    const beatDur = 60 / bpm * 4; // one bar per chord

    while (progNextTime < audioCtx.currentTime + lookAhead) {
      const chordStr = progChords[progIdx % progChords.length];
      // Parse and play
      const parsed = parseChordStr(chordStr);
      if (parsed) {
        const prevRoot = currentRoot;
        const prevIntervals = [...currentIntervals];
        currentRoot = parsed.root;
        currentIntervals = parsed.intervals;
        playChordAt(progNextTime);
        currentRoot = prevRoot;
        currentIntervals = prevIntervals;
      }

      progIdx++;
      progNextTime += beatDur;
    }

    progTimer = setTimeout(scheduleProgression, scheduleAhead * 1000);
  }

  function parseChordStr(str) {
    // e.g. "Dm7", "Cmaj9", "G9", "Am7", "Bm7b5"
    const match = str.match(/^([A-G]#?)m?(maj|dim|aug|sus|add)?(\d+|m)?(b5|#\d+)?/);
    if (!match) return null;
    const root = match[1];
    let type = '';
    if (match[2]) type += match[2];
    if (match[3]) type += match[3];
    if (match[4]) type += match[4];

    const intervalMap = {
      '': [0,4,7], 'm': [0,3,7], '7': [0,4,7,10],
      'm7': [0,3,7,10], 'maj7': [0,4,7,11], 'm(maj7)': [0,3,7,11],
      '9': [0,4,7,10,14], 'm9': [0,3,7,10,14], 'maj9': [0,4,7,11,14],
      '11': [0,3,7,10,17], 'm11': [0,3,7,10,17], '13': [0,4,7,10,18], 'm13': [0,3,7,10,17],
      'sus4': [0,5,7], 'sus2': [0,2,7], 'aug': [0,4,8], 'dim': [0,3,6],
      'm7b5': [0,3,6,10], 'm6': [0,3,7,9], '6': [0,4,7,9],
      'add9': [0,4,7,14], 'madd9': [0,3,7,14]
    };

    const intervals = intervalMap[type] || intervalMap[type.replace('m','')] || [0,4,7];
    return { root, intervals };
  }

  function stopProgression() {
    progPlaying = false;
    if (progTimer) clearTimeout(progTimer);
  }

  // Prog buttons
  document.querySelectorAll('.prog-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
    });
  });

  document.getElementById('playProgBtn').addEventListener('click', () => {
    const btns = document.querySelectorAll('.prog-btn.active');
    if (btns.length === 0) {
      // Auto-select first row
      document.querySelectorAll('.prog-row:first-child .prog-btn').forEach(b => b.classList.add('active'));
    }
    playProgression();
  });
  document.getElementById('stopProgBtn').addEventListener('click', stopProgression);

  document.getElementById('playChordBtn').addEventListener('click', playSingle);

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playSingle(); }
  });

  render();
})();
</script>
</body>
</html>
