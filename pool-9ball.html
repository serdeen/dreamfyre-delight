<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9-Ball Pool</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #1a1209; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
// === Tunables ===
const BALL_RADIUS = 10;
const POCKET_RADIUS = 20;
const FRICTION = 0.988;
const BOUNCE = 0.78;
const MIN_SPEED = 0.08;
const MAX_POWER = 22;

// Ball colors (solid fill)
const BALL_COLOR = [
  null, '#f5e642','#3b5d9e','#c0392b','#6b3fa0',
  '#e67e22','#27ae60','#7d3c1e','#111','#c9a84c',
];

// === State ===
let tableW, tableH, tableX, tableY;
let pockets = [];
let balls = [];
let cueBall = null;
let canShoot = false;
let dragStart = null;
let dragCurrent = null;
let messageText = '';
let messageAlpha = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(RGB, 255, 255, 255, 255);
  initTable();
  initBalls();
  showMsg('DRAG TO AIM  ·  RELEASE TO SHOOT');
}

function initTable() {
  let pad = min(width, height) * 0.04;
  tableW = width - pad * 2;
  tableH = tableW * 0.5;
  tableX = (width - tableW) / 2;
  tableY = (height - tableH) / 2 - 20;

  // 6 pockets: 3 top, 3 bottom
  pockets = [
    {x: tableX,              y: tableY},
    {x: tableX + tableW/2,   y: tableY},
    {x: tableX + tableW,     y: tableY},
    {x: tableX,              y: tableY + tableH},
    {x: tableX + tableW/2,   y: tableY + tableH},
    {x: tableX + tableW,     y: tableY + tableH},
  ];
}

function initBalls() {
  balls = [];
  // Rack: right third, 9-ball diamond
  let rx = tableX + tableW * 0.72;
  let ry = tableY + tableH / 2;
  let g = BALL_RADIUS * 2.3;
  // Row 1
  balls.push(mkBall(rx,      ry,      1));
  // Row 2
  balls.push(mkBall(rx+g,    ry-g*0.5, 2));
  balls.push(mkBall(rx+g,    ry+g*0.5, 3));
  // Row 3 — 9 in center
  balls.push(mkBall(rx+g*2,  ry-g,    4));
  balls.push(mkBall(rx+g*2,  ry,      9));
  balls.push(mkBall(rx+g*2,  ry+g,    5));
  // Row 4
  balls.push(mkBall(rx+g*3,  ry-g*0.5, 6));
  balls.push(mkBall(rx+g*3,  ry+g*0.5, 7));
  // Row 5
  balls.push(mkBall(rx+g*4,  ry,      8));

  cueBall = mkBall(tableX + tableW * 0.25, ry, 0);
  balls.push(cueBall);
}

function mkBall(x, y, num) {
  return {
    x, y, vx: 0, vy: 0,
    num, r: BALL_RADIUS,
    isCue: num === 0,
    scored: false,
  };
}

function draw() {
  background('#1a1209');
  drawTable();

  // Physics — run multiple substeps for stability
  let moving = false;
  for (let sub = 0; sub < 3; sub++) {
    for (let b of balls) b.vx *= 0.993, b.vy *= 0.993;

    for (let i = 0; i < balls.length; i++) {
      for (let j = i+1; j < balls.length; j++) {
        let a = balls[i], b = balls[j];
        if (a.scored || b.scored) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        let minD = a.r + b.r;
        if (dist < minD && dist > 0.001) {
          let nx = dx/dist, ny = dy/dist;
          let overlap = (minD - dist) * 0.5;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;
          let dvx = a.vx-b.vx, dvy = a.vy-b.vy;
          let dot = dvx*nx + dvy*ny;
          if (dot > 0) {
            a.vx -= dot*nx; a.vy -= dot*ny;
            b.vx += dot*nx; b.vy += dot*ny;
          }
        }
      }
    }

    for (let b of balls) {
      if (b.scored) continue;
      b.x += b.vx; b.y += b.vy;
      let spd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
      if (spd < MIN_SPEED) b.vx = 0, b.vy = 0;
      if (b.vx !== 0 || b.vy !== 0) moving = true;

      // Cushions
      if (b.x < tableX + b.r)     b.x = tableX+b.r,     b.vx *= -BOUNCE;
      if (b.x > tableX+tableW-b.r) b.x = tableX+tableW-b.r, b.vx *= -BOUNCE;
      if (b.y < tableY + b.r)     b.y = tableY+b.r,     b.vy *= -BOUNCE;
      if (b.y > tableY+tableH-b.r) b.y = tableY+tableH-b.r, b.vy *= -BOUNCE;
    }

    // Pockets
    for (let b of balls) {
      if (b.scored) continue;
      for (let p of pockets) {
        let dx = b.x-p.x, dy = b.y-p.y;
        if (Math.sqrt(dx*dx+dy*dy) < POCKET_RADIUS) {
          b.scored = true; b.vx = 0; b.vy = 0;
          if (b.isCue) {
            setTimeout(() => {
              b.scored = false;
              b.x = tableX + tableW * 0.25;
              b.y = tableY + tableH / 2;
              b.vx = 0; b.vy = 0;
              showMsg('SCRATCH!');
            }, 600);
          } else {
            let remaining = balls.filter(x => !x.isCue && !x.scored);
            if (remaining.length === 0) {
              showMsg('🏆 BRENDAN WINS!');
            } else {
              showMsg('BALL ' + b.num + '!');
            }
          }
        }
      }
    }
  }

  if (!moving && !canShoot) { canShoot = true; }
  for (let b of balls) drawBall(b);

  // Aiming line
  if (canShoot && cueBall && !cueBall.scored && dragStart && dragCurrent) {
    let dx = dragStart.x - dragCurrent.x;
    let dy = dragStart.y - dragCurrent.y;
    let len = Math.sqrt(dx*dx + dy*dy);
    if (len > 4) {
      let nx = dx/len, ny = dy/len;
      stroke(255,255,255,70);
      strokeWeight(2);
      line(cueBall.x, cueBall.y, cueBall.x+nx*2000, cueBall.y+ny*2000);
    }
  }

  // Title
  noStroke();
  fill(201,168,76);
  textFont('Georgia');
  textSize(min(width, height) * 0.025);
  textAlign(CENTER, TOP);
  text('9-BALL', width/2, 10);

  if (messageAlpha > 0) {
    fill(201,168,76, messageAlpha * 255);
    textSize(min(width, height) * 0.038);
    textAlign(CENTER, CENTER);
    text(messageText, width/2, height/2);
    messageAlpha = max(0, messageAlpha - 0.012);
  }
}

function drawTable() {
  // Outer wood rail
  fill('#3d2314'); stroke('#2a1810'); strokeWeight(4);
  rect(tableX-32, tableY-32, tableW+64, tableH+64, 8);
  // Inner rail
  fill(RAIL_COLOR = '#5c3a1e'); noStroke();
  rect(tableX-20, tableY-20, tableW+40, tableH+40, 5);
  // Felt
  fill('#236b3a'); rect(tableX, tableY, tableW, tableH);
  // Subtle texture
  stroke('#1e4d2b'); strokeWeight(0.4);
  for (let y = tableY; y < tableY+tableH; y += 6) line(tableX, y, tableX+tableW, y);
  // Pockets
  noStroke();
  for (let p of pockets) {
    fill('#080808');
    ellipse(p.x, p.y, POCKET_RADIUS*2.8, POCKET_RADIUS*2.8);
  }
  // Head string spot
  fill('#c9a84c'); noStroke();
  ellipse(tableX + tableW*0.25, tableY+tableH/2, 4, 4);
}

function drawBall(b) {
  if (b.scored) return;
  push();
  translate(b.x, b.y);
  // Shadow
  noStroke(); fill(0,0,0,35);
  ellipse(2, 3, b.r*2.3, b.r*2.3);
  // Ball
  fill(b.isCue ? '#f0f0f0' : BALL_COLOR[b.num]);
  stroke(0,0,0,100); strokeWeight(1.5);
  ellipse(0, 0, b.r*2, b.r*2);
  // Shine
  noStroke(); fill(255,255,255,55);
  ellipse(-b.r*0.3, -b.r*0.3, b.r*0.85, b.r*0.85);
  // Number
  if (!b.isCue) {
    fill(255,255,255,220); stroke(0,0,0,60); strokeWeight(0.8);
    ellipse(0, 0, b.r*1.15, b.r*1.15);
    noStroke(); fill(20);
    textSize(b.r * 0.85); textAlign(CENTER, CENTER);
    textStyle(BOLD);
    text(b.num, 0, 1);
  }
  pop();
}

function showMsg(t) {
  messageText = t;
  messageAlpha = 1.0;
}

function getPos() {
  return {x: mouseX, y: mouseY};
}

function mousePressed() { onStart(mouseX, mouseY); }
function mouseDragged() { onMove(mouseX, mouseY); }
function mouseReleased() { onEnd(); }

function touchStarted() {
  if (touches.length > 0) onStart(touches[0].x, touches[0].y);
  return false;
}
function touchMoved() {
  if (touches.length > 0) onMove(touches[0].x, touches[0].y);
  return false;
}
function touchEnded() { onEnd(); return false; }

function onStart(x, y) {
  if (!canShoot || !cueBall || cueBall.scored) return;
  if (dist(x, y, cueBall.x, cueBall.y) < BALL_RADIUS * 6) {
    dragStart = {x, y};
    dragCurrent = {x, y};
  }
}

function onMove(x, y) {
  if (dragStart) dragCurrent = {x, y};
}

function onEnd() {
  if (dragStart && dragCurrent && canShoot && cueBall && !cueBall.scored) {
    let dx = dragStart.x - dragCurrent.x;
    let dy = dragStart.y - dragCurrent.y;
    let len = Math.sqrt(dx*dx + dy*dy);
    if (len > 8) {
      let pwr = Math.min(len * 0.13, MAX_POWER);
      cueBall.vx = (dx/len) * pwr;
      cueBall.vy = (dy/len) * pwr;
      canShoot = false;
    }
  }
  dragStart = null;
  dragCurrent = null;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  initTable();
  // Rescale ball positions to new table
  // Re-init on resize for simplicity
  initBalls();
}
</script>
</body>
</html>
