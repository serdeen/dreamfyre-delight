<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octave Synth — Dreamfyre Delight</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --cyan: #00f5d4;
    --magenta: #f72585;
    --text: #e0e0e0;
    --text-dim: #666680;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(247,37,133,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(0,245,212,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
    margin-bottom: 1rem;
    text-transform: uppercase;
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
    width: 100%;
    max-width: 700px;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    min-width: 50px;
  }
  .octave-btns { display: flex; gap: 0.4rem; }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.12s ease;
    user-select: none;
  }
  .btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn.active {
    background: var(--cyan);
    color: var(--bg);
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,245,212,0.4);
  }
  .note-btn {
    width: 36px;
    height: 36px;
    font-size: 0.7rem;
    padding: 0;
  }
  .note-btn.sharp { background: var(--surface); border-color: var(--border); }
  .note-btn.sharp.active { background: var(--magenta); border-color: var(--magenta); color: #fff; }
  .scale-btn { padding: 0.4rem 0.8rem; font-size: 0.7rem; }
  .scale-btn.active { background: var(--magenta); color: #fff; border-color: var(--magenta); }

  /* Piano — real piano look */
  .piano {
    position: relative;
    display: flex;
    height: 160px;
    margin-top: 0.5rem;
  }
  .white-key {
    width: 46px;
    height: 100%;
    background: linear-gradient(180deg, #fefefe 0%, #f0f0f0 80%, #d8d8d8 100%);
    border: 1px solid #b0b0b0;
    border-top: none;
    border-radius: 0 0 4px 4px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    color: #888;
    transition: background 0.06s ease, box-shadow 0.06s ease;
    user-select: none;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.1), 0 2px 3px rgba(0,0,0,0.2);
  }
  .white-key:hover { background: linear-gradient(180deg, #fff 0%, #f8f8f8 80%, #e8e8e8 100%); }
  .white-key.in-scale { background: linear-gradient(180deg, #d0f0e8 0%, #b8e0d8 80%, #98d0c8 100%); border-color: var(--cyan); }
  .white-key.in-scale:hover { background: linear-gradient(180deg, #c0e8e0 0%, #a8d8d0 80%, #88d0c8 100%); }
  .white-key.pressed {
    background: linear-gradient(180deg, var(--cyan) 0%, #00d8b0 100%) !important;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.2), 0 0 20px rgba(0,245,212,0.5);
  }

  .black-key {
    position: absolute;
    top: 0;
    width: 28px;
    height: 62%;  /* Real pianos: black keys are about 60% the height of white keys */
    background: linear-gradient(180deg, #2c2c2c 0%, #111 60%, #333 100%);
    border: 1px solid #000;
    border-top: none;
    border-radius: 0 0 3px 3px;
    cursor: pointer;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.45rem;
    color: #666;
    transition: background 0.06s ease, box-shadow 0.06s ease;
    user-select: none;
    box-shadow: inset 0 -3px 5px rgba(0,0,0,0.5), 0 3px 4px rgba(0,0,0,0.4);
  }
  .black-key:hover { background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 60%, #2a2a2a 100%); }
  .black-key.in-scale { background: linear-gradient(180deg, #382840 0%, #18102a 60%, #2a1838 100%); border-color: var(--magenta); }
  .black-key.in-scale:hover { background: linear-gradient(180deg, #483050 0%, #281830 60%, #3a2848 100%); }
  .black-key.pressed {
    background: linear-gradient(180deg, var(--magenta) 0%, #900840 100%) !important;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 18px rgba(247,37,133,0.5);
  }

  .dimmed { opacity: 0.18 !important; pointer-events: none; }
</style>
</head>
<body>

<h1>Octave Synth</h1>

<div class="controls">
  <div class="control-row">
    <span class="control-label">Octave</span>
    <div class="octave-btns">
      <button class="btn octave-btn" data-octave="-2">-2</button>
      <button class="btn octave-btn" data-octave="-1">-1</button>
      <button class="btn octave-btn active" data-octave="0">0</button>
      <button class="btn octave-btn" data-octave="1">+1</button>
      <button class="btn octave-btn" data-octave="2">+2</button>
    </div>
  </div>
  <div class="control-row">
    <span class="control-label">Root</span>
    <button class="btn note-btn active" data-note="C">C</button>
    <button class="btn note-btn sharp" data-note="C#">C#</button>
    <button class="btn note-btn" data-note="D">D</button>
    <button class="btn note-btn sharp" data-note="D#">D#</button>
    <button class="btn note-btn" data-note="E">E</button>
    <button class="btn note-btn" data-note="F">F</button>
    <button class="btn note-btn sharp" data-note="F#">F#</button>
    <button class="btn note-btn" data-note="G">G</button>
    <button class="btn note-btn sharp" data-note="G#">G#</button>
    <button class="btn note-btn" data-note="A">A</button>
    <button class="btn note-btn sharp" data-note="A#">A#</button>
    <button class="btn note-btn" data-note="B">B</button>
  </div>
  <div class="control-row">
    <span class="control-label">Scale</span>
    <button class="btn scale-btn active" data-scale="major">Major</button>
    <button class="btn scale-btn" data-scale="minor">Minor</button>
    <button class="btn scale-btn" data-scale="pentatonic">Pentatonic</button>
    <button class="btn scale-btn" data-scale="blues">Blues</button>
  </div>
</div>

<div class="piano" id="piano"></div>

<script>
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES = {
  major:      [0, 2, 4, 5, 7, 9, 11],
  minor:      [0, 2, 3, 5, 7, 8, 10],
  pentatonic: [0, 2, 4, 7, 9],
  blues:      [0, 3, 5, 6, 7, 10],
};

// C4 to B5 — 14 white keys, 10 black keys
const WHITE_KEYS = [
  { note:'C',  octave:4 },
  { note:'D',  octave:4 },
  { note:'E',  octave:4 },
  { note:'F',  octave:4 },
  { note:'G',  octave:4 },
  { note:'A',  octave:4 },
  { note:'B',  octave:4 },
  { note:'C',  octave:5 },
  { note:'D',  octave:5 },
  { note:'E',  octave:5 },
  { note:'F',  octave:5 },
  { note:'G',  octave:5 },
  { note:'A',  octave:5 },
  { note:'B',  octave:5 },
];
// black key positions: [whiteKeyIndexBeforeIt, leftOffset]
const BLACK_KEYS = [
  { note:'C#', octave:4, whiteIdx:0, left:30 },
  { note:'D#', octave:4, whiteIdx:1, left:78 },
  { note:'F#', octave:4, whiteIdx:3, left:174 },
  { note:'G#', octave:4, whiteIdx:4, left:222 },
  { note:'A#', octave:4, whiteIdx:5, left:270 },
  { note:'C#', octave:5, whiteIdx:7, left:372 },
  { note:'D#', octave:5, whiteIdx:8, left:420 },
  { note:'F#', octave:5, whiteIdx:10, left:516 },
  { note:'G#', octave:5, whiteIdx:11, left:564 },
  { note:'A#', octave:5, whiteIdx:12, left:612 },
];

let audioCtx = null;
let masterGain = null;
let selectedOctave = 0;
let selectedRoot = 'C';
let selectedScale = 'major';
let activeNotes = {};
// Track active touch identifiers for swipe roll
let touchKeyMap = {};  // touchId -> {note, octave}

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.7;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function calcFreq(note, octave) {
  const semitonesFromA4 = NOTES.indexOf(note) - 9 + (octave - 4) * 12;
  return 440 * Math.pow(2, semitonesFromA4 / 12);
}

function getScaleNotes(root, scale) {
  const rootIdx = NOTES.indexOf(root);
  return SCALES[scale].map(i => NOTES[(rootIdx + i) % 12]);
}

function playNote(note, octave) {
  const ctx = getAudioCtx();
  const keyId = note + octave;
  if (activeNotes[keyId]) return;

  const freq = calcFreq(note, octave + selectedOctave);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = 'sine';
  osc.frequency.value = freq;

  // Smooth envelope — no clipping, natural decay
  // Keep per-note gain low enough that even many overlapping notes won't clip through master
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.015);    // fast attack
  gain.gain.setValueAtTime(0.2, now + 0.3);               // sustain
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5); // smooth long release

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start(now);
  osc.stop(now + 1.2);

  activeNotes[keyId] = { osc, gain };

  const el = document.querySelector(`[data-key="${note}${octave}"]`);
  if (el) {
    el.classList.add('pressed');
    setTimeout(() => el.classList.remove('pressed'), 300);
  }
}

function stopNote(note, octave) {
  const keyId = note + octave;
  if (activeNotes[keyId]) {
    const { osc, gain } = activeNotes[keyId];
    delete activeNotes[keyId];
    try {
      const now = audioCtx.currentTime;
      // Smooth release: cancel any future envelope changes, then ramp down naturally
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      osc.stop(now + 0.2);
    } catch(e) {
      try { osc.stop(); } catch(e2) {}
    }
  }
}

function buildPiano() {
  const piano = document.getElementById('piano');
  piano.innerHTML = '';
  const scaleNotes = getScaleNotes(selectedRoot, selectedScale);

  // White keys
  WHITE_KEYS.forEach((key, i) => {
    const div = document.createElement('div');
    div.className = 'white-key';
    div.dataset.key = key.note + key.octave;
    div.dataset.note = key.note;
    div.dataset.octave = key.octave;
    div.textContent = key.note + key.octave;

    if (!scaleNotes.includes(key.note)) div.classList.add('dimmed');
    else div.classList.add('in-scale');

    attachEvents(div, key.note, key.octave);
    piano.appendChild(div);
  });

  // Black keys
  BLACK_KEYS.forEach(key => {
    const div = document.createElement('div');
    div.className = 'black-key';
    div.dataset.key = key.note + key.octave;
    div.dataset.note = key.note;
    div.dataset.octave = key.octave;
    div.textContent = key.note;

    div.style.left = key.left + 'px';
    if (!scaleNotes.includes(key.note)) div.classList.add('dimmed');
    else div.classList.add('in-scale');

    attachEvents(div, key.note, key.octave);
    piano.appendChild(div);
  });
}

function attachEvents(el, note, octave) {
  // Mouse
  el.addEventListener('mousedown', e => { e.preventDefault(); playNote(note, octave); });
  el.addEventListener('mouseup', () => stopNote(note, octave));
  el.addEventListener('mouseleave', () => stopNote(note, octave));

  // Touch — swipe/roll support
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      touchKeyMap[t.identifier] = { note, octave };
      playNote(note, octave);
    }
  }, { passive: false });

  el.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const target = document.elementFromPoint(t.clientX, t.clientY);
      if (target && target.dataset.note) {
        const n = target.dataset.note;
        const o = parseInt(target.dataset.octave);
        const prev = touchKeyMap[t.identifier];
        if (prev && (prev.note !== n || prev.octave !== o)) {
          stopNote(prev.note, prev.octave);
          touchKeyMap[t.identifier] = { note: n, octave: o };
          playNote(n, o);
        }
      }
    }
  }, { passive: false });

  el.addEventListener('touchend', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const info = touchKeyMap[t.identifier];
      if (info) {
        stopNote(info.note, info.octave);
        delete touchKeyMap[t.identifier];
      }
    }
  }, { passive: false });

  el.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
      const info = touchKeyMap[t.identifier];
      if (info) {
        stopNote(info.note, info.octave);
        delete touchKeyMap[t.identifier];
      }
    }
  });
}

// Button events
document.querySelectorAll('.octave-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.octave-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedOctave = parseInt(btn.dataset.octave);
  });
});

document.querySelectorAll('.note-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedRoot = btn.dataset.note;
    buildPiano();
  });
});

document.querySelectorAll('.scale-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedScale = btn.dataset.scale;
    buildPiano();
  });
});

document.addEventListener('contextmenu', e => e.preventDefault());

buildPiano();
</script>
</body>
</html>
