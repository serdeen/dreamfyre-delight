<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octave Synth — Dreamfyre Delight</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --cyan: #00f5d4;
    --magenta: #f72585;
    --text: #e0e0e0;
    --text-dim: #666680;
    --white-key: #e8e8e8;
    --white-key-hover: #ffffff;
    --black-key: #1a1a1a;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(247,37,133,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(0,245,212,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    margin-bottom: 2rem;
    width: 100%;
    max-width: 700px;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    min-width: 60px;
  }
  .octave-btns {
    display: flex;
    gap: 0.5rem;
  }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.6rem 1rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .btn.active {
    background: var(--cyan);
    color: var(--bg);
    border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(0,245,212,0.4);
  }
  .note-btn {
    width: 40px;
    height: 40px;
    font-size: 0.75rem;
    padding: 0;
  }
  .note-btn.sharp {
    background: var(--surface);
    border-color: var(--border);
  }
  .note-btn.sharp.active {
    background: var(--magenta);
    border-color: var(--magenta);
    color: #fff;
  }
  .scale-btn {
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
  }
  .scale-btn.active {
    background: var(--magenta);
    color: #fff;
    border-color: var(--magenta);
  }

  /* Piano keyboard */
  .piano-wrap {
    position: relative;
    margin-top: 1rem;
  }

  .white-keys {
    display: flex;
    gap: 2px;
  }
  .white-key {
    width: 48px;
    height: 180px;
    background: linear-gradient(180deg, var(--white-key) 0%, #c8c8c8 100%);
    border: 1px solid #888;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: #555;
    transition: transform 0.06s ease, background 0.06s ease, box-shadow 0.06s ease;
    transform-origin: top center;
    user-select: none;
  }
  .white-key:hover {
    background: linear-gradient(180deg, var(--white-key-hover) 0%, #e0e0e0 100%);
  }
  .white-key.in-scale {
    background: linear-gradient(180deg, #b8e8e0 0%, #90d0c8 100%);
    border-color: var(--cyan);
  }
  .white-key.in-scale:hover {
    background: linear-gradient(180deg, #a0e0d8 0%, #80c8c0 100%);
  }
  .white-key.pressed {
    transform: translateY(4px);
    background: linear-gradient(180deg, var(--cyan) 0%, #00c8a8 100%) !important;
    box-shadow: 0 0 24px rgba(0,245,212,0.7);
  }

  .black-keys {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 115px;
    z-index: 2;
    pointer-events: none;
  }
  .black-key {
    position: absolute;
    width: 30px;
    height: 115px;
    background: linear-gradient(180deg, #2a2a2a 0%, #0a0a0a 100%);
    border: 1px solid #000;
    border-radius: 0 0 4px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.5rem;
    color: #555;
    transition: transform 0.06s ease, background 0.06s ease, box-shadow 0.06s ease;
    transform-origin: top center;
    pointer-events: auto;
    user-select: none;
  }
  .black-key:hover {
    background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 100%);
  }
  .black-key.in-scale {
    background: linear-gradient(180deg, #3a2850 0%, #1a0830 100%);
    border-color: var(--magenta);
  }
  .black-key.in-scale:hover {
    background: linear-gradient(180deg, #4a3860 0%, #2a1840 100%);
  }
  .black-key.pressed {
    transform: translateY(3px);
    background: linear-gradient(180deg, var(--magenta) 0%, #a01050 100%) !important;
    box-shadow: 0 0 20px rgba(247,37,133,0.7);
  }

  .dimmed {
    opacity: 0.2 !important;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>Octave Synth</h1>

<div class="controls">
  <div class="control-row">
    <span class="control-label">Octave</span>
    <div class="octave-btns">
      <button class="btn octave-btn" data-octave="-2">-2</button>
      <button class="btn octave-btn" data-octave="-1">-1</button>
      <button class="btn octave-btn active" data-octave="0">0</button>
      <button class="btn octave-btn" data-octave="1">+1</button>
      <button class="btn octave-btn" data-octave="2">+2</button>
    </div>
  </div>
  <div class="control-row">
    <span class="control-label">Root</span>
    <button class="btn note-btn active" data-note="C">C</button>
    <button class="btn note-btn sharp" data-note="C#">C#</button>
    <button class="btn note-btn" data-note="D">D</button>
    <button class="btn note-btn sharp" data-note="D#">D#</button>
    <button class="btn note-btn" data-note="E">E</button>
    <button class="btn note-btn" data-note="F">F</button>
    <button class="btn note-btn sharp" data-note="F#">F#</button>
    <button class="btn note-btn" data-note="G">G</button>
    <button class="btn note-btn sharp" data-note="G#">G#</button>
    <button class="btn note-btn" data-note="A">A</button>
    <button class="btn note-btn sharp" data-note="A#">A#</button>
    <button class="btn note-btn" data-note="B">B</button>
  </div>
  <div class="control-row">
    <span class="control-label">Scale</span>
    <button class="btn scale-btn active" data-scale="major">Major</button>
    <button class="btn scale-btn" data-scale="minor">Minor</button>
    <button class="btn scale-btn" data-scale="pentatonic">Pentatonic</button>
    <button class="btn scale-btn" data-scale="blues">Blues</button>
  </div>
</div>

<div class="piano-wrap">
  <div class="white-keys" id="whiteKeys"></div>
  <div class="black-keys" id="blackKeys"></div>
</div>

<script>
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES = {
  major:      [0, 2, 4, 5, 7, 9, 11],
  minor:      [0, 2, 3, 5, 7, 8, 10],
  pentatonic: [0, 2, 4, 7, 9],
  blues:      [0, 3, 5, 6, 7, 10],
};

// 2 octaves: C4 to B5
const WHITE_KEYS_LAYOUT = [
  { note: 'C',  octave: 4 },
  { note: 'D',  octave: 4 },
  { note: 'E',  octave: 4 },
  { note: 'F',  octave: 4 },
  { note: 'G',  octave: 4 },
  { note: 'A',  octave: 4 },
  { note: 'B',  octave: 4 },
  { note: 'C',  octave: 5 },
  { note: 'D',  octave: 5 },
  { note: 'E',  octave: 5 },
  { note: 'F',  octave: 5 },
  { note: 'G',  octave: 5 },
  { note: 'A',  octave: 5 },
  { note: 'B',  octave: 5 },
];

const BLACK_KEYS_LAYOUT = [
  { note: 'C#', octave: 4, whiteIdx: 0 },
  { note: 'D#', octave: 4, whiteIdx: 1 },
  { note: 'F#', octave: 4, whiteIdx: 3 },
  { note: 'G#', octave: 4, whiteIdx: 4 },
  { note: 'A#', octave: 4, whiteIdx: 5 },
  { note: 'C#', octave: 5, whiteIdx: 7 },
  { note: 'D#', octave: 5, whiteIdx: 8 },
  { note: 'F#', octave: 5, whiteIdx: 10 },
  { note: 'G#', octave: 5, whiteIdx: 11 },
  { note: 'A#', octave: 5, whiteIdx: 12 },
];

// Pixel positions for black keys (left edge, each white key = 50px with 2px gap)
const KEY_SPACING = 50;
const BLACK_KEY_LEFT = {
  0: 34,  // C# over C (white key 0, 48px wide centered at 24, black key 30px centered at 15 → 24-15=9... actually simpler: just center it)
  // Let's use: white key center = whiteIdx * 50 + 24, black key center = white key center - 15, so left = whiteIdx * 50 + 9
  1: 59,  // D# over D
  3: 159, // F# over F
  4: 209, // G# over G
  5: 259, // A# over A
  7: 359, // C# over C (octave 5)
  8: 409, // D# over D
  10: 509, // F# over F
  11: 559, // G# over G
  12: 609, // A# over A
};

let audioCtx = null;
let selectedOctave = 0;
let selectedRoot = 'C';
let selectedScale = 'major';
let activeNotes = {};

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Calculate frequency for a note and octave
// A4 = 440Hz, each semitone = *2^(1/12)
function calcFreq(note, octave) {
  const semitonesFromA4 = NOTES.indexOf(note) - 9 + (octave - 4) * 12;
  return 440 * Math.pow(2, semitonesFromA4 / 12);
}

function getScaleNotes(root, scale) {
  const rootIdx = NOTES.indexOf(root);
  return SCALES[scale].map(interval => {
    const noteIdx = (rootIdx + interval) % 12;
    return NOTES[noteIdx];
  });
}

function playNote(note, octave) {
  const ctx = getAudioCtx();
  const keyId = note + octave;

  // Stop existing note at this key
  if (activeNotes[keyId]) {
    try { activeNotes[keyId].osc.stop(); } catch(e) {}
    delete activeNotes[keyId];
  }

  const freq = calcFreq(note, octave + selectedOctave);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = 'sine';
  osc.frequency.value = freq;

  // Envelope: quick attack, sustain, release
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.35, now + 0.01);
  gain.gain.setValueAtTime(0.35, now + 0.5);
  gain.gain.linearRampToValueAtTime(0, now + 0.9);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now + 0.9);

  activeNotes[keyId] = { osc, gain };

  // Visual feedback
  const el = document.querySelector(`[data-key="${note}${octave}"]`);
  if (el) {
    el.classList.add('pressed');
    setTimeout(() => el.classList.remove('pressed'), 250);
  }
}

function stopNote(note, octave) {
  const keyId = note + octave;
  if (activeNotes[keyId]) {
    try { activeNotes[keyId].osc.stop(); } catch(e) {}
    delete activeNotes[keyId];
  }
}

function buildKeyboard() {
  const whiteContainer = document.getElementById('whiteKeys');
  const blackContainer = document.getElementById('blackKeys');
  whiteContainer.innerHTML = '';
  blackContainer.innerHTML = '';

  const scaleNotes = getScaleNotes(selectedRoot, selectedScale);

  // White keys
  WHITE_KEYS_LAYOUT.forEach((key, i) => {
    const div = document.createElement('div');
    div.className = 'white-key';
    div.dataset.key = key.note + key.octave;
    div.dataset.note = key.note;
    div.dataset.octave = key.octave;
    div.textContent = key.note + key.octave;

    if (!scaleNotes.includes(key.note)) {
      div.classList.add('dimmed');
    } else {
      div.classList.add('in-scale');
    }

    // Mouse events
    div.addEventListener('mousedown', e => { e.preventDefault(); playNote(key.note, key.octave); });
    div.addEventListener('mouseup', () => stopNote(key.note, key.octave));
    div.addEventListener('mouseleave', () => stopNote(key.note, key.octave));

    // Touch events
    div.addEventListener('touchstart', e => { e.preventDefault(); playNote(key.note, key.octave); }, { passive: false });
    div.addEventListener('touchend', e => { e.preventDefault(); stopNote(key.note, key.octave); }, { passive: false });

    whiteContainer.appendChild(div);
  });

  // Black keys
  BLACK_KEYS_LAYOUT.forEach(key => {
    const div = document.createElement('div');
    div.className = 'black-key';
    div.dataset.key = key.note + key.octave;
    div.dataset.note = key.note;
    div.dataset.octave = key.octave;
    div.textContent = key.note;

    const left = key.whiteIdx * KEY_SPACING + 9;
    div.style.left = left + 'px';

    if (!scaleNotes.includes(key.note)) {
      div.classList.add('dimmed');
    } else {
      div.classList.add('in-scale');
    }

    // Mouse events
    div.addEventListener('mousedown', e => { e.preventDefault(); playNote(key.note, key.octave); });
    div.addEventListener('mouseup', () => stopNote(key.note, key.octave));
    div.addEventListener('mouseleave', () => stopNote(key.note, key.octave));

    // Touch events
    div.addEventListener('touchstart', e => { e.preventDefault(); playNote(key.note, key.octave); }, { passive: false });
    div.addEventListener('touchend', e => { e.preventDefault(); stopNote(key.note, key.octave); }, { passive: false });

    blackContainer.appendChild(div);
  });
}

// Octave buttons
document.querySelectorAll('.octave-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.octave-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedOctave = parseInt(btn.dataset.octave);
  });
});

// Root note buttons
document.querySelectorAll('.note-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedRoot = btn.dataset.note;
    buildKeyboard();
  });
});

// Scale buttons
document.querySelectorAll('.scale-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedScale = btn.dataset.scale;
    buildKeyboard();
  });
});

// Prevent context menu on long press
document.addEventListener('contextmenu', e => e.preventDefault());

buildKeyboard();
</script>
</body>
</html>
