<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octave Synth — Dreamfyre Delight</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --cyan: #00f5d4;
    --magenta: #f72585;
    --text: #e0e0e0;
    --text-dim: #666680;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(247,37,133,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(0,245,212,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    margin-bottom: 2rem;
    width: 100%;
    max-width: 700px;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    min-width: 60px;
  }
  .octave-btns {
    display: flex;
    gap: 0.5rem;
  }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.6rem 1rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .btn.active {
    background: var(--cyan);
    color: var(--bg);
    border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(0,245,212,0.4);
  }
  .note-btn {
    width: 40px;
    height: 40px;
    font-size: 0.75rem;
    padding: 0;
  }
  .note-btn.sharp {
    background: var(--surface);
    border-color: var(--border);
  }
  .note-btn.sharp.active {
    background: var(--magenta);
    border-color: var(--magenta);
    box-shadow: 0 0 12px rgba(247,37,133,0.4);
  }
  .scale-btn {
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
  }
  .scale-btn.active {
    background: var(--magenta);
    color: #fff;
    border-color: var(--magenta);
  }

  /* Piano keyboard */
  .keyboard {
    display: flex;
    position: relative;
    height: 200px;
    margin-top: 1rem;
  }
  .white-key {
    width: 44px;
    height: 100%;
    background: linear-gradient(180deg, #e8e8e8 0%, #d4d4d4 100%);
    border: 1px solid #999;
    border-radius: 0 0 4px 4px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: #333;
    transition: all 0.08s ease;
  }
  .white-key:hover {
    background: linear-gradient(180deg, #fff 0%, #e8e8e8 100%);
  }
  .white-key.in-scale {
    background: linear-gradient(180deg, #d0f0f0 0%, #a8e0e0 100%);
    border-color: var(--cyan);
  }
  .white-key.in-scale:hover {
    background: linear-gradient(180deg, #c0f0f0 0%, #90e0e0 100%);
  }
  .white-key.pressed {
    background: linear-gradient(180deg, var(--cyan) 0%, #00c8a8 100%);
    box-shadow: 0 0 20px rgba(0,245,212,0.6);
  }
  .black-key {
    width: 28px;
    height: 130px;
    background: linear-gradient(180deg, #333 0%, #111 100%);
    border: 1px solid #000;
    border-radius: 0 0 3px 3px;
    position: absolute;
    z-index: 2;
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.5rem;
    color: #666;
    transition: all 0.08s ease;
  }
  .black-key:hover {
    background: linear-gradient(180deg, #444 0%, #222 100%);
  }
  .black-key.in-scale {
    background: linear-gradient(180deg, #3a2a50 0%, #1a1030 100%);
    border-color: var(--magenta);
  }
  .black-key.in-scale:hover {
    background: linear-gradient(180deg, #4a3a60 0%, #2a2040 100%);
  }
  .black-key.pressed {
    background: linear-gradient(180deg, var(--magenta) 0%, #a01050 100%);
    box-shadow: 0 0 16px rgba(247,37,133,0.6);
  }
  .black-key.dimmed,
  .white-key.dimmed {
    opacity: 0.25;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>Octave Synth</h1>

<div class="controls">
  <div class="control-row">
    <span class="control-label">Octave</span>
    <div class="octave-btns">
      <button class="btn octave-btn" data-octave="-2">-2</button>
      <button class="btn octave-btn" data-octave="-1">-1</button>
      <button class="btn octave-btn active" data-octave="0">0</button>
      <button class="btn octave-btn" data-octave="1">+1</button>
      <button class="btn octave-btn" data-octave="2">+2</button>
    </div>
  </div>
  <div class="control-row">
    <span class="control-label">Root</span>
    <button class="btn note-btn active" data-note="C">C</button>
    <button class="btn note-btn sharp" data-note="C#">C#</button>
    <button class="btn note-btn" data-note="D">D</button>
    <button class="btn note-btn sharp" data-note="D#">D#</button>
    <button class="btn note-btn" data-note="E">E</button>
    <button class="btn note-btn" data-note="F">F</button>
    <button class="btn note-btn sharp" data-note="F#">F#</button>
    <button class="btn note-btn" data-note="G">G</button>
    <button class="btn note-btn sharp" data-note="G#">G#</button>
    <button class="btn note-btn" data-note="A">A</button>
    <button class="btn note-btn sharp" data-note="A#">A#</button>
    <button class="btn note-btn" data-note="B">B</button>
  </div>
  <div class="control-row">
    <span class="control-label">Scale</span>
    <button class="btn scale-btn active" data-scale="major">Major</button>
    <button class="btn scale-btn" data-scale="minor">Minor</button>
    <button class="btn scale-btn" data-scale="pentatonic">Pentatonic</button>
    <button class="btn scale-btn" data-scale="blues">Blues</button>
  </div>
</div>

<div class="keyboard" id="keyboard"></div>

<script>
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES = {
  major:      [0, 2, 4, 5, 7, 9, 11],
  minor:      [0, 2, 3, 5, 7, 8, 10],
  pentatonic: [0, 2, 4, 7, 9],
  blues:      [0, 3, 5, 6, 7, 10],
};

// 2-octave layout: C4 to B5
const KEY_LAYOUT = [
  { note: 'C',  isWhite: true,  octave: 4 },
  { note: 'C#', isWhite: false, octave: 4 },
  { note: 'D',  isWhite: true,  octave: 4 },
  { note: 'D#', isWhite: false, octave: 4 },
  { note: 'E',  isWhite: true,  octave: 4 },
  { note: 'F',  isWhite: true,  octave: 4 },
  { note: 'F#', isWhite: false, octave: 4 },
  { note: 'G',  isWhite: true,  octave: 4 },
  { note: 'G#', isWhite: false, octave: 4 },
  { note: 'A',  isWhite: true,  octave: 4 },
  { note: 'A#', isWhite: false, octave: 4 },
  { note: 'B',  isWhite: true,  octave: 4 },
  { note: 'C',  isWhite: true,  octave: 5 },
  { note: 'C#', isWhite: false, octave: 5 },
  { note: 'D',  isWhite: true,  octave: 5 },
  { note: 'D#', isWhite: false, octave: 5 },
  { note: 'E',  isWhite: true,  octave: 5 },
  { note: 'F',  isWhite: true,  octave: 5 },
  { note: 'F#', isWhite: false, octave: 5 },
  { note: 'G',  isWhite: true,  octave: 5 },
  { note: 'G#', isWhite: false, octave: 5 },
  { note: 'A',  isWhite: true,  octave: 5 },
  { note: 'A#', isWhite: false, octave: 5 },
  { note: 'B',  isWhite: true,  octave: 5 },
];

// Black key pixel positions (left edge relative to keyboard start)
const BLACK_KEY_X = {
  'C#': 30,  'D#': 118, 'F#': 175, 'G#': 263, 'A#': 322,
  'C#_5': 318, 'D#_5': 406, 'F#_5': 463, 'G#_5': 551, 'A#_5': 610,
};

let audioCtx = null;
let selectedOctave = 0;
let selectedRoot = 'C';
let selectedScale = 'major';
let activeOscillators = {};

function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function noteToFreq(note, octave) {
  const semitone = NOTES.indexOf(note);
  const offset = semitone - 9 + (octave - 4) * 12;
  return 440 * Math.pow(2, offset / 12);
}

function getScaleNotes(root, scale) {
  const rootIdx = NOTES.indexOf(root);
  return SCALES[scale].map(interval => {
    const noteIdx = (rootIdx + interval) % 12;
    return NOTES[noteIdx];
  });
}

function playNote(note, octave) {
  const ctx = getAudioContext();
  const keyId = `${note}${octave}`;

  if (activeOscillators[keyId]) return;

  const freq = noteToFreq(note, octave + selectedOctave);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = 'sine';
  osc.frequency.value = freq;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.4, now + 0.02);
  gain.gain.linearRampToValueAtTime(0.3, now + 0.1);
  gain.gain.linearRampToValueAtTime(0, now + 0.8);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now + 0.8);

  activeOscillators[keyId] = { osc, gain };
  setTimeout(() => delete activeOscillators[keyId], 800);

  // Visual feedback
  const keyEl = document.querySelector(`[data-key="${note}${octave}"]`);
  if (keyEl) {
    keyEl.classList.add('pressed');
    setTimeout(() => keyEl.classList.remove('pressed'), 300);
  }
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';

  const scaleNotes = getScaleNotes(selectedRoot, selectedScale);
  const whiteKeys = KEY_LAYOUT.filter(k => k.isWhite);
  const blackKeys = KEY_LAYOUT.filter(k => !k.isWhite);

  // Build white keys first
  whiteKeys.forEach((key) => {
    const div = document.createElement('div');
    div.className = 'white-key';
    div.dataset.key = `${key.note}${key.octave}`;
    div.dataset.note = key.note;
    div.dataset.octave = key.octave;
    div.textContent = key.note + key.octave;
    if (!scaleNotes.includes(key.note)) {
      div.classList.add('dimmed');
    } else {
      div.classList.add('in-scale');
    }
    div.addEventListener('mousedown', () => playNote(key.note, key.octave));
    kb.appendChild(div);
  });

  // Build black keys (positioned absolutely over white keys)
  blackKeys.forEach((key) => {
    const div = document.createElement('div');
    div.className = 'black-key';
    div.dataset.key = `${key.note}${key.octave}`;
    div.dataset.note = key.note;
    div.dataset.octave = key.octave;

    const xKey = key.octave === 4 ? key.note : `${key.note}_${key.octave}`;
    div.style.left = BLACK_KEY_X[xKey] + 'px';

    if (!scaleNotes.includes(key.note)) {
      div.classList.add('dimmed');
    } else {
      div.classList.add('in-scale');
    }
    div.addEventListener('mousedown', () => playNote(key.note, key.octave));
    kb.appendChild(div);
  });
}

// Octave buttons
document.querySelectorAll('.octave-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.octave-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedOctave = parseInt(btn.dataset.octave);
  });
});

// Root note buttons
document.querySelectorAll('.note-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedRoot = btn.dataset.note;
    buildKeyboard();
  });
});

// Scale buttons
document.querySelectorAll('.scale-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedScale = btn.dataset.scale;
    buildKeyboard();
  });
});

// Cleanup on mouseup
document.addEventListener('mouseup', () => {
  Object.values(activeOscillators).forEach(({ osc }) => {
    try { osc.stop(); } catch(e) {}
  });
  activeOscillators = {};
});

// Prevent context menu on long press (mobile)
document.addEventListener('contextmenu', e => e.preventDefault());

buildKeyboard();
</script>
</body>
</html>
