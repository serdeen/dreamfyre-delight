<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Octave Synth — Dreamfyre Delight</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --cyan: #00f5d4;
    --magenta: #f72585;
    --text: #e0e0e0;
    --text-dim: #666680;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.75rem 0.5rem;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(247,37,133,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(0,245,212,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
    margin-bottom: 0.6rem;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    width: 100%;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    min-width: 42px;
  }
  .octave-btns { display: flex; gap: 0.25rem; }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.35rem 0.55rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.1s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover, .btn:active { border-color: var(--cyan); color: var(--cyan); }
  .btn.active {
    background: var(--cyan);
    color: var(--bg);
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0,245,212,0.4);
  }
  .note-btn {
    width: 30px;
    height: 30px;
    font-size: 0.62rem;
    padding: 0;
  }
  .note-btn.sharp { background: var(--surface); border-color: var(--border); }
  .note-btn.sharp.active { background: var(--magenta); border-color: var(--magenta); color: #fff; }
  .scale-btn { padding: 0.3rem 0.6rem; font-size: 0.62rem; }
  .scale-btn.active { background: var(--magenta); color: #fff; border-color: var(--magenta); }

  /* Landscape: controls left sidebar, piano takes remaining width */
  @media (orientation: landscape) {
    body {
      flex-direction: row;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0.5rem;
      gap: 0.5rem;
      height: 100vh;
      height: 100dvh;
    }
    h1 {
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      writing-mode: horizontal-tb;
    }
    .controls {
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      width: auto;
      min-width: 130px;
      max-width: 150px;
      margin-bottom: 0;
      flex-shrink: 0;
    }
    .controls .control-row {
      justify-content: flex-start;
    }
    .piano-wrap {
      flex: 1;
      display: flex;
      align-items: flex-end;
    }
  }

  /* Piano */
  .piano-wrap {
    width: 100%;
    max-width: 700px;
    padding: 0 0.25rem;
    flex-shrink: 0;
  }

  .piano {
    position: relative;
    width: 100%;
    /* Height set via JS based on orientation, default portrait */
  }

  .white-key {
    position: absolute;
    bottom: 0;
    height: 100%;
    background: linear-gradient(180deg, #fefefe 0%, #f0f0f0 80%, #d8d8d8 100%);
    border: 1px solid #b0b0b0;
    border-top: none;
    border-radius: 0 0 4px 4px;
    cursor: pointer;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.48rem;
    color: #999;
    transition: background 0.06s ease, box-shadow 0.06s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 -3px 5px rgba(0,0,0,0.07), 0 2px 3px rgba(0,0,0,0.16);
  }
  .white-key:hover { background: linear-gradient(180deg, #fff 0%, #f8f8f8 80%, #e8e8e8 100%); }
  .white-key.in-scale { background: linear-gradient(180deg, #c8eee6 0%, #b0e0d8 80%, #90d0c8 100%); border-color: var(--cyan); }
  .white-key.in-scale:hover { background: linear-gradient(180deg, #b8e8e0 0%, #a0d8d0 80%, #88d0c8 100%); }
  .white-key.pressed {
    background: linear-gradient(180deg, var(--cyan) 0%, #00d0a8 100%) !important;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15), 0 0 18px rgba(0,245,212,0.5);
  }

  .black-key {
    position: absolute;
    top: 0;
    background: linear-gradient(180deg, #2c2c2c 0%, #111 60%, #2e2e2e 100%);
    border: 1px solid #000;
    border-top: none;
    border-radius: 0 0 3px 3px;
    cursor: pointer;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 0.38rem;
    color: #666;
    transition: background 0.06s ease, box-shadow 0.06s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 -3px 5px rgba(0,0,0,0.5), 0 3px 4px rgba(0,0,0,0.4);
  }
  .black-key:hover { background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 60%, #2a2a2a 100%); }
  .black-key.in-scale { background: linear-gradient(180deg, #362440 0%, #16082a 60%, #28183a 100%); border-color: var(--magenta); }
  .black-key.in-scale:hover { background: linear-gradient(180deg, #462850 0%, #26183a 60%, #382848 100%); }
  .black-key.pressed {
    background: linear-gradient(180deg, var(--magenta) 0%, #880038 100%) !important;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 16px rgba(247,37,133,0.5);
  }

  .dimmed { opacity: 0.15 !important; pointer-events: none; }
</style>
</head>
<body>

<h1>Octave Synth</h1>

<div class="controls">
  <div class="control-row">
    <span class="control-label">Octave</span>
    <div class="octave-btns">
      <button class="btn octave-btn" data-octave="-2">-2</button>
      <button class="btn octave-btn" data-octave="-1">-1</button>
      <button class="btn octave-btn active" data-octave="0">0</button>
      <button class="btn octave-btn" data-octave="1">+1</button>
      <button class="btn octave-btn" data-octave="2">+2</button>
    </div>
  </div>
  <div class="control-row">
    <span class="control-label">Root</span>
    <button class="btn note-btn active" data-note="C">C</button>
    <button class="btn note-btn sharp" data-note="C#">C#</button>
    <button class="btn note-btn" data-note="D">D</button>
    <button class="btn note-btn sharp" data-note="D#">D#</button>
    <button class="btn note-btn" data-note="E">E</button>
    <button class="btn note-btn" data-note="F">F</button>
    <button class="btn note-btn sharp" data-note="F#">F#</button>
    <button class="btn note-btn" data-note="G">G</button>
    <button class="btn note-btn sharp" data-note="G#">G#</button>
    <button class="btn note-btn" data-note="A">A</button>
    <button class="btn note-btn sharp" data-note="A#">A#</button>
    <button class="btn note-btn" data-note="B">B</button>
  </div>
  <div class="control-row">
    <span class="control-label">Scale</span>
    <button class="btn scale-btn active" data-scale="major">Major</button>
    <button class="btn scale-btn" data-scale="minor">Minor</button>
    <button class="btn scale-btn" data-scale="pentatonic">Pentatonic</button>
    <button class="btn scale-btn" data-scale="blues">Blues</button>
  </div>
</div>

<div class="piano-wrap">
  <div class="piano" id="piano"></div>
</div>

<script>
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES = {
  major:      [0, 2, 4, 5, 7, 9, 11],
  minor:      [0, 2, 3, 5, 7, 8, 10],
  pentatonic: [0, 2, 4, 7, 9],
  blues:      [0, 3, 5, 6, 7, 10],
};

const WHITE_KEYS = [
  { note:'C',  octave:4 },
  { note:'D',  octave:4 },
  { note:'E',  octave:4 },
  { note:'F',  octave:4 },
  { note:'G',  octave:4 },
  { note:'A',  octave:4 },
  { note:'B',  octave:4 },
  { note:'C',  octave:5 },
  { note:'D',  octave:5 },
  { note:'E',  octave:5 },
  { note:'F',  octave:5 },
  { note:'G',  octave:5 },
  { note:'A',  octave:5 },
  { note:'B',  octave:5 },
];

// Black key relative positions: [whiteKeyIndexBefore, whiteKeyIndexAfter]
const BLACK_KEYS = [
  { note:'C#', octave:4 },
  { note:'D#', octave:4 },
  { note:'F#', octave:4 },
  { note:'G#', octave:4 },
  { note:'A#', octave:4 },
  { note:'C#', octave:5 },
  { note:'D#', octave:5 },
  { note:'F#', octave:5 },
  { note:'G#', octave:5 },
  { note:'A#', octave:5 },
];

let audioCtx = null, masterGain = null, compressor = null;
let selectedOctave = 0, selectedRoot = 'C', selectedScale = 'major';
let activeNotes = {};
let touchKeyMap = {};

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -6;
  compressor.knee.value = 6;
  compressor.ratio.value = 4;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.1;
  compressor.connect(audioCtx.destination);
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(compressor);
}

function getAudioCtx() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function calcFreq(note, octave) {
  return 440 * Math.pow(2, (NOTES.indexOf(note) - 9 + (octave - 4) * 12) / 12);
}

function getScaleNotes(root, scale) {
  const rootIdx = NOTES.indexOf(root);
  return SCALES[scale].map(i => NOTES[(rootIdx + i) % 12]);
}

function playNote(note, octave) {
  const ctx = getAudioCtx();
  const keyId = note + octave;
  if (activeNotes[keyId]) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = calcFreq(note, octave + selectedOctave);
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.15, now + 0.012);
  gain.gain.setValueAtTime(0.15, now + 0.4);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(now);
  osc.stop(now + 1.0);
  activeNotes[keyId] = { osc, gain };
  const el = document.querySelector(`[data-key="${note}${octave}"]`);
  if (el) { el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 250); }
}

function stopNote(note, octave) {
  const keyId = note + octave;
  if (activeNotes[keyId]) {
    const { osc, gain } = activeNotes[keyId];
    delete activeNotes[keyId];
    try {
      const now = audioCtx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      osc.stop(now + 0.12);
    } catch(e) { try { osc.stop(); } catch(e2) {} }
  }
}

function buildPiano() {
  const piano = document.getElementById('piano');
  piano.innerHTML = '';
  const scaleNotes = getScaleNotes(selectedRoot, selectedScale);

  // Get actual piano width from DOM
  const pianoW = piano.getBoundingClientRect().width || piano.offsetWidth || 680;
  const kw = Math.max(28, Math.floor(pianoW / 14)); // 14 white keys, min 28px each
  const bh = Math.round(window.innerHeight * (window.matchMedia('(orientation: landscape)').matches ? 0.88 : 0.28)); // 88% height in landscape, 28% in portrait
  const bkh = Math.round(bh * 0.62); // black keys 62% of white key height

  piano.style.height = bh + 'px';

  // White keys
  WHITE_KEYS.forEach((key, i) => {
    const div = document.createElement('div');
    div.className = 'white-key';
    div.dataset.key = key.note + key.octave;
    div.dataset.note = key.note;
    div.dataset.octave = key.octave;
    div.style.left = (i * kw) + 'px';
    div.style.width = kw + 'px';
    div.textContent = key.note + key.octave;
    if (!scaleNotes.includes(key.note)) div.classList.add('dimmed');
    else div.classList.add('in-scale');
    attachEvents(div, key.note, key.octave);
    piano.appendChild(div);
  });

  // Black key positions: index into white keys array (before which white key it sits)
  const blackKeyIndices = [0, 1, 3, 4, 5, 7, 8, 10, 11, 12];
  BLACK_KEYS.forEach((key, i) => {
    const div = document.createElement('div');
    div.className = 'black-key';
    div.dataset.key = key.note + key.octave;
    div.dataset.note = key.note;
    div.dataset.octave = key.octave;
    div.textContent = key.note;
    div.style.width = Math.max(20, Math.round(kw * 0.6)) + 'px';
    div.style.height = bkh + 'px';
    // Center over the gap: left = whiteIdx * kw + kw - blackKeyWidth/2
    const left = blackKeyIndices[i] * kw + kw - Math.round(kw * 0.3);
    div.style.left = left + 'px';
    if (!scaleNotes.includes(key.note)) div.classList.add('dimmed');
    else div.classList.add('in-scale');
    attachEvents(div, key.note, key.octave);
    piano.appendChild(div);
  });
}

function attachEvents(el, note, octave) {
  el.addEventListener('mousedown', e => { e.preventDefault(); playNote(note, octave); });
  el.addEventListener('mouseup', () => stopNote(note, octave));
  el.addEventListener('mouseleave', () => stopNote(note, octave));
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      touchKeyMap[t.identifier] = { note, octave };
      playNote(note, octave);
    }
  }, { passive: false });
  el.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const target = document.elementFromPoint(t.clientX, t.clientY);
      if (target && target.dataset.note) {
        const n = target.dataset.note;
        const o = parseInt(target.dataset.octave);
        const prev = touchKeyMap[t.identifier];
        if (!prev || prev.note !== n || prev.octave !== o) {
          if (prev) stopNote(prev.note, prev.octave);
          touchKeyMap[t.identifier] = { note: n, octave: o };
          playNote(n, o);
        }
      }
    }
  }, { passive: false });
  el.addEventListener('touchend', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const info = touchKeyMap[t.identifier];
      if (info) { stopNote(info.note, info.octave); delete touchKeyMap[t.identifier]; }
    }
  }, { passive: false });
  el.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
      const info = touchKeyMap[t.identifier];
      if (info) { stopNote(info.note, info.octave); delete touchKeyMap[t.identifier]; }
    }
  });
}

// Controls
document.querySelectorAll('.octave-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.octave-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedOctave = parseInt(btn.dataset.octave);
  });
});
document.querySelectorAll('.note-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedRoot = btn.dataset.note;
    buildPiano();
  });
});
document.querySelectorAll('.scale-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedScale = btn.dataset.scale;
    buildPiano();
  });
});

document.addEventListener('contextmenu', e => e.preventDefault());

// Build piano — defer slightly to let layout settle
requestAnimationFrame(() => {
  buildPiano();
  window.addEventListener('resize', () => requestAnimationFrame(buildPiano), { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(() => requestAnimationFrame(buildPiano), 200));
});
</script>
</body>
</html>
