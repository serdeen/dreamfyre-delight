<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arpeggio Engine — Dreamfyre Delight</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --cyan: #00f5d4;
    --magenta: #f72585;
    --text: #e0e0e0;
    --text-dim: #666680;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(247,37,133,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(0,245,212,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }
  .controls {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    align-items: center;
  }
  label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  select, input[type="range"] {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
  }
  input[type="range"] { accent-color: var(--cyan); }
  select:focus, input[type="range"]:focus { border-color: var(--cyan); }
  .tempo-val {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--cyan);
    min-width: 3ch;
    text-align: center;
  }
  #playBtn {
    background: var(--cyan);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 0.6rem 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: background 0.2s, box-shadow 0.2s;
  }
  #playBtn:hover { box-shadow: 0 0 20px rgba(0,245,212,0.4); }
  #playBtn.playing { background: var(--magenta); }
  #playBtn.playing:hover { box-shadow: 0 0 20px rgba(247,37,133,0.4); }

  .grid-wrapper { margin-bottom: 1.5rem; }
  .step-labels {
    display: grid;
    grid-template-columns: 40px repeat(16, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .step-labels span {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    color: var(--text-dim);
    text-align: center;
  }
  .note-row {
    display: grid;
    grid-template-columns: 40px repeat(16, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .note-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
  .step {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
    min-width: 28px;
  }
  .step.active {
    background: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(0,245,212,0.5);
  }
  .step.current {
    background: var(--magenta) !important;
    border-color: var(--magenta) !important;
    box-shadow: 0 0 16px rgba(247,37,133,0.7) !important;
  }

  .info {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<h1>Arpeggio Engine</h1>

<div class="controls">
  <div class="control-group">
    <label>Root</label>
    <select id="rootNote">
      <option value="C">C</option><option value="C#">C#</option>
      <option value="D">D</option><option value="D#">D#</option>
      <option value="E">E</option><option value="F">F</option>
      <option value="F#">F#</option><option value="G">G</option>
      <option value="G#">G#</option><option value="A">A</option>
      <option value="A#">A#</option><option value="B">B</option>
    </select>
  </div>
  <div class="control-group">
    <label>Scale</label>
    <select id="scale">
      <option value="major">Major</option>
      <option value="minor">Minor</option>
      <option value="pentatonic">Pentatonic</option>
      <option value="blues">Blues</option>
    </select>
  </div>
  <div class="control-group">
    <label>Tempo</label>
    <div style="display:flex;align-items:center;gap:0.5rem;">
      <input type="range" id="tempo" min="60" max="200" value="120">
      <span class="tempo-val" id="tempoVal">120</span>
    </div>
  </div>
  <button id="playBtn">PLAY</button>
</div>

<div class="grid-wrapper" id="grid"></div>

<p class="info">Click steps to toggle on/off. Active steps cycle through the scale in order. Current step pulses magenta.</p>

<script>
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_OCTAVE = 4;
const STEPS = 16;
const ROWS = 4;

const SCALES = {
  major:     [0, 2, 4, 5, 7, 9, 11],
  minor:     [0, 2, 3, 5, 7, 8, 10],
  pentatonic:[0, 2, 4, 7, 9],
  blues:     [0, 3, 5, 6, 7, 10],
};

const grid = document.getElementById('grid');
const playBtn = document.getElementById('playBtn');
const tempoSlider = document.getElementById('tempo');
const tempoVal = document.getElementById('tempoVal');
const rootSelect = document.getElementById('rootNote');
const scaleSelect = document.getElementById('scale');

let audioCtx = null;
let isPlaying = false;
let stepIndex = 0;
let timer = null;
let steps = []; // 2D: steps[noteIdx][stepIdx] = bool

function getBaseFreq(root, scale) {
  const noteIdx = NOTES.indexOf(root);
  return 440 * Math.pow(2, (noteIdx - 9) / 12);
}

function noteFreq(root, scale, noteRow) {
  const scaleNotes = SCALES[scale];
  const scaleIdx = noteRow % scaleNotes.length;
  const octaveOffset = Math.floor(noteRow / scaleNotes.length);
  const semitone = scaleNotes[scaleIdx] + octaveOffset * 12;
  return getBaseFreq(root, scale) * Math.pow(2, semitone / 12);
}

function buildGrid() {
  grid.innerHTML = '';
  steps = [];
  for (let r = ROWS - 1; r >= 0; r--) {
    const noteLabel = document.createElement('div');
    noteLabel.className = 'note-label';
    const scaleNotes = SCALES[scaleSelect.value];
    noteLabel.textContent = NOTES[(NOTES.indexOf(rootSelect.value) + scaleNotes[r % scaleNotes.length]) % 12];
    noteLabel.textContent += (NOTE_OCTAVE + Math.floor(r / scaleNotes.length));
    grid.appendChild(noteLabel);

    steps[r] = [];
    for (let s = 0; s < STEPS; s++) {
      steps[r][s] = false;
      const cell = document.createElement('div');
      cell.className = 'step';
      cell.dataset.row = r;
      cell.dataset.step = s;
      cell.addEventListener('click', () => toggleStep(r, s, cell));
      grid.appendChild(cell);
    }
  }
}

function toggleStep(r, s, cell) {
  steps[r][s] = !steps[r][s];
  cell.classList.toggle('active', steps[r][s]);
}

function clearCurrent() {
  document.querySelectorAll('.step.current').forEach(el => el.classList.remove('current'));
}

function playStep() {
  clearCurrent();
  for (let r = 0; r < ROWS; r++) {
    const cell = grid.children[r * STEPS + stepIndex + ROWS]; // +ROWS to skip note labels
    if (cell && steps[r][stepIndex]) {
      cell.classList.add('current');
      playNote(noteFreq(rootSelect.value, scaleSelect.value, ROWS - 1 - r));
    }
  }
  stepIndex = (stepIndex + 1) % STEPS;
}

function playNote(freq) {
  if (!audioCtx) audioCtx = new AudioContext();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

function start() {
  if (!audioCtx) audioCtx = new AudioContext();
  isPlaying = true;
  stepIndex = 0;
  playBtn.textContent = 'STOP';
  playBtn.classList.add('playing');
  scheduleNext();
}

function scheduleNext() {
  if (!isPlaying) return;
  playStep();
  const interval = (60 / parseInt(tempoSlider.value)) * 1000 / 4; // 16th notes
  timer = setTimeout(scheduleNext, interval);
}

function stop() {
  isPlaying = false;
  clearTimeout(timer);
  clearCurrent();
  playBtn.textContent = 'PLAY';
  playBtn.classList.remove('playing');
  stepIndex = 0;
}

playBtn.addEventListener('click', () => isPlaying ? stop() : start());
tempoSlider.addEventListener('input', () => { tempoVal.textContent = tempoSlider.value; });
rootSelect.addEventListener('change', buildGrid);
scaleSelect.addEventListener('change', buildGrid);

buildGrid();
</script>
</body>
</html>
