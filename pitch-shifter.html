<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Shifter — Dreamfyre Delight</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --blue: #00b4d8;
    --blue-dim: rgba(0,180,216,0.12);
    --text: #e0e0e0;
    --text-dim: #666680;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 50% 40% at 50% 10%, rgba(0,180,216,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 50% 90%, rgba(0,180,216,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.5rem;
    letter-spacing: 0.2em;
    color: var(--blue);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }

  .container {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--text-dim);
    border-radius: 10px;
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    font-size: 0.9rem;
    color: var(--text-dim);
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--blue);
    background: var(--blue-dim);
  }
  .drop-zone.loaded {
    border-style: solid;
    border-color: var(--blue);
    color: var(--blue);
  }
  #file-input { display: none; }

  /* Waveform */
  #waveform-canvas {
    width: 100%;
    height: 100px;
    background: var(--surface);
    border-radius: 8px;
    display: block;
  }

  /* Transport */
  .transport {
    display: flex;
    gap: 0.8rem;
    justify-content: center;
  }
  .transport button {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    padding: 0.6rem 1.4rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    letter-spacing: 0.05em;
  }
  .transport button:hover {
    border-color: var(--blue);
    background: var(--blue-dim);
  }
  .transport button.active {
    border-color: var(--blue);
    color: var(--blue);
  }

  /* Pitch section */
  .pitch-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }
  .pitch-display {
    font-family: 'Space Mono', monospace;
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: 0.05em;
  }
  .pitch-display span { font-size: 1.2rem; vertical-align: super; }
  .cents-display {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .pitch-slider-wrap {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
  }
  .pitch-slider-wrap label {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #pitch-slider {
    flex: 1;
    accent-color: var(--blue);
    height: 8px;
  }
  .pitch-hints {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    color: var(--text-dim);
    width: 100%;
    padding: 0 0.5rem;
  }

  /* Master */
  .master-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0 0.5rem;
  }
  .master-row label {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-width: 60px;
  }
  .master-row input[type=range] {
    flex: 1;
    accent-color: var(--blue);
  }
</style>
</head>
<body>

<h1>Pitch Shifter</h1>

<div class="container">

  <div class="drop-zone" id="drop-zone">Drop a WAV or MP3 file here — or click to browse</div>
  <input type="file" id="file-input" accept="audio/*">

  <canvas id="waveform-canvas"></canvas>

  <div class="transport">
    <button id="play-btn">▶ Play</button>
    <button id="stop-btn">■ Stop</button>
  </div>

  <div class="pitch-section">
    <div class="pitch-display" id="pitch-display">+0 <span>ST</span></div>
    <div class="cents-display" id="cents-display">+0¢</div>
    <div class="pitch-slider-wrap">
      <label>-12</label>
      <input type="range" id="pitch-slider" min="-12" max="12" step="1" value="0">
      <label>+12</label>
    </div>
    <div class="pitch-hints">
      <span>slower</span>
      <span>faster</span>
    </div>
  </div>

  <div class="master-row">
    <label>Master</label>
    <input type="range" id="master-vol" min="0" max="1" value="0.7" step="0.01">
  </div>

</div>

<script>
(function() {
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let audioBuffer = null;
  let currentSource = null;
  let isPlaying = false;
  let startTime = 0;
  let pauseOffset = 0;
  let rafId = null;
  let currentPitch = 0; // semitones

  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const canvas = document.getElementById('waveform-canvas');
  const playBtn = document.getElementById('play-btn');
  const stopBtn = document.getElementById('stop-btn');
  const pitchSlider = document.getElementById('pitch-slider');
  const pitchDisplay = document.getElementById('pitch-display');
  const centsDisplay = document.getElementById('cents-display');
  const masterVol = document.getElementById('master-vol');

  // --- Init audio context on first interaction ---
  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -6;
      compressor.ratio.value = 4;
      compressor.connect(audioCtx.destination);

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.7;
      masterGain.connect(compressor);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // --- File load ---
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  function loadFile(file) {
    if (!file) return;
    ensureAudioCtx();
    dropZone.textContent = file.name;
    dropZone.classList.add('loaded');

    const reader = new FileReader();
    reader.onload = (ev) => {
      audioCtx.decodeAudioData(ev.target.result).then((buf) => {
        audioBuffer = buf;
        drawWaveform();
        playBtn.disabled = false;
      }).catch((err) => {
        dropZone.textContent = 'Error: ' + err.message;
      });
    };
    reader.readAsArrayBuffer(file);
  }

  // --- Waveform ---
  function drawWaveform() {
    if (!audioBuffer) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.offsetWidth;
    const h = 100;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);

    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / 400);

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#1e1e2e';
    ctx.fillRect(0, 0, w, h);

    ctx.beginPath();
    ctx.strokeStyle = '#00b4d8';
    ctx.lineWidth = 1;
    for (let i = 0; i < 400 && i * step < data.length; i++) {
      const x = (i / 400) * w;
      const y = h / 2 + (data[i * step] * h * 0.8 / 2);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  window.addEventListener('resize', () => {
    if (audioBuffer) drawWaveform();
  });

  // --- Playback ---
  function stopPlayback() {
    if (currentSource) {
      try { currentSource.stop(); } catch(e) {}
      currentSource = null;
    }
    cancelAnimationFrame(rafId);
    isPlaying = false;
  }

  function playAudio() {
    if (!audioBuffer) return;
    stopPlayback();

    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;

    // Apply current pitch
    const semitones = currentPitch;
    const playbackRate = Math.pow(2, semitones / 12);
    source.playbackRate.setValueAtTime(playbackRate, audioCtx.currentTime);

    source.connect(masterGain);
    source.start(0, pauseOffset);
    isPlaying = true;
    startTime = audioCtx.currentTime;
    currentSource = source;

    playBtn.textContent = '❚❚ Pause';
    playBtn.classList.add('active');

    source.onended = () => {
      if (isPlaying && source === currentSource) {
        isPlaying = false;
        pauseOffset = 0;
        playBtn.textContent = '▶ Play';
        playBtn.classList.remove('active');
        cancelAnimationFrame(rafId);
        drawWaveform();
      }
    };

    startPlayhead();
  }

  function startPlayhead() {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.offsetWidth;
    const h = 100;

    function draw() {
      if (!isPlaying) return;
      rafId = requestAnimationFrame(draw);

      const data = audioBuffer.getChannelData(0);
      const step = Math.ceil(data.length / 400);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#1e1e2e';
      ctx.fillRect(0, 0, w, h);

      ctx.beginPath();
      ctx.strokeStyle = '#00b4d8';
      ctx.lineWidth = 1;
      for (let i = 0; i < 400 && i * step < data.length; i++) {
        const x = (i / 400) * w;
        const y = h / 2 + (data[i * step] * h * 0.8 / 2);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Playhead
      const elapsed = audioCtx.currentTime - startTime;
      const progress = Math.min((pauseOffset + elapsed * source.playbackRate.value) / audioBuffer.duration, 1);
      const px = progress * w;

      ctx.beginPath();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.moveTo(px, 0);
      ctx.lineTo(px, h);
      ctx.stroke();
    }
    draw();
  }

  playBtn.addEventListener('click', () => {
    ensureAudioCtx();
    if (isPlaying) {
      pauseOffset += audioCtx.currentTime - startTime;
      stopPlayback();
      playBtn.textContent = '▶ Play';
      playBtn.classList.remove('active');
      cancelAnimationFrame(rafId);
    } else {
      playAudio();
    }
  });

  stopBtn.addEventListener('click', () => {
    stopPlayback();
    pauseOffset = 0;
    playBtn.textContent = '▶ Play';
    playBtn.classList.remove('active');
    if (audioBuffer) drawWaveform();
  });

  // --- Pitch slider ---
  pitchSlider.addEventListener('input', () => {
    const semitones = +pitchSlider.value;
    currentPitch = semitones;

    // Update displays
    const sign = semitones >= 0 ? '+' : '';
    pitchDisplay.innerHTML = `${sign}${semitones} <span>ST</span>`;
    const cents = Math.round((semitones - Math.floor(semitones)) * 100);
    const centsSign = cents >= 0 ? '+' : '';
    centsDisplay.textContent = `${centsSign}${cents}¢`;

    // Apply to playback rate in real time
    if (currentSource && isPlaying) {
      const playbackRate = Math.pow(2, semitones / 12);
      currentSource.playbackRate.setTargetAtTime(playbackRate, audioCtx.currentTime, 0.1);
    }
  });

  // --- Master volume ---
  masterVol.addEventListener('input', () => {
    if (masterGain) masterGain.gain.setTargetAtTime(+masterVol.value, audioCtx.currentTime, 0.1);
  });

  // Disable play until file loaded
  playBtn.disabled = true;

  // Clean stop
  window.addEventListener('beforeunload', () => {
    if (masterGain) {
      masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
      setTimeout(() => { if (audioCtx) audioCtx.close(); }, 400);
    }
  });
})();
</script>
</body>
</html>
