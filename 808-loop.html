<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>808 Loop Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07070e;
  --surface: #0d0d1c;
  --surface2: #131328;
  --surface3: #191940;
  --border: #1c1c3a;
  --text: #b8b8d0;
  --muted: #40406a;
  --amber: #e89828;
  --amber-dim: #a06c1c;
  --cyan: #00c0b8;
  --pink: #d83880;
  --purple: #8038d0;
  --green: #48d870;
  --kick-color: #e05838;
  --snare-color: #e8b828;
  --hihat-color: #38c8e8;
  --clap-color: #d85888;
  --tom-color: #8058e8;
  --perc-color: #58e898;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  user-select: none;
}
header {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0; flex-wrap: wrap;
}
.logo { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--amber); text-transform: uppercase; }
.logo em { color: var(--muted); font-style: normal; }

.transport { display: flex; align-items: center; gap: 6px; }
.transport-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--surface2);
  color: var(--text); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s;
}
.transport-btn:hover { border-color: var(--amber); color: var(--amber); }
.transport-btn.active { background: var(--amber); border-color: var(--amber); color: #000; }
.transport-btn:active { transform: scale(0.92); }
.transport-btn svg { width: 14px; height: 14px; }

.bpm-row { display: flex; align-items: center; gap: 8px; }
.bpm-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.bpm-knob {
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: ns-resize;
}
.bpm-display {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--amber); font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700;
  width: 68px; padding: 4px 8px; border-radius: 6px; text-align: center; outline: none;
}
.bpm-display:focus { border-color: var(--amber); }

.controls-row { display: flex; gap: 8px; align-items: center; }
.ctrl-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 5px 12px; border-radius: 6px;
  font-size: 10px; letter-spacing: 1px; cursor: pointer; transition: all 0.12s;
  font-family: 'Barlow', sans-serif;
}
.ctrl-btn:hover { border-color: var(--amber); color: var(--amber); }
.ctrl-btn.active { background: var(--amber); border-color: var(--amber); color: #000; font-weight: 700; }
.ctrl-btn.accent { border-color: var(--cyan); color: var(--cyan); }
.ctrl-btn.accent:hover { background: var(--cyan); color: #000; }
.ctrl-btn.danger { border-color: var(--pink); color: var(--pink); }
.ctrl-btn.danger:hover { background: var(--pink); color: #fff; }

.main { flex: 1; overflow-y: auto; padding: 10px 18px 20px; display: flex; flex-direction: column; gap: 12px; }

/* Step sequencer */
.seq-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
}
.seq-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.seq-title { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.seq-subtitle { font-size: 9px; color: var(--muted); font-family: 'Space Mono', monospace; }

.track { margin-bottom: 10px; }
.track:last-child { margin-bottom: 0; }
.track-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.track-name {
  font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
  min-width: 50px; letter-spacing: 1px;
}
.track-vol { -webkit-appearance: none; width: 60px; height: 3px; background: var(--border); border-radius: 2px; outline: none; }
.track-vol::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; cursor: pointer; }
.track-mute {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  padding: 2px 8px; border-radius: 4px; font-size: 8px; cursor: pointer; transition: all 0.1s; letter-spacing: 1px;
}
.track-mute:hover { border-color: var(--pink); color: var(--pink); }
.track-mute.active { background: var(--pink); border-color: var(--pink); color: #fff; }

.steps-row { display: flex; gap: 3px; flex-wrap: wrap; }
.step {
  width: 34px; height: 34px; border-radius: 4px;
  border: 1.5px solid var(--border); background: var(--surface2);
  cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center;
  position: relative;
}
.step:hover { border-color: var(--muted); }
.step.on { background: var(--amber); border-color: var(--amber); }
.step.beat { border-color: #303050; }
.step.beat.on { background: var(--amber); border-color: var(--amber); }
.step.playing { border-color: var(--cyan) !important; box-shadow: 0 0 6px rgba(0,192,184,0.4); }
.step-num {
  font-family: 'Space Mono', monospace; font-size: 7px; color: var(--muted);
  position: absolute; top: 2px; left: 3px;
}
.step.on .step-num { color: #000; }

/* Volume bar above each step */
.step-vol {
  -webkit-appearance: none; width: 20px; height: 3px;
  background: rgba(255,255,255,0.2); border-radius: 1px; outline: none;
  position: absolute; bottom: 2px; transform: rotate(-90deg) translateX(-12px);
  transform-origin: center;
}
.step-vol::-webkit-slider-thumb { -webkit-appearance: none; width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,0.5); cursor: pointer; }
.step.on .step-vol { background: rgba(0,0,0,0.3); }

/* Swipe selection */
.steps-row { cursor: default; }

/* Master section */
.master-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
}
.master-title { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.master-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.master-param { display: flex; align-items: center; gap: 8px; }
.master-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-family: 'Space Mono', monospace; }
.master-slider {
  -webkit-appearance: none; width: 90px; height: 4px;
  background: var(--border); border-radius: 2px; outline: none;
}
.master-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--amber); cursor: pointer;
}
.master-val { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--amber); min-width: 36px; }

/* Pad section */
.pad-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
}
.pad-title { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.pad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pad {
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 12px 6px; text-align: center;
  cursor: pointer; transition: all 0.12s; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.pad:hover { border-color: var(--cyan); }
.pad.playing { border-color: var(--cyan); background: rgba(0,192,184,0.1); box-shadow: 0 0 8px rgba(0,192,184,0.2); }
.pad-name { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text); letter-spacing: 1px; }
.pad-oct { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--muted); }

/* Pattern selector */
.pattern-row { display: flex; gap: 5px; flex-wrap: wrap; }
.pattern-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); padding: 4px 10px; border-radius: 5px;
  font-size: 9px; font-family: 'Space Mono', monospace; cursor: pointer; transition: all 0.1s;
}
.pattern-btn:hover { border-color: var(--amber); color: var(--amber); }
.pattern-btn.active { background: var(--amber); border-color: var(--amber); color: #000; font-weight: 700; }

/* Beat indicator */
.beat-lights { display: flex; gap: 4px; margin-left: auto; }
.beat-light {
  width: 6px; height: 6px; border-radius: 50%; background: var(--border);
  transition: background 0.05s;
}
.beat-light.downbeat { background: var(--amber); }

.hint-bar {
  padding: 5px 18px; border-top: 1px solid var(--border);
  background: var(--surface); font-size: 9px; color: var(--muted);
  font-family: 'Space Mono', monospace; letter-spacing: 0.5px; flex-shrink: 0;
}
</style>
</head>
<body>

<header>
  <div class="logo">808<em>Loop</em></div>
  <button class="transport-btn" id="playBtn" title="Play/Stop (Space)">
    <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="5,3 19,12 5,21"/></svg>
  </button>
  <div class="bpm-row">
    <span class="bpm-label">BPM</span>
    <input type="number" class="bpm-display" id="bpmInput" value="124" min="60" max="180">
  </div>
  <div class="controls-row">
    <button class="ctrl-btn" id="randomizeBtn">Randomize</button>
    <button class="ctrl-btn accent" id="clearBtn">Clear</button>
  </div>
  <div class="pattern-row" id="patternRow"></div>
  <div class="beat-lights" id="beatLights"></div>
</header>

<div class="main">
  <div class="seq-card">
    <div class="seq-header">
      <div class="seq-title">Step Sequencer</div>
      <div class="seq-subtitle">16 steps · swipe to select · right-click to velocity</div>
    </div>
    <div id="tracksContainer"></div>
  </div>

  <div class="master-card">
    <div class="master-title">Mix</div>
    <div class="master-row">
      <div class="master-param">
        <span class="master-label">Drums</span>
        <input type="range" class="master-slider" id="drumsVol" min="0" max="100" value="75">
        <span class="master-val" id="drumsVolVal">75%</span>
      </div>
      <div class="master-param">
        <span class="master-label">Pad</span>
        <input type="range" class="master-slider" id="padVol" min="0" max="100" value="40">
        <span class="master-val" id="padVolVal">40%</span>
      </div>
      <div class="master-param">
        <span class="master-label">Swing</span>
        <input type="range" class="master-slider" id="swingSlider" min="0" max="80" value="0">
        <span class="master-val" id="swingVal">0%</span>
      </div>
    </div>
  </div>

  <div class="pad-card">
    <div class="pad-title">Synth Pads (click to trigger)</div>
    <div class="pad-grid" id="padGrid"></div>
  </div>
</div>

<div class="hint-bar">
  <kbd>Space</kbd> play/stop &nbsp;·&nbsp; swipe steps to multi-select &nbsp;·&nbsp; right-click step for velocity &nbsp;·&nbsp; click track name to solo
</div>

<script>
(function() {
  // ===== Tracks =====
  const TRACKS = [
    { id: 'kick',  name: 'KICK',  color: '#e05838' },
    { id: 'snare', name: 'SNARE', color: '#e8b828' },
    { id: 'hihat', name: 'HHAT',  color: '#38c8e8' },
    { id: 'clap',  name: 'CLAP',  color: '#d85888' },
    { id: 'tom',   name: 'TOM',   color: '#8058e8' },
    { id: 'perc',  name: 'PERC',  color: '#58e898' },
  ];
  const STEPS = 16;

  // ===== State =====
  let audioCtx = null;
  let isPlaying = false;
  let currentStep = 0;
  let seqIntervalId = null;
  let bpm = 124;
  let swing = 0;
  let masterDrumsVol = 0.75;
  let masterPadVol = 0.40;

  let patterns = []; // up to 4 patterns
  let currentPattern = 0;

  // Pattern state: { kick: [{on, vel}, ...], ... }
  let pstate = {}; // current editing state
  let trackMutes = {};
  let trackVols = {};

  TRACKS.forEach(t => {
    pstate[t.id] = Array.from({length: STEPS}, () => ({ on: false, vel: 0.8 }));
    trackMutes[t.id] = false;
    trackVols[t.id] = 0.8;
  });

  // Pad notes (C minor pentatonic: C Eb F G Bb)
  const PAD_NOTES = [
    { note: 'C3',  freq: 130.81 },
    { note: 'Eb3', freq: 155.56 },
    { note: 'F3',  freq: 174.61 },
    { note: 'G3',  freq: 196.00 },
    { note: 'Bb3', freq: 233.08 },
    { note: 'C4',  freq: 261.63 },
    { note: 'Eb4', freq: 311.13 },
    { note: 'G4',  freq: 392.00 },
  ];

  // 808 synthesis
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // 808 Kick: sine + pitch envelope + distortion
  function playKick(t, vel) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const dist = audioCtx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = (i * 2) / 256 - 1; curve[i] = Math.tanh(x * 3); }
    dist.curve = curve;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.07);
    osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.4);
    gain.gain.setValueAtTime(vel * 1.2, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(dist); dist.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.55);
  }

  // 808 Snare: noise + sine
  function playSnare(t, vel) {
    const bufSize = audioCtx.sampleRate * 0.2;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(vel * 0.6, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass'; filter.frequency.value = 1200;
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(80, t + 0.06);
    oscGain.gain.setValueAtTime(vel * 0.8, t);
    oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(oscGain); oscGain.connect(audioCtx.destination);
    noise.start(t); noise.stop(t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
  }

  // Hi-hat: filtered noise, short
  function playHihat(t, vel) {
    const bufSize = audioCtx.sampleRate * 0.08;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vel * 0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass'; filter.frequency.value = 8000;
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(t); noise.stop(t + 0.08);
  }

  // Clap: 3 noise bursts
  function playClap(t, vel) {
    for (let i = 0; i < 3; i++) {
      const delay = i * 0.015;
      const bufSize = audioCtx.sampleRate * 0.04;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let j = 0; j < bufSize; j++) data[j] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, t + delay);
      gain.gain.linearRampToValueAtTime(vel * 0.6, t + delay + 0.003);
      gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.04);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 2500; filter.Q.value = 1.5;
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start(t + delay); noise.stop(t + delay + 0.05);
    }
    // Reverb tail
    const bufSize = audioCtx.sampleRate * 0.25;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vel * 0.3, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1800; filter.Q.value = 1.0;
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(t + 0.03); noise.stop(t + 0.35);
  }

  // Tom: sine with pitch envelope
  function playTom(t, vel) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, t);
    osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
    gain.gain.setValueAtTime(vel * 0.9, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.25);
  }

  // Perc: short clave-type click
  function playPerc(t, vel) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(800 + Math.random() * 400, t);
    osc.frequency.exponentialRampToValueAtTime(200, t + 0.04);
    gain.gain.setValueAtTime(vel * 0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.08);
  }

  const PLAY_FN = { kick: playKick, snare: playSnare, hihat: playHihat, clap: playClap, tom: playTom, perc: playPerc };

  // ===== Pad synthesis =====
  function playPad(note, freq) {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const dur = 3.0;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc1.type = 'sawtooth'; osc1.frequency.value = freq;
    osc2.type = 'sawtooth'; osc2.frequency.value = freq * 1.005; // slight detune
    filter.type = 'lowpass'; filter.frequency.value = 800;
    filter.Q.value = 2;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(masterPadVol * 0.3, t + 0.15);
    gain.gain.setValueAtTime(masterPadVol * 0.3, t + dur - 0.5);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc1.start(t); osc2.start(t); osc1.stop(t + dur); osc2.stop(t + dur);
  }

  // ===== Sequencer render =====
  function buildUI() {
    const container = document.getElementById('tracksContainer');
    container.innerHTML = '';
    TRACKS.forEach(track => {
      const trackDiv = document.createElement('div');
      trackDiv.className = 'track';

      const header = document.createElement('div');
      header.className = 'track-header';

      const name = document.createElement('div');
      name.className = 'track-name';
      name.textContent = track.name;
      name.style.color = track.color;
      name.style.cursor = 'pointer';
      name.addEventListener('click', () => {
        // Solo: mute all others
        const solo = !trackMutes[track.id];
        if (solo) {
          TRACKS.forEach(t => trackMutes[t.id] = t.id !== track.id);
        } else {
          TRACKS.forEach(t => trackMutes[t.id] = false);
        }
        renderUI();
      });

      const volSlider = document.createElement('input');
      volSlider.type = 'range';
      volSlider.className = 'track-vol';
      volSlider.min = 0; volSlider.max = 100;
      volSlider.value = trackVols[track.id] * 100;
      volSlider.style.setProperty('--thumb-color', track.color);
      volSlider.addEventListener('input', () => {
        trackVols[track.id] = parseInt(volSlider.value) / 100;
      });
      // Inline style for webkit thumb
      volSlider.addEventListener('input', () => {
        trackVols[track.id] = parseInt(volSlider.value) / 100;
        updateVolSliderStyle(volSlider, track.color);
      });

      const muteBtn = document.createElement('button');
      muteBtn.className = 'track-mute' + (trackMutes[track.id] ? ' active' : '');
      muteBtn.textContent = trackMutes[track.id] ? 'MUTED' : 'MUTE';
      muteBtn.addEventListener('click', () => {
        trackMutes[track.id] = !trackMutes[track.id];
        renderUI();
      });

      header.appendChild(name);
      header.appendChild(volSlider);
      header.appendChild(muteBtn);

      const stepsRow = document.createElement('div');
      stepsRow.className = 'steps-row';
      stepsRow.dataset.track = track.id;

      for (let s = 0; s < STEPS; s++) {
        const step = document.createElement('div');
        step.className = 'step' + (s % 4 === 0 ? ' beat' : '') + (pstate[track.id][s].on ? ' on' : '');
        step.dataset.track = track.id;
        step.dataset.step = s;
        if (pstate[track.id][s].on) step.style.background = track.color;

        const num = document.createElement('div');
        num.className = 'step-num';
        num.textContent = s + 1;
        step.appendChild(num);

        // Velocity slider (hidden unless step is on and right-click)
        const velSlider = document.createElement('input');
        velSlider.type = 'range';
        velSlider.className = 'step-vol';
        velSlider.min = 0; velSlider.max = 100;
        velSlider.value = pstate[track.id][s].vel * 100;
        velSlider.style.display = 'none';
        step.appendChild(velSlider);

        step.addEventListener('mousedown', e => {
          if (e.button === 2) {
            e.preventDefault();
            velSlider.style.display = velSlider.style.display === 'none' ? 'block' : 'none';
            return;
          }
          // Swipe multi-select
          if (e.button === 0) {
            isDragging = true;
            dragStartX = e.clientX;
            dragSlices.clear();
            dragSlices.add(s);
            lastDragTrack = track.id;
            lastDragStep = s;
          }
        });
        step.addEventListener('mouseenter', e => {
          if (isDragging && e.buttons === 1) {
            dragSlices.add(s);
          }
        });
        step.addEventListener('mouseup', e => {
          if (isDragging) {
            if (dragSlices.size > 1) {
              // Multi-select: toggle all to opposite of first
              const firstOn = pstate[track.id][Array.from(dragSlices)[0]].on;
              dragSlices.forEach(si => {
                pstate[track.id][si].on = !firstOn;
              });
            } else {
              // Single click
              pstate[track.id][s].on = !pstate[track.id][s].on;
            }
            isDragging = false;
            dragSlices.clear();
            renderUI();
          }
        });
        step.addEventListener('contextmenu', e => e.preventDefault());

        stepsRow.appendChild(step);
      }

      trackDiv.appendChild(header);
      trackDiv.appendChild(stepsRow);
      container.appendChild(trackDiv);

      updateVolSliderStyle(volSlider, track.color);
    });
  }

  function updateVolSliderStyle(slider, color) {
    slider.style.setProperty('--webkit-appearance', 'none');
    slider.style.setProperty('width', '60px');
    slider.style.setProperty('height', '3px');
    slider.style.setProperty('background', 'var(--border)');
    slider.style.setProperty('border-radius', '2px');
  }

  let isDragging = false;
  let dragStartX = 0, dragStartY = 0;
  let dragSlices = new Set();
  let lastDragTrack = null, lastDragStep = null;

  function renderUI() {
    buildUI();
    buildBeatLights();
  }

  function buildBeatLights() {
    const container = document.getElementById('beatLights');
    container.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const light = document.createElement('div');
      light.className = 'beat-light' + (i === 0 ? ' downbeat' : '');
      container.appendChild(light);
    }
  }

  // ===== Pattern management =====
  function saveCurrentPattern() {
    const snap = {};
    TRACKS.forEach(t => { snap[t.id] = pstate[t.id].map(s => ({...s})); });
    patterns[currentPattern] = snap;
  }

  function loadPattern(idx) {
    if (!patterns[idx]) return;
    saveCurrentPattern();
    currentPattern = idx;
    pstate = {};
    TRACKS.forEach(t => { pstate[t.id] = patterns[idx][t.id].map(s => ({...s})); });
    renderUI();
  }

  function buildPatternRow() {
    const container = document.getElementById('patternRow');
    container.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const btn = document.createElement('button');
      btn.className = 'pattern-btn' + (i === currentPattern ? ' active' : '');
      btn.textContent = 'P' + (i + 1);
      btn.addEventListener('click', () => loadPattern(i));
      container.appendChild(btn);
    }
    // Copy pattern
    const copyBtn = document.createElement('button');
    copyBtn.className = 'pattern-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', () => {
      saveCurrentPattern();
      const snap = {};
      TRACKS.forEach(t => { snap[t.id] = pstate[t.id].map(s => ({...s})); });
      // Find empty slot
      const empty = patterns.findIndex((p, i) => i !== currentPattern && !p);
      if (empty >= 0) { patterns[empty] = snap; loadPattern(empty); }
      else { patterns.push(snap); loadPattern(patterns.length - 1); }
      buildPatternRow();
    });
    container.appendChild(copyBtn);
  }

  // ===== Randomize =====
  document.getElementById('randomizeBtn').addEventListener('click', () => {
    TRACKS.forEach(t => {
      for (let s = 0; s < STEPS; s++) {
        // Different probability per instrument
        let prob = 0;
        if (t.id === 'kick') prob = 0.35;
        else if (t.id === 'snare') prob = s % 4 === 0 ? 0.9 : 0.08;
        else if (t.id === 'hihat') prob = s % 2 === 0 ? 0.6 : 0.25;
        else if (t.id === 'clap') prob = s % 8 === 4 ? 0.7 : 0.05;
        else if (t.id === 'tom') prob = 0.04;
        else if (t.id === 'perc') prob = 0.08;
        pstate[t.id][s].on = Math.random() < prob;
        pstate[t.id][s].vel = 0.6 + Math.random() * 0.4;
      }
    });
    renderUI();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    TRACKS.forEach(t => {
      for (let s = 0; s < STEPS; s++) {
        pstate[t.id][s] = { on: false, vel: 0.8 };
      }
    });
    renderUI();
  });

  // ===== BPM =====
  document.getElementById('bpmInput').addEventListener('change', e => {
    bpm = parseInt(e.target.value) || 124;
    if (isPlaying) restartSeq();
  });

  // ===== Master mix =====
  document.getElementById('drumsVol').addEventListener('input', e => {
    masterDrumsVol = parseInt(e.target.value) / 100;
    document.getElementById('drumsVolVal').textContent = e.target.value + '%';
  });
  document.getElementById('padVol').addEventListener('input', e => {
    masterPadVol = parseInt(e.target.value) / 100;
    document.getElementById('padVolVal').textContent = e.target.value + '%';
  });
  document.getElementById('swingSlider').addEventListener('input', e => {
    swing = parseInt(e.target.value);
    document.getElementById('swingVal').textContent = e.target.value + '%';
    if (isPlaying) restartSeq();
  });

  // ===== Pad grid =====
  function buildPadGrid() {
    const grid = document.getElementById('padGrid');
    grid.innerHTML = '';
    PAD_NOTES.forEach(pad => {
      const btn = document.createElement('div');
      btn.className = 'pad';
      btn.dataset.freq = pad.freq;
      const name = document.createElement('div');
      name.className = 'pad-name';
      name.textContent = pad.note;
      const oct = document.createElement('div');
      oct.className = 'pad-oct';
      oct.textContent = pad.freq.toFixed(0) + ' Hz';
      btn.appendChild(name);
      btn.appendChild(oct);
      btn.addEventListener('mousedown', () => {
        btn.classList.add('playing');
        playPad(pad.note, pad.freq);
        setTimeout(() => btn.classList.remove('playing'), 300);
      });
      grid.appendChild(btn);
    });
  }

  // ===== Transport =====
  function restartSeq() {
    if (seqIntervalId) clearInterval(seqIntervalId);
    currentStep = 0;
    const stepMs = (60000 / bpm) / 4;
    seqIntervalId = setInterval(tick, stepMs);
  }

  function tick() {
    // Apply swing to odd steps
    let delay = 0;
    if (currentStep % 2 === 1 && swing > 0) {
      delay = (swing / 100) * (60000 / bpm) / 8;
      setTimeout(() => fireStep(currentStep), delay);
    } else {
      fireStep(currentStep);
    }
    currentStep = (currentStep + 1) % STEPS;
  }

  function fireStep(step) {
    const lights = document.querySelectorAll('.beat-light');
    lights.forEach((l, i) => l.classList.toggle('downbeat', step % 4 === 0));

    document.querySelectorAll('.step').forEach(el => {
      el.classList.remove('playing');
    });

    TRACKS.forEach(track => {
      const state = pstate[track.id][step];
      if (state.on && !trackMutes[track.id]) {
        const t = audioCtx.currentTime;
        const vel = state.vel * trackVols[track.id] * masterDrumsVol;
        PLAY_FN[track.id](t, vel);
      }
      if (state.on) {
        const stepEl = document.querySelector(`.step[data-track="${track.id}"][data-step="${step}"]`);
        if (stepEl) stepEl.classList.add('playing');
      }
    });
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    isPlaying = !isPlaying;
    document.getElementById('playIcon').innerHTML = isPlaying
      ? '<rect x="5" y="3" width="5" height="18"/><rect x="14" y="3" width="5" height="18"/>'
      : '<polygon points="5,3 19,12 5,21"/>';
    document.getElementById('playBtn').classList.toggle('active', isPlaying);
    if (isPlaying) {
      currentStep = 0;
      const stepMs = (60000 / bpm) / 4;
      seqIntervalId = setInterval(tick, stepMs);
    } else {
      if (seqIntervalId) clearInterval(seqIntervalId);
      currentStep = 0;
      document.querySelectorAll('.step').forEach(el => el.classList.remove('playing'));
    }
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); document.getElementById('playBtn').click(); }
  });

  // ===== Init =====
  renderUI();
  buildPatternRow();
  buildPadGrid();
  buildBeatLights();
})();
</script>
</body>
</html>
