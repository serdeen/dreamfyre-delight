<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocal Chopper</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root {
  --bg: #08070d;
  --surface: #110f1a;
  --surface2: #1a1728;
  --accent: #c855f7;
  --accent2: #00e5ff;
  --accent-dim: rgba(200,85,247,0.15);
  --text: #e8e0ff;
  --muted: rgba(232,224,255,0.35);
  --pad-active: #c855f7;
  --pad-armed: #00e5ff;
  --border: rgba(200,85,247,0.2);
}
body{background:var(--bg);min-height:100vh;font-family:'JetBrains Mono',monospace;color:var(--text);user-select:none;overflow-x:hidden;}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;background:var(--surface);border-bottom:1px solid var(--border);}
.title{font-size:0.65rem;letter-spacing:5px;text-transform:uppercase;color:var(--accent);font-weight:600;}
.subtitle{font-size:0.55rem;letter-spacing:3px;color:var(--muted);}

/* Drop Zone */
.drop-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:24px;border:2px dashed rgba(200,85,247,0.25);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color 0.2s,background 0.2s;min-height:120px;position:relative;}
.drop-zone.drag-over{border-color:var(--accent);background:rgba(200,85,247,0.08);}
.drop-zone:hover{border-color:rgba(200,85,247,0.5);}
.drop-zone.has-file{min-height:72px;border-style:solid;border-color:rgba(200,85,247,0.3);}
.drop-text{font-size:0.7rem;letter-spacing:2px;color:var(--muted);text-align:center;pointer-events:none;}
.drop-icon{width:32px;height:32px;margin-bottom:10px;opacity:0.4;}
input[type=file]{display:none;}
.filename-display{font-size:0.65rem;color:var(--accent2);letter-spacing:1px;margin-top:6px;}

/* Controls Bar */
.controls{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);flex-wrap:wrap;}
.ctrl-group{display:flex;align-items:center;gap:10px;}
.ctrl-label{font-size:0.55rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.bpm-ctrl{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.bpm-input{background:transparent;border:none;color:var(--accent);font-family:inherit;font-size:0.85rem;width:54px;text-align:center;padding:6px 4px;outline:none;}
.bpm-input:focus{border-right:1px solid var(--accent);}
.bpm-btn{background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:0.7rem;padding:6px 10px;cursor:pointer;transition:color 0.15s,background 0.15s;}
.bpm-btn:hover{color:var(--text);background:rgba(255,255,255,0.05);}

.play-btn{background:var(--accent);border:none;color:#08070d;font-family:inherit;font-size:0.6rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;border-radius:6px;cursor:pointer;transition:transform 0.1s,box-shadow 0.15s;box-shadow:0 0 20px rgba(200,85,247,0.3);}
.play-btn:hover{transform:scale(1.04);box-shadow:0 0 28px rgba(200,85,247,0.5);}
.play-btn:active{transform:scale(0.97);}
.play-btn.playing{background:var(--accent2);box-shadow:0 0 20px rgba(0,229,255,0.3);}

.clear-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:0.6rem;letter-spacing:1px;padding:7px 14px;border-radius:6px;cursor:pointer;transition:all 0.15s;}
.clear-btn:hover{color:var(--text);border-color:var(--accent);}

/* Pad Grid */
.pad-section{padding:20px 24px;}
.section-label{font-size:0.55rem;letter-spacing:3px;color:var(--muted);margin-bottom:12px;text-transform:uppercase;}
.pad-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
.pad{aspect-ratio:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform 0.08s,border-color 0.1s,box-shadow 0.1s;position:relative;overflow:hidden;min-height:60px;}
.pad:hover{transform:scale(1.03);border-color:var(--accent);}
.pad.active{background:rgba(200,85,247,0.2);border-color:var(--accent);box-shadow:0 0 16px rgba(200,85,247,0.25);}
.pad.armed{background:rgba(0,229,255,0.15);border-color:var(--accent2);}
.pad.empty{opacity:0.35;}
.pad-num{font-size:0.5rem;color:var(--muted);letter-spacing:1px;}
.pad-wave{width:80%;height:20px;opacity:0.5;}

/* Slice Controls */
.slice-row{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.slice-info{font-size:0.6rem;color:var(--muted);letter-spacing:1px;}
.slice-btns{display:flex;gap:8px;}
.slice-btn{background:transparent;border:1px solid var(--border);color:var(--accent);font-family:inherit;font-size:0.6rem;letter-spacing:1px;padding:6px 14px;border-radius:5px;cursor:pointer;transition:all 0.15s;}
.slice-btn:hover{background:var(--accent-dim);border-color:var(--accent);}

/* Sequencer Row */
.seq-section{padding:16px 24px;}
.seq-row{display:flex;gap:4px;align-items:center;}
.seq-label{font-size:0.5rem;letter-spacing:2px;color:var(--muted);width:24px;flex-shrink:0;}
.seq-step{flex:1;height:36px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all 0.1s;display:flex;align-items:center;justify-content:center;min-width:0;}
.seq-step:hover{border-color:var(--accent);}
.seq-step.active{background:rgba(200,85,247,0.2);border-color:var(--accent);}
.seq-step.pad-hit{background:rgba(0,229,255,0.2);border-color:var(--accent2);}
.seq-num{font-size:0.45rem;color:var(--muted);}

/* Transport */
.transport{display:flex;align-items:center;justify-content:center;gap:16px;padding:20px;}
.transport-btn{width:48px;height:48px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.transport-btn:hover{border-color:var(--accent);transform:scale(1.06);}
.transport-btn svg{width:18px;height:18px;fill:currentColor;}

/* Footer */
footer{padding:16px 24px;text-align:center;}
.footer-text{font-size:0.5rem;letter-spacing:2px;color:var(--muted);}

@keyframes padFlash{0%{box-shadow:0 0 0 rgba(200,85,247,0);}50%{box-shadow:0 0 30px rgba(200,85,247,0.6);}100%{box-shadow:0 0 0 rgba(200,85,247,0);}}
.pad.flash{animation:padFlash 0.25s ease-out;}
</style>
</head>
<body>

<header>
  <div>
    <div class="title">Vocal Chopper</div>
    <div class="subtitle">Drop &bull; Slice &bull; Rearrange</div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">BPM</span>
    <div class="bpm-ctrl">
      <button class="bpm-btn" id="bpmDown">−</button>
      <input type="number" class="bpm-input" id="bpmInput" value="124" min="60" max="200">
      <button class="bpm-btn" id="bpmUp">+</button>
    </div>
  </div>
</header>

<div class="drop-zone" id="dropZone">
  <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
  </svg>
  <div class="drop-text" id="dropText">Drop a vocal sample here<br><span style="font-size:0.5rem;opacity:0.5">WAV, MP3, OGG &mdash; up to 30s</span></div>
  <div class="filename-display" id="fileName" style="display:none"></div>
  <input type="file" id="fileInput" accept="audio/*">
</div>

<div class="controls" id="controls" style="display:none">
  <div class="ctrl-group">
    <span class="ctrl-label">Slices</span>
    <div class="slice-btns">
      <button class="slice-btn" data-slices="4">4</button>
      <button class="slice-btn" data-slices="8">8</button>
      <button class="slice-btn" data-slices="16">16</button>
      <button class="slice-btn" data-slices="32">32</button>
    </div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Pitch</span>
    <div class="bpm-ctrl">
      <button class="bpm-btn" id="pitchDown">−</button>
      <input type="number" class="bpm-input" id="pitchInput" value="0" step="1" min="-12" max="12" style="width:46px">
      <button class="bpm-btn" id="pitchUp">+</button>
    </div>
  </div>
  <button class="play-btn" id="playBtn">Play Sequence</button>
  <button class="clear-btn" id="clearBtn">Clear Pads</button>
</div>

<div class="pad-section" id="padSection" style="display:none">
  <div class="section-label">Chop Pads</div>
  <div class="pad-grid" id="padGrid"></div>
</div>

<div class="seq-section" id="seqSection" style="display:none">
  <div class="section-label">Sequence</div>
  <div class="seq-row" id="seqRow"></div>
</div>

<div class="transport">
  <button class="transport-btn" id="stopBtn" title="Stop">
    <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
  </button>
  <button class="transport-btn" id="playSeqBtn" title="Play/Stop Sequence">
    <svg viewBox="0 0 24 24" id="playIcon"><polygon points="8,5 19,12 8,19"/></svg>
  </button>
  <button class="transport-btn" id="resetBtn" title="Reset Sequence">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
  </button>
</div>

<footer><div class="footer-text">124 BPM &bull; Deep House Vocal Tool</div></footer>

<script>
const $ = id => document.getElementById(id);
let ctx, audioBuffer, sources = [];
let NUM_SLICES = 16;
let pads = [];
let seqOrder = [];
let currentStep = 0;
let seqPlaying = false;
let seqInterval = null;
let globalPitch = 0;
let BPM = 124;

// State: selected pads for sequence
let selectedPads = [];

// Drag state for swipe
let dragSelecting = false;
let dragStartPad = null;

function initAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
}

function getBPS() { return BPM / 60; }
function getBeatMs() { return 60000 / BPM; }

// Load audio file
function loadAudioFile(file) {
  initAudio();
  const reader = new FileReader();
  reader.onload = e => {
    ctx.decodeAudioData(e.target.result, buf => {
      audioBuffer = buf;
      buildPads();
      $('dropZone').classList.add('has-file');
      $('fileName').textContent = file.name;
      $('fileName').style.display = 'block';
      $('dropText').textContent = 'Sample loaded — slice it up';
      $('controls').style.display = 'flex';
      $('padSection').style.display = 'block';
      $('seqSection').style.display = 'block';
      buildSeqRow();
    }, err => alert('Could not decode audio file'));
  };
  reader.readAsArrayBuffer(file);
}

// Build waveform preview SVG for a pad
function waveSVG(w, h) {
  if (!audioBuffer) return '';
  const data = audioBuffer.getChannelData(0);
  const step = Math.floor(data.length / 64);
  let d = '';
  for (let i = 0; i < 64; i++) {
    let min = 0, max = 0;
    for (let j = 0; j < step; j++) {
      const v = data[i * step + j] || 0;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    const y1 = (0.5 + min * 0.45) * h;
    const y2 = (0.5 + max * 0.45) * h;
    d += `M${i * w/64},${y1}L${i * w/64},${y2}`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><path d="${d}" stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.7"/></svg>`;
}

// Build pads
function buildPads() {
  const grid = $('padGrid');
  grid.innerHTML = '';
  pads = [];
  const sliceLen = Math.floor(audioBuffer.length / NUM_SLICES);

  for (let i = 0; i < NUM_SLICES; i++) {
    const pad = document.createElement('div');
    pad.className = 'pad empty';
    pad.dataset.index = i;

    const num = document.createElement('div');
    num.className = 'pad-num';
    num.textContent = i + 1;

    const wave = document.createElement('div');
    wave.className = 'pad-wave';
    wave.innerHTML = waveSVG(60, 20);

    pad.appendChild(num);
    pad.appendChild(wave);

    // Click: arm/disarm for sequence
    pad.addEventListener('click', e => {
      if (e.shiftKey || selectedPads.length === 0) {
        // Single toggle
        if (pad.classList.contains('armed')) {
          pad.classList.remove('armed');
          selectedPads = selectedPads.filter(p => p !== i);
        } else {
          pad.classList.add('armed');
          selectedPads.push(i);
        }
      }
      triggerPad(i);
      pad.classList.add('flash');
      setTimeout(() => pad.classList.remove('flash'), 250);
      updateSeqFromSelected();
    });

    // Swipe support
    pad.addEventListener('mousedown', e => {
      dragStartPad = i;
      dragSelecting = true;
    });
    pad.addEventListener('mouseenter', e => {
      if (dragSelecting && dragStartPad !== null) {
        // Select range between dragStartPad and this pad
        const from = Math.min(dragStartPad, i);
        const to = Math.max(dragStartPad, i);
        for (let p = from; p <= to; p++) {
          if (!selectedPads.includes(p)) {
            selectedPads.push(p);
            const el = grid.children[p];
            if (el) el.classList.add('armed');
          }
        }
        updateSeqFromSelected();
      }
    });

    grid.appendChild(pad);
    pads.push({ start: i * sliceLen, len: sliceLen });
  }

  document.addEventListener('mouseup', () => {
    dragSelecting = false;
    dragStartPad = null;
  });
}

// Update sequence row from selected pads
function updateSeqFromSelected() {
  seqOrder = [...selectedPads];
  buildSeqRow();
  // Highlight seq steps that correspond to selected pads
  const steps = $('seqRow').querySelectorAll('.seq-step');
  steps.forEach((step, si) => {
    const padIdx = seqOrder[si % seqOrder.length];
    if (selectedPads.includes(padIdx)) {
      step.classList.add('active');
    } else {
      step.classList.remove('active');
    }
  });
}

// Build sequence row
function buildSeqRow() {
  const row = $('seqRow');
  row.innerHTML = '';
  for (let i = 0; i < 16; i++) {
    const step = document.createElement('div');
    step.className = 'seq-step';
    const num = document.createElement('div');
    num.className = 'seq-num';
    num.textContent = i + 1;
    step.appendChild(num);
    step.addEventListener('click', () => {
      if (seqOrder.length === 0) return;
      // Play this step
      const padIdx = seqOrder[i % seqOrder.length];
      triggerPad(padIdx);
    });
    row.appendChild(step);
  }
}

// Trigger a pad
function triggerPad(index) {
  if (!audioBuffer || !ctx) return;
  const { start, len } = pads[index];
  const source = ctx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(ctx.destination);

  // Apply pitch shift
  if (globalPitch !== 0) {
    source.playbackRate.value = Math.pow(2, globalPitch / 12);
  }

  const offset = start / audioBuffer.sampleRate;
  const duration = len / audioBuffer.sampleRate;
  source.start(ctx.currentTime, offset, duration);
  sources.push(source);
}

// Play sequence
function playSequence() {
  if (seqOrder.length === 0) return;
  seqPlaying = true;
  $('playBtn').classList.add('playing');
  $('playBtn').textContent = 'Stop';
  currentStep = 0;
  const ms = getBeatMs();

  function step() {
    if (!seqPlaying) return;
    const stepEl = $('seqRow').children[currentStep];
    if (stepEl) {
      stepEl.classList.add('pad-hit');
      setTimeout(() => stepEl.classList.remove('pad-hit'), 150);
    }
    const padIdx = seqOrder[currentStep % seqOrder.length];
    triggerPad(padIdx);
    // Flash the corresponding pad
    const padEl = $('padGrid').children[padIdx];
    if (padEl) {
      padEl.classList.add('flash');
      setTimeout(() => padEl.classList.remove('flash'), 200);
    }
    currentStep = (currentStep + 1) % 16;
  }

  step();
  seqInterval = setInterval(step, ms);
}

function stopSequence() {
  seqPlaying = false;
  clearInterval(seqInterval);
  $('playBtn').classList.remove('playing');
  $('playBtn').textContent = 'Play Sequence';
  sources.forEach(s => { try { s.stop(); } catch(e){} });
  sources = [];
}

// Slice button handlers
document.querySelectorAll('.slice-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    NUM_SLICES = parseInt(btn.dataset.slices);
    document.querySelectorAll('.slice-btn').forEach(b => b.style.borderColor = '');
    btn.style.borderColor = 'var(--accent)';
    if (audioBuffer) buildPads();
  });
  // Default select 16
  if (btn.dataset.slices === '16') btn.style.borderColor = 'var(--accent)';
});

// BPM controls
$('bpmInput').addEventListener('change', e => {
  BPM = Math.max(60, Math.min(200, parseInt(e.target.value) || 124));
  e.target.value = BPM;
  if (seqPlaying) { stopSequence(); playSequence(); }
});
$('bpmDown').addEventListener('click', () => {
  BPM = Math.max(60, BPM - 1);
  $('bpmInput').value = BPM;
  if (seqPlaying) { stopSequence(); playSequence(); }
});
$('bpmUp').addEventListener('click', () => {
  BPM = Math.min(200, BPM + 1);
  $('bpmInput').value = BPM;
  if (seqPlaying) { stopSequence(); playSequence(); }
});

// Pitch controls
$('pitchInput').addEventListener('change', e => {
  globalPitch = parseInt(e.target.value) || 0;
  e.target.value = globalPitch;
});
$('pitchDown').addEventListener('click', () => {
  globalPitch = Math.max(-12, globalPitch - 1);
  $('pitchInput').value = globalPitch;
});
$('pitchUp').addEventListener('click', () => {
  globalPitch = Math.min(12, globalPitch + 1);
  $('pitchInput').value = globalPitch;
});

// Play button
$('playBtn').addEventListener('click', () => {
  if (seqPlaying) stopSequence(); else playSequence();
});

// Clear pads
$('clearBtn').addEventListener('click', () => {
  selectedPads = [];
  seqOrder = [];
  document.querySelectorAll('.pad.armed').forEach(p => p.classList.remove('armed'));
  document.querySelectorAll('.seq-step').forEach(s => s.classList.remove('active'));
});

// Stop / reset
$('stopBtn').addEventListener('click', () => { stopSequence(); currentStep = 0; });
$('resetBtn').addEventListener('click', () => {
  stopSequence();
  currentStep = 0;
  seqOrder = [];
  selectedPads = [];
  document.querySelectorAll('.pad.armed').forEach(p => p.classList.remove('armed'));
  document.querySelectorAll('.seq-step').forEach(s => s.classList.remove('active'));
});

// Play/Stop seq button (transport)
$('playSeqBtn').addEventListener('click', () => {
  if (seqPlaying) stopSequence(); else playSequence();
});

// Drop zone
const dropZone = $('dropZone');
dropZone.addEventListener('click', () => $('fileInput').click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('audio/')) loadAudioFile(file);
});
$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) loadAudioFile(file);
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    if (seqPlaying) stopSequence(); else playSequence();
  }
  if (e.code === 'Escape') stopSequence();
  if (e.code === 'KeyR') { $('resetBtn').click(); }
});

// Init audio on first interaction
document.addEventListener('click', () => initAudio(), { once: true });
</script>
</body>
</html>
