<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tape Stop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0a0810;--surface:#16121f;--surface2:#201b30;--accent:#ff6b35;--accent2:#1aee8f;--accent3:#a78bff;--border:rgba(255,107,53,0.18);--text:#fff0e8;--muted:rgba(255,240,232,0.32);}
body{background:var(--bg);min-height:100vh;font-family:'JetBrains Mono',monospace;color:var(--text);user-select:none;overflow-x:hidden;}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border);}
.title{font-size:0.65rem;letter-spacing:5px;text-transform:uppercase;color:var(--accent);font-weight:600;}
.subtitle{font-size:0.55rem;letter-spacing:3px;color:var(--muted);}
.bpm-row{display:flex;align-items:center;gap:8px;}
.ctrl-label{font-size:0.55rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.bpm-box{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.bpm-in{background:transparent;border:none;color:var(--accent);font-family:inherit;font-size:0.85rem;width:52px;text-align:center;padding:6px 4px;outline:none;}
.num-btn{background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:0.8rem;padding:6px 10px;cursor:pointer;transition:all 0.15s;}
.num-btn:hover{color:var(--text);background:rgba(255,255,255,0.05);}

/* Speed display */
.speed-section{padding:20px 24px;background:var(--surface);border-bottom:1px solid var(--border);text-align:center;}
.speed-display{font-size:clamp(3rem, 18vw, 7rem);font-weight:600;color:var(--accent);line-height:1;letter-spacing:-3px;text-shadow:0 0 40px rgba(255,107,53,0.4);transition:color 0.1s,text-shadow 0.1s;}
.speed-display.slow{color:var(--accent3);text-shadow:0 0 40px rgba(167,139,255,0.4);}
.speed-unit{font-size:0.7rem;letter-spacing:4px;color:rgba(255,107,53,0.5);margin-top:4px;}

/* Controls */
.controls{padding:18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--surface);}
.ctrl-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.ctrl-card-title{font-size:0.55rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:2px;}
.knob-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.knob-label{font-size:0.55rem;letter-spacing:2px;color:var(--muted);}
.knob-val{font-size:0.7rem;color:var(--text);}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;}

/* Mode buttons */
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mode-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:0.65rem;letter-spacing:1px;padding:9px 6px;border-radius:6px;cursor:pointer;transition:all 0.15s;}
.mode-btn.selected{border-color:var(--accent);color:var(--accent);background:rgba(255,107,53,0.1);}
.mode-btn:hover{border-color:rgba(255,107,53,0.4);}

/* Input row */
.input-row{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--surface);border-top:1px solid var(--border);}
.load-btn{background:transparent;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:0.65rem;letter-spacing:2px;padding:8px 16px;border-radius:6px;cursor:pointer;transition:all 0.15s;}
.load-btn:hover{border-color:var(--accent);}
input[type=file]{display:none;}
.filename{font-size:0.6rem;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.play-btn{background:var(--accent);border:none;color:#0a0810;font-family:inherit;font-size:0.6rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;border-radius:6px;cursor:pointer;transition:all 0.15s;}
.play-btn:hover{transform:scale(1.04);}
.play-btn.playing{background:var(--accent2);}

/* Big effect buttons */
.effect-section{padding:24px;display:flex;gap:16px;justify-content:center;background:var(--surface);border-top:1px solid var(--border);}
.effect-btn{background:transparent;border:2px solid var(--accent);color:var(--accent);font-family:inherit;font-size:0.7rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;padding:20px 40px;border-radius:10px;cursor:pointer;transition:all 0.15s;min-width:180px;}
.effect-btn:hover{background:rgba(255,107,53,0.12);transform:scale(1.03);}
.effect-btn.reverse{border-color:var(--accent3);color:var(--accent3);}
.effect-btn.reverse:hover{background:rgba(167,139,255,0.12);}

/* Transport */
.transport{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px;background:var(--surface);border-top:1px solid var(--border);}
.transport-btn{width:48px;height:48px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.transport-btn svg{width:18px;height:18px;fill:currentColor;}
.transport-btn:hover{border-color:var(--accent);transform:scale(1.05);}

footer{padding:12px 24px;text-align:center;}
.footer-text{font-size:0.5rem;letter-spacing:2px;color:var(--muted);}

@keyframes tapePulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.recording .speed-display{animation:tapePulse 0.5s ease-in-out infinite;}
</style>
</head>
<body>

<header>
  <div>
    <div class="title">Tape Stop</div>
    <div class="subtitle">Scratch &bull; Slowdown Effects</div>
  </div>
  <div class="bpm-row">
    <span class="ctrl-label">BPM</span>
    <div class="bpm-box">
      <button class="num-btn" id="bpmDown">−</button>
      <input type="number" class="bpm-in" id="bpmIn" value="124" min="60" max="200">
      <button class="num-btn" id="bpmUp">+</button>
    </div>
  </div>
</header>

<div class="speed-section">
  <div class="speed-display" id="speedDisplay">1.00x</div>
  <div class="speed-unit">PLAYBACK RATE</div>
</div>

<div class="controls">
  <div class="ctrl-card">
    <div class="ctrl-card-title">Stop Duration</div>
    <div class="knob-row">
      <span class="knob-label">Time (ms)</span>
      <span class="knob-val" id="timeVal">600</span>
    </div>
    <input type="range" id="timeSlider" min="100" max="2000" value="600">
    <div class="knob-row">
      <span class="knob-label">BPM Sync</span>
      <span class="knob-val" id="syncVal">Off</span>
    </div>
    <div class="mode-row">
      <button class="mode-btn selected" data-sync="off">Free</button>
      <button class="mode-btn" data-sync="beat">1 Beat</button>
      <button class="mode-btn" data-sync="bar">1 Bar</button>
    </div>
  </div>

  <div class="ctrl-card">
    <div class="ctrl-card-title">Effect Curve</div>
    <div class="knob-row">
      <span class="knob-label">Curve Shape</span>
      <span class="knob-val" id="curveVal">Exp</span>
    </div>
    <div class="mode-row">
      <button class="mode-btn selected" data-c="exp">Exp</button>
      <button class="mode-btn" data-c="lin">Linear</button>
      <button class="mode-btn" data-c="log">Log</button>
    </div>
    <div class="knob-row">
      <span class="knob-label">Min Rate</span>
      <span class="knob-val" id="minRateVal">0.05x</span>
    </div>
    <input type="range" id="minRateSlider" min="0" max="30" value="5">
  </div>
</div>

<div class="input-row">
  <button class="load-btn" id="loadBtn">Load Audio</button>
  <input type="file" id="audioInput" accept="audio/*" style="display:none">
  <div class="filename" id="fileName">No audio loaded</div>
  <button class="play-btn" id="playBtn">Play</button>
</div>

<div class="effect-section">
  <button class="effect-btn" id="stopBtn">Tape Stop</button>
  <button class="effect-btn reverse" id="revBtn">Reverse Scratch</button>
</div>

<div class="transport">
  <button class="transport-btn" id="stopAllBtn" title="Stop">
    <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
  </button>
</div>

<footer><div class="footer-text">Tape Stop &bull; Scratch &bull; Slowdown FX</div></footer>

<script>
const $ = id => document.getElementById(id);
let ctx, audioBuffer, sourceNode, gainNode;
let BPM = 124;
let DURATION = 600; // ms
let CURVE = 'exp';
let MIN_RATE = 0.05;
let isPlaying = false;
let isEffectActive = false;
let effectResolve = null;
let currentSpeed = 1.0;
let animFrame;
let SYNC = 'off';

function initAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function loadAudio(file) {
  initAudio();
  $('fileName').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    ctx.decodeAudioData(e.target.result, buf => {
      audioBuffer = buf;
      $('playBtn').textContent = 'Play';
      isPlaying = false;
    });
  };
  reader.readAsArrayBuffer(file);
}

function playAtRate(rate, fromPos) {
  if (sourceNode) { try { sourceNode.stop(); } catch(e){} }
  if (!gainNode) gainNode = ctx.createGain();
  sourceNode = ctx.createBufferSource();
  sourceNode.buffer = audioBuffer;
  sourceNode.playbackRate.value = rate;
  sourceNode.connect(gainNode);
  gainNode.connect(ctx.destination);
  const maxDur = audioBuffer.duration - fromPos;
  sourceNode.start(0, fromPos, maxDur > 0 ? maxDur : undefined);
  return sourceNode;
}

function startPlayback() {
  if (!audioBuffer) return;
  initAudio();
  if (!gainNode) gainNode = ctx.createGain();
  if (sourceNode) { try { sourceNode.stop(); } catch(e){} }
  sourceNode = ctx.createBufferSource();
  sourceNode.buffer = audioBuffer;
  sourceNode.playbackRate.value = 1;
  sourceNode.connect(gainNode);
  gainNode.connect(ctx.destination);
  sourceNode.start(0);
  isPlaying = true;
  currentSpeed = 1;
  updateSpeedDisplay(1);
  sourceNode.onended = () => {
    isPlaying = false;
    isEffectActive = false;
    $('playBtn').classList.remove('playing');
    $('playBtn').textContent = 'Play';
    cancelAnimationFrame(animFrame);
  };
  $('playBtn').classList.add('playing');
  $('playBtn').textContent = 'Stop';
}

function stopPlayback() {
  if (sourceNode) { try { sourceNode.stop(); } catch(e){} }
  isPlaying = false;
  isEffectActive = false;
  currentSpeed = 1;
  updateSpeedDisplay(1);
  $('playBtn').classList.remove('playing');
  $('playBtn').textContent = 'Play';
  cancelAnimationFrame(animFrame);
}

function updateSpeedDisplay(speed) {
  const display = $('speedDisplay');
  display.textContent = speed.toFixed(2) + 'x';
  display.classList.toggle('slow', speed < 0.5);
}

function getEffectiveDuration() {
  if (SYNC === 'beat') return 60000 / BPM;
  if (SYNC === 'bar') return 60000 / BPM * 4;
  return DURATION;
}

function applyCurve(t) {
  // t: 0..1 where 0=start, 1=end
  switch (CURVE) {
    case 'exp': return Math.pow(t, 2);
    case 'lin': return t;
    case 'log': return 1 - Math.pow(1 - t, 2);
    default: return t;
  }
}

function doTapeStop() {
  if (!isPlaying || isEffectActive) return;
  isEffectActive = true;
  const dur = getEffectiveDuration();
  const startTime = performance.now();
  const startRate = sourceNode ? sourceNode.playbackRate.value : 1;

  function animate() {
    if (!isEffectActive) return;
    const elapsed = performance.now() - startTime;
    let t = Math.min(1, elapsed / dur);
    let curved = applyCurve(t);
    let rate = startRate * (1 - curved * (1 - MIN_RATE));
    rate = Math.max(MIN_RATE, rate);
    currentSpeed = rate;
    if (sourceNode && isPlaying) {
      sourceNode.playbackRate.setTargetAtTime(rate, ctx.currentTime, 0.01);
    }
    updateSpeedDisplay(rate);
    if (t < 1) {
      animFrame = requestAnimationFrame(animate);
    } else {
      isEffectActive = false;
      updateSpeedDisplay(MIN_RATE);
    }
  }
  animate();
}

function doReverseScratch() {
  if (!isPlaying || isEffectActive) return;
  isEffectActive = true;
  const dur = getEffectiveDuration();
  const startTime = performance.now();
  const startRate = sourceNode ? sourceNode.playbackRate.value : 1;

  function animate() {
    if (!isEffectActive) return;
    const elapsed = performance.now() - startTime;
    let t = Math.min(1, elapsed / dur);
    let curved = applyCurve(1 - t); // reverse
    let rate = startRate * (MIN_RATE + curved * (1 - MIN_RATE));
    currentSpeed = rate;
    if (sourceNode && isPlaying) {
      sourceNode.playbackRate.setTargetAtTime(rate, ctx.currentTime, 0.01);
    }
    updateSpeedDisplay(rate);
    if (t < 1) {
      animFrame = requestAnimationFrame(animate);
    } else {
      isEffectActive = false;
      updateSpeedDisplay(1);
      if (sourceNode && isPlaying) {
        sourceNode.playbackRate.setTargetAtTime(1, ctx.currentTime, 0.01);
      }
    }
  }
  animate();
}

// BPM controls
$('bpmIn').addEventListener('change', e => {
  BPM = Math.max(60, Math.min(200, parseInt(e.target.value) || 124));
  e.target.value = BPM;
});
$('bpmDown').addEventListener('click', () => { BPM = Math.max(60, BPM - 1); $('bpmIn').value = BPM; });
$('bpmUp').addEventListener('click', () => { BPM = Math.min(200, BPM + 1); $('bpmIn').value = BPM; });

// Duration slider
$('timeSlider').addEventListener('input', e => {
  DURATION = parseInt(e.target.value);
  $('timeVal').textContent = DURATION;
});

// Sync buttons
document.querySelectorAll('.mode-btn[data-sync]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn[data-sync]').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    SYNC = btn.dataset.sync;
    $('syncVal').textContent = btn.textContent;
    $('timeSlider').disabled = SYNC !== 'off';
  });
});

// Curve buttons
document.querySelectorAll('.mode-btn[data-c]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn[data-c]').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    CURVE = btn.dataset.c;
    $('curveVal').textContent = btn.textContent.charAt(0).toUpperCase() + btn.textContent.slice(1);
  });
});

// Min rate
$('minRateSlider').addEventListener('input', e => {
  MIN_RATE = parseInt(e.target.value) / 100;
  $('minRateVal').textContent = MIN_RATE.toFixed(2) + 'x';
});

// Load
$('loadBtn').addEventListener('click', () => $('audioInput').click());
$('audioInput').addEventListener('change', e => {
  if (e.target.files[0]) loadAudio(e.target.files[0]);
});

// Play
$('playBtn').addEventListener('click', () => {
  if (isPlaying) stopPlayback(); else startPlayback();
});

// Effect buttons
$('stopBtn').addEventListener('click', doTapeStop);
$('revBtn').addEventListener('click', doReverseScratch);
$('stopAllBtn').addEventListener('click', stopPlayback);

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (isPlaying) stopPlayback(); else startPlayback(); }
  if (e.code === 'KeyS') doTapeStop();
  if (e.code === 'KeyR') doReverseScratch();
  if (e.code === 'Escape') stopPlayback();
});

// Init
document.addEventListener('click', () => initAudio(), { once: true });
</script>
</body>
</html>
