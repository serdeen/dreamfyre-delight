<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Piano — Dreamfyre</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d14;
    --surface: #1a1a2e;
    --cyan: #00f5d4;
    --magenta: #f72585;
    --gold: #ffd93d;
    --text: #e0e0e0;
    --dim: #555570;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }
  .header {
    background: var(--surface);
    border-bottom: 2px solid var(--magenta);
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .dragon-title { display: flex; align-items: center; gap: 8px; }
  .dragon-logo { width: 24px; height: 24px; image-rendering: pixelated; }
  .dragon-title span { font-size: 0.8rem; color: var(--cyan); letter-spacing: 0.1em; text-transform: uppercase; }
  .midi-badge { background: var(--bg); border: 1px solid var(--dim); border-radius: 4px; padding: 3px 8px; font-size: 0.6rem; color: var(--dim); }
  .midi-badge.connected { border-color: var(--cyan); color: var(--cyan); }
  .controls {
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: #22223a;
    border: 2px solid #3a3a5a;
    border-radius: 6px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    min-width: 60px;
    min-height: 48px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .ctrl-btn:active, .ctrl-btn.pressed { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }
  .ctrl-btn .lbl { font-size: 0.5rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .ctrl-btn .val { font-size: 0.85rem; color: var(--cyan); font-weight: bold; }
  .ctrl-btn.pressed .val { color: var(--bg); }
  select.ctrl-select {
    background: #22223a;
    border: 2px solid #3a3a5a;
    border-radius: 6px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    padding: 6px 8px;
    min-height: 48px;
    cursor: pointer;
    min-width: 90px;
  }
  /* PIANO — upper third */
  .piano-wrap {
    height: calc(100vh / 3);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  .piano {
    flex: 1;
    display: flex;
    position: relative;
    min-height: 0;
  }
  /* WHITE KEYS — flex evenly, pure white */
  .key { position: relative; cursor: pointer; transition: filter 0.06s; flex-shrink: 0; }
  .key.white {
    flex: 1;
    height: 100%;
    background: #ffffff;
    border: 1px solid #888;
    border-top: none;
    border-radius: 0 0 4px 4px;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.3);
  }
  .key.white:active, .key.white.pressed {
    background: #e8e8e0;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.2);
  }
  /* BLACK KEYS — pixel-sized, centered over white-key boundaries */
  .key.black {
    position: absolute;
    height: 62%;
    background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
    border: 1px solid #000;
    border-top: none;
    border-radius: 0 0 3px 3px;
    z-index: 2;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5);
  }
  .key.black:active, .key.black.pressed {
    background: linear-gradient(180deg, #333 0%, #111 100%);
  }
  .footer { flex: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; border-top: 1px solid #1e1e2e; }
  .footer-text { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; }
  .footer-text span { color: var(--magenta); }
</style>
</head>
<body>
<div class="header">
  <div class="dragon-title">
    <svg class="dragon-logo" viewBox="0 0 16 16" fill="none">
      <rect x="4" y="2" width="2" height="2" fill="#f72585"/>
      <rect x="8" y="2" width="2" height="2" fill="#f72585"/>
      <rect x="2" y="4" width="10" height="6" fill="#00f5d4"/>
      <rect x="4" y="4" width="2" height="2" fill="#0d0d14"/>
      <rect x="8" y="4" width="2" height="2" fill="#0d0d14"/>
      <rect x="0" y="6" width="2" height="2" fill="#ffd93d"/>
      <rect x="12" y="6" width="2" height="2" fill="#ffd93d"/>
      <rect x="6" y="8" width="4" height="2" fill="#f72585"/>
      <rect x="4" y="10" width="8" height="2" fill="#f72585"/>
      <rect x="2" y="12" width="4" height="2" fill="#00f5d4"/>
      <rect x="10" y="12" width="4" height="2" fill="#00f5d4"/>
    </svg>
    <span>Dragon Piano</span>
  </div>
  <div class="midi-badge" id="midi-status">No MIDI</div>
</div>
<div class="controls">
  <select class="ctrl-select" id="wave-select">
    <option value="sine">Sine</option>
    <option value="triangle">Tri</option>
    <option value="square">Square</option>
    <option value="sawtooth">Saw</option>
  </select>
  <div class="ctrl-btn" id="oct-down"><span class="lbl">Oct</span><span class="val">&#9660;</span></div>
  <div class="ctrl-btn" id="oct-display"><span class="lbl">Octave</span><span class="val" id="oct-val">0</span></div>
  <div class="ctrl-btn" id="oct-up"><span class="lbl">Oct</span><span class="val">&#9650;</span></div>
  <div class="ctrl-btn" id="vol-btn"><span class="lbl">Vol</span><span class="val" id="vol-val">60%</span></div>
  <div class="ctrl-btn" id="atk-btn"><span class="lbl">Atk</span><span class="val" id="atk-val">10ms</span></div>
  <div class="ctrl-btn" id="rel-btn"><span class="lbl">Rel</span><span class="val" id="rel-val">150ms</span></div>
</div>
<div class="piano-wrap"><div class="piano" id="piano"></div></div>
<div class="footer"><div class="footer-text">Play with keys, <span>keyboard</span>, or <span>MIDI</span></div></div>
<script>
(function() {
  var NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var audioCtx = null, masterGain, compressor;
  var activeNotes = new Map();
  var currentWave = 'sine', octaveShift = 0, atkMs = 10, relMs = 150, vol = 0.6;
  var WHITE_WIDTH = 48, GAP = 2, SLOT = WHITE_WIDTH + GAP; // 50px per slot
  var BLACK_W = 30;

  function calcMidiFreq(n) { return 440 * Math.pow(2, (n - 69 + octaveShift * 12) / 12); }
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = vol;
    compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -6; compressor.ratio.value = 4; compressor.knee.value = 3;
    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);
  }
  function playNote(noteNum, velocity) {
    initAudio();
    if (activeNotes.has(noteNum)) return;
    var osc = audioCtx.createOscillator();
    var noteGain = audioCtx.createGain();
    osc.type = currentWave;
    osc.frequency.value = calcMidiFreq(noteNum);
    noteGain.gain.value = 0;
    var now = audioCtx.currentTime;
    noteGain.gain.setTargetAtTime(velocity * 0.35, now, atkMs / 1000);
    osc.connect(noteGain);
    noteGain.connect(masterGain);
    osc.start();
    activeNotes.set(noteNum, { osc: osc, noteGain: noteGain });
  }
  function stopNote(noteNum) {
    var node = activeNotes.get(noteNum);
    if (!node) return;
    var osc = node.osc, noteGain = node.noteGain;
    var now = audioCtx.currentTime;
    noteGain.gain.cancelScheduledValues(now);
    noteGain.gain.setValueAtTime(noteGain.gain.value, now);
    noteGain.gain.exponentialRampToValueAtTime(0.0001, now + relMs / 1000);
    setTimeout(function() { try { osc.stop(); } catch(e) {} }, relMs + 50);
    activeNotes.delete(noteNum);
  }
  function buildPiano() {
    var piano = document.getElementById('piano');
    var octaves = [3, 4];
    var whiteKeys = [];

    // White keys — flex: 1 evenly
    for (var o = 0; o < octaves.length; o++) {
      for (var i = 0; i < 12; i++) {
        var note = NOTES[i];
        if (!note.includes('#')) {
          var noteNum = (octaves[o] + 1) * 12 + i;
          var key = document.createElement('div');
          key.className = 'key white';
          key.dataset.noteNum = noteNum;
          piano.appendChild(key);
          whiteKeys.push(key);
        }
      }
    }

    // Black keys — absolute position based on pixel slot positions
    // Each white slot = 50px (48px key + 2px gap)
    // Black key 30px wide, centered over boundary → left = slotPos + 24 - 15 = slotPos + 9
    var blackPositions = [
      // Octave 3 (keys 0-6)
      { note: 'C#', whiteIdx: 0, left: 0 * SLOT + 9 },
      { note: 'D#', whiteIdx: 1, left: 1 * SLOT + 9 },
      { note: 'F#', whiteIdx: 3, left: 3 * SLOT + 9 },
      { note: 'G#', whiteIdx: 4, left: 4 * SLOT + 9 },
      { note: 'A#', whiteIdx: 5, left: 5 * SLOT + 9 },
      // Octave 4 (keys 7-13)
      { note: 'C#', whiteIdx: 7, left: 7 * SLOT + 9 },
      { note: 'D#', whiteIdx: 8, left: 8 * SLOT + 9 },
      { note: 'F#', whiteIdx: 10, left: 10 * SLOT + 9 },
      { note: 'G#', whiteIdx: 11, left: 11 * SLOT + 9 },
      { note: 'A#', whiteIdx: 12, left: 12 * SLOT + 9 },
    ];

    for (var j = 0; j < blackPositions.length; j++) {
      var bp = blackPositions[j];
      var note = bp.note;
      var octIdx = bp.whiteIdx < 7 ? 3 : 4;
      var noteNum = (octIdx + 1) * 12 + NOTES.indexOf(note);
      var key = document.createElement('div');
      key.className = 'key black';
      key.dataset.noteNum = noteNum;
      key.style.left = bp.left + 'px';
      key.style.width = BLACK_W + 'px';
      piano.appendChild(key);
    }

    // Event wiring
    piano.querySelectorAll('.key').forEach(function(key) {
      var noteNum = parseInt(key.dataset.noteNum);
      var press = function(e) { e.preventDefault(); initAudio(); playNote(noteNum, 0.8); key.classList.add('pressed'); };
      var release = function() { stopNote(noteNum); key.classList.remove('pressed'); };
      key.addEventListener('mousedown', press);
      key.addEventListener('mouseup', release);
      key.addEventListener('mouseleave', release);
      key.addEventListener('touchstart', press, { passive: false });
      key.addEventListener('touchend', release);
    });

    piano.addEventListener('touchmove', function(e) {
      e.preventDefault();
      for (var t = 0; t < e.changedTouches.length; t++) {
        var el = document.elementFromPoint(e.changedTouches[t].clientX, e.changedTouches[t].clientY);
        if (el && el.classList.contains('key')) {
          var n = parseInt(el.dataset.noteNum);
          initAudio();
          if (!activeNotes.has(n)) playNote(n, 0.7);
          piano.querySelectorAll('.key.pressed').forEach(function(k) { if (k !== el) k.classList.remove('pressed'); });
          el.classList.add('pressed');
        }
      }
    }, { passive: false });

    piano.addEventListener('touchend', function() {
      piano.querySelectorAll('.key.pressed').forEach(function(k) { k.classList.remove('pressed'); });
    });
  }

  async function initMIDI() {
    if (!navigator.requestMIDIAccess) return;
    try {
      var midiAccess = await navigator.requestMIDIAccess({ sysex: false });
      midiAccess.inputs.forEach(function(input) { input.onmidimessage = handleMIDIMessage; });
      midiAccess.onstatechange = function(e) { if (e.port.state === 'connected') e.port.onmidimessage = handleMIDIMessage; };
    } catch(e) {}
  }

  function handleMIDIMessage(event) {
    var data = event.data, status = data[0], d1 = data[1], d2 = data[2];
    var cmd = status & 0xf0, port = event.target;
    var isKK = port.name && port.name.toLowerCase().includes('komplete kontrol');
    if (cmd === 0x90 && d2 > 0) {
      playNote(d1, d2 / 127);
      if (isKK) { var el = document.getElementById('midi-status'); el.textContent = '🎹 ' + port.name; el.classList.add('connected'); }
    } else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) { stopNote(d1); }
  }

  document.getElementById('wave-select').addEventListener('change', function(e) { currentWave = e.target.value; });
  document.getElementById('oct-up').addEventListener('click', function() { octaveShift = Math.min(octaveShift + 1, 2); document.getElementById('oct-val').textContent = octaveShift >= 0 ? '+' + octaveShift : octaveShift; });
  document.getElementById('oct-down').addEventListener('click', function() { octaveShift = Math.max(octaveShift - 1, -2); document.getElementById('oct-val').textContent = octaveShift >= 0 ? '+' + octaveShift : octaveShift; });
  var volumes = [0.3, 0.5, 0.7, 1.0], volIdx = 1;
  document.getElementById('vol-btn').addEventListener('click', function() { volIdx = (volIdx + 1) % volumes.length; vol = volumes[volIdx]; document.getElementById('vol-val').textContent = Math.round(vol * 100) + '%'; if (masterGain) masterGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.02); });
  var atkValues = [5, 10, 30, 50, 100], atkIdx = 1;
  document.getElementById('atk-btn').addEventListener('click', function() { atkIdx = (atkIdx + 1) % atkValues.length; atkMs = atkValues[atkIdx]; document.getElementById('atk-val').textContent = atkMs + 'ms'; });
  var relValues = [50, 100, 150, 300, 500], relIdx = 2;
  document.getElementById('rel-btn').addEventListener('click', function() { relIdx = (relIdx + 1) % relValues.length; relMs = relValues[relIdx]; document.getElementById('rel-val').textContent = relMs + 'ms'; });
  var keyMap = { 'a': 60, 'w': 61, 's': 62, 'e': 63, 'd': 64, 'f': 65, 't': 66, 'g': 67, 'y': 68, 'h': 69, 'u': 70, 'j': 71, 'k': 72, 'o': 73, 'l': 74, 'p': 75, ';': 76 };
  var pressedKeys = new Set();
  document.addEventListener('keydown', function(e) { if (e.repeat || pressedKeys.has(e.key)) return; pressedKeys.add(e.key); var note = keyMap[e.key.toLowerCase()]; if (note !== undefined) { initAudio(); playNote(note, 0.8); } });
  document.addEventListener('keyup', function(e) { pressedKeys.delete(e.key); var note = keyMap[e.key.toLowerCase()]; if (note !== undefined) stopNote(note); });
  buildPiano();
  initMIDI();
})();
</script>
</body>
</html>
