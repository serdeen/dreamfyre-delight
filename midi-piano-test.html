<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Piano Test — Dreamfyre</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #13131a; --border: #1e1e2e;
    --cyan: #00f5d4; --magenta: #f72585; --text: #e0e0e0; --dim: #666680;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; user-select: none; }
  h1 { font-size: 1rem; letter-spacing: 0.15em; color: var(--cyan); text-transform: uppercase; margin-bottom: 0.5rem; }
  #midi-status { font-size: 0.75rem; color: var(--dim); margin-bottom: 1.5rem; min-height: 1.2em; }
  #midi-status.connected { color: var(--cyan); }
  #midi-status.connected::before { content: '🎹 '; }
  .piano { display: flex; position: relative; height: 160px; width: 100%; max-width: 900px; }
  .key { position: relative; cursor: pointer; border-radius: 0 0 8px 8px; transition: background 0.06s, transform 0.06s; transform-origin: top; }
  .key.white { flex: 1; height: 100%; background: linear-gradient(180deg, #f5f5f0 0%, #d8d8cc 100%); border: 1px solid #bbb; margin-right: -1px; z-index: 1; }
  .key.white.pressed { background: linear-gradient(180deg, #e0e0d0 0%, #b8b8a8 100%); transform: scaleY(0.98); }
  .key.black { position: absolute; height: 60%; background: linear-gradient(180deg, #3a3a3a 0%, #0d0d0d 100%); border: 1px solid #000; z-index: 2; border-radius: 0 0 6px 6px; }
  .key.black.pressed { background: linear-gradient(180deg, #555 0%, #222 100%); transform: scaleY(0.97); }
  .note-label { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; color: #888; pointer-events: none; font-family: monospace; }
  .key.black .note-label { color: #555; }
  .log { margin-top: 2rem; width: 100%; max-width: 900px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; font-family: monospace; font-size: 0.65rem; color: var(--dim); max-height: 120px; overflow-y: auto; }
  .log-row { padding: 0.15rem 0; border-bottom: 1px solid var(--border); }
  .log-row:last-child { border-bottom: none; }
  .log-row.active { color: var(--cyan); }
  .hint { margin-top: 1rem; font-size: 0.7rem; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<h1>MIDI Piano Test</h1>
<div id="midi-status">Tap a key or connect your MIDI controller</div>
<div class="piano" id="piano"></div>
<div class="log" id="log"><div class="log-row">Waiting for input...</div></div>
<div class="hint">Click keys or use your Komplete Kontrol keyboard</div>
<script>
(function() {
  const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  let audioCtx = null;
  let masterGain, compressor;
  let activeNotes = new Map();
  const logEl = document.getElementById('log');
  let logLines = [];

  function logMsg(msg, active) {
    logLines.unshift(msg);
    if (logLines.length > 20) logLines.pop();
    logEl.innerHTML = logLines.map(function(m, i) {
      return '<div class="log-row' + (i === 0 && active ? ' active' : '') + '">' + m + '</div>';
    }).join('');
  }

  function calcMidiFreq(noteNum) {
    return 440 * Math.pow(2, (noteNum - 69) / 12);
  }

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -6;
    compressor.ratio.value = 4;
    compressor.knee.value = 3;
    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);
  }

  function playNote(noteNum, velocity) {
    initAudio();
    if (activeNotes.has(noteNum)) return;
    var osc = audioCtx.createOscillator();
    var noteGain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = calcMidiFreq(noteNum);
    noteGain.gain.value = 0;
    var now = audioCtx.currentTime;
    noteGain.gain.setTargetAtTime(velocity * 0.3, now, 0.005);
    osc.connect(noteGain);
    noteGain.connect(masterGain);
    osc.start();
    activeNotes.set(noteNum, { osc: osc, noteGain: noteGain });
    var noteName = NOTES[noteNum % 12] + Math.floor(noteNum / 12);
    logMsg('▶ ' + noteName + ' (' + noteNum + ') vel:' + Math.round(velocity * 127), true);
  }

  function stopNote(noteNum) {
    var node = activeNotes.get(noteNum);
    if (!node) return;
    var osc = node.osc;
    var noteGain = node.noteGain;
    var now = audioCtx.currentTime;
    noteGain.gain.cancelScheduledValues(now);
    noteGain.gain.setValueAtTime(noteGain.gain.value, now);
    noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
    setTimeout(function() { try { osc.stop(); } catch(e) {} }, 200);
    activeNotes.delete(noteNum);
  }

  function buildPiano() {
    var piano = document.getElementById('piano');
    var octaves = [3, 4];
    var whiteCount = 14;
    var whiteIndex = 0;

    for (var o = 0; o < octaves.length; o++) {
      for (var i = 0; i < 12; i++) {
        var note = NOTES[i];
        if (!note.includes('#')) {
          var noteNum = (octaves[o] + 1) * 12 + i;
          var key = document.createElement('div');
          key.className = 'key white';
          key.dataset.noteNum = noteNum;
          var label = document.createElement('span');
          label.className = 'note-label';
          label.textContent = note + octaves[o];
          key.appendChild(label);
          piano.appendChild(key);
          whiteIndex++;
        }
      }
    }

    var offsets = { 'C#': 0.65, 'D#': 1.75, 'F#': 3.9, 'G#': 4.95, 'A#': 6.1 };
    whiteIndex = 0;
    for (var o = 0; o < octaves.length; o++) {
      for (var i = 0; i < 12; i++) {
        var note = NOTES[i];
        if (note.includes('#')) {
          var noteNum = (octaves[o] + 1) * 12 + i;
          var offset = offsets[note];
          var leftPct = ((o * 7) + offset) / whiteCount * 100;
          var key = document.createElement('div');
          key.className = 'key black';
          key.dataset.noteNum = noteNum;
          key.style.left = leftPct + '%';
          key.style.width = (100 / whiteCount) * 0.65 + '%';
          var label = document.createElement('span');
          label.className = 'note-label';
          label.textContent = note;
          key.appendChild(label);
          piano.appendChild(key);
        } else {
          whiteIndex++;
        }
      }
    }

    piano.querySelectorAll('.key').forEach(function(key) {
      var noteNum = parseInt(key.dataset.noteNum);
      var press = function(e) { e.preventDefault(); initAudio(); playNote(noteNum, 0.8); key.classList.add('pressed'); };
      var release = function() { stopNote(noteNum); key.classList.remove('pressed'); };
      key.addEventListener('mousedown', press);
      key.addEventListener('mouseup', release);
      key.addEventListener('mouseleave', release);
      key.addEventListener('touchstart', press, { passive: false });
      key.addEventListener('touchend', release);
    });

    piano.addEventListener('touchmove', function(e) {
      e.preventDefault();
      for (var t = 0; t < e.changedTouches.length; t++) {
        var touch = e.changedTouches[t];
        var el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.classList.contains('key')) {
          var n = parseInt(el.dataset.noteNum);
          initAudio();
          if (!activeNotes.has(n)) playNote(n, 0.7);
          piano.querySelectorAll('.key.pressed').forEach(function(k) { if (k !== el) k.classList.remove('pressed'); });
          el.classList.add('pressed');
        }
      }
    }, { passive: false });
  }

  async function initMIDI() {
    if (!navigator.requestMIDIAccess) {
      logMsg('Web MIDI not supported', false);
      return;
    }
    try {
      var midiAccess = await navigator.requestMIDIAccess({ sysex: false });
      logMsg('MIDI ready — ' + midiAccess.inputs.size + ' input(s) found', false);
      midiAccess.inputs.forEach(function(input) { wireMIDI(input); });
      midiAccess.onstatechange = function(e) {
        if (e.port.state === 'connected') {
          wireMIDI(e.port);
          logMsg('Connected: ' + e.port.name, false);
        }
      };
      updateMIDIStatus();
    } catch(e) {
      logMsg('MIDI access denied', false);
    }
  }

  function wireMIDI(input) {
    logMsg('Wiring: ' + input.name, false);
    input.onmidimessage = handleMIDIMessage;
  }

  function handleMIDIMessage(event) {
    var data = event.data;
    var status = data[0];
    var d1 = data[1];
    var d2 = data[2];
    var cmd = status & 0xf0;
    var port = event.target;
    var isKK = port.name && port.name.toLowerCase().includes('komplete kontrol');

    if (cmd === 0x90 && d2 > 0) {
      playNote(d1, d2 / 127);
      if (isKK) updateMIDIStatus('🎹 ' + port.name + ' connected');
    } else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) {
      stopNote(d1);
    }
  }

  function updateMIDIStatus(msg) {
    var el = document.getElementById('midi-status');
    if (msg) { el.textContent = msg; el.classList.add('connected'); }
  }

  var keyMap = {
    'a': 60, 'w': 61, 's': 62, 'e': 63, 'd': 64, 'f': 65, 't': 66, 'g': 67, 'y': 68, 'h': 69,
    'u': 70, 'j': 71, 'k': 72, 'o': 73, 'l': 74, 'p': 75, ';': 76
  };
  var keyboardKeys = new Set();
  document.addEventListener('keydown', function(e) {
    if (e.repeat || keyboardKeys.has(e.key)) return;
    keyboardKeys.add(e.key);
    var note = keyMap[e.key.toLowerCase()];
    if (note !== undefined) { initAudio(); playNote(note, 0.8); }
  });
  document.addEventListener('keyup', function(e) {
    keyboardKeys.delete(e.key);
    var note = keyMap[e.key.toLowerCase()];
    if (note !== undefined) stopNote(note);
  });

  buildPiano();
  initMIDI();
})();
</script>
</body>
</html>
