<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Piano — KK Test</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #13131a; --border: #1e1e2e;
    --cyan: #00f5d4; --magenta: #f72585; --text: #e0e0e0; --dim: #666680;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem; user-select: none; }
  h1 { font-size: 0.9rem; letter-spacing: 0.15em; color: var(--cyan); text-transform: uppercase; margin-bottom: 0.5rem; }
  #midi-status { font-size: 0.7rem; color: var(--dim); margin-bottom: 1rem; min-height: 1.2em; }
  #midi-status.connected { color: var(--cyan); }
  #midi-status.connected::before { content: '🎹 '; }
  .controls { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; justify-content: center; }
  .ctrl-group { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .ctrl-label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .ctrl-group select, .ctrl-group input[type="range"] { cursor: pointer; }
  select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 0.25rem 0.5rem; font-family: inherit; font-size: 0.7rem; }
  input[type="range"] { -webkit-appearance: none; width: 80px; height: 4px; background: var(--border); border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--cyan); border-radius: 50%; }
  .val { font-family: monospace; font-size: 0.6rem; color: var(--cyan); min-width: 30px; text-align: center; }
  .piano-wrap { width: 100%; max-width: 900px; user-select: none; touch-action: none; }
  .piano { display: flex; position: relative; height: 140px; }
  .key { position: relative; cursor: pointer; border-radius: 0 0 8px 8px; transition: background 0.06s, transform 0.06s; transform-origin: top; }
  .key.white { flex: 1; height: 100%; background: linear-gradient(180deg, #f5f5f0 0%, #d8d8cc 100%); border: 1px solid #bbb; margin-right: -1px; z-index: 1; }
  .key.white.pressed { background: linear-gradient(180deg, #e0e0d0 0%, #b8b8a8 100%); transform: scaleY(0.98); }
  .key.black { position: absolute; height: 60%; background: linear-gradient(180deg, #3a3a3a 0%, #0d0d0d 100%); border: 1px solid #000; z-index: 2; border-radius: 0 0 6px 6px; }
  .key.black.pressed { background: linear-gradient(180deg, #555 0%, #222 100%); transform: scaleY(0.97); }
  .note-label { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 0.55rem; color: #888; pointer-events: none; font-family: monospace; }
  .key.black .note-label { color: #555; }
  .log { margin-top: 1rem; width: 100%; max-width: 900px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; font-family: monospace; font-size: 0.6rem; color: var(--dim); max-height: 80px; overflow-y: auto; }
  .log-row { padding: 0.1rem 0; border-bottom: 1px solid var(--border); }
  .log-row:last-child { border-bottom: none; }
  .log-row.active { color: var(--cyan); }
  .hint { margin-top: 0.75rem; font-size: 0.65rem; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<h1>KK MIDI Test</h1>
<div id="midi-status">Tap a key or connect your MIDI controller</div>
<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Wave</span>
    <select id="wave-select">
      <option value="sine">Sine</option>
      <option value="triangle">Triangle</option>
      <option value="square">Square</option>
      <option value="sawtooth">Sawtooth</option>
    </select>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Volume</span>
    <input type="range" id="vol-slider" min="0" max="100" value="60">
    <span class="val" id="vol-val">60%</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Attack</span>
    <input type="range" id="atk-slider" min="1" max="200" value="10">
    <span class="val" id="atk-val">10ms</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Release</span>
    <input type="range" id="rel-slider" min="10" max="1000" value="150">
    <span class="val" id="rel-val">150ms</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Octave</span>
    <select id="oct-select">
      <option value="2">+2</option>
      <option value="1">+1</option>
      <option value="0" selected>0</option>
      <option value="-1">-1</option>
      <option value="-2">-2</option>
    </select>
  </div>
</div>
<div class="piano-wrap">
  <div class="piano" id="piano"></div>
</div>
<div class="log" id="log"><div class="log-row">Waiting for input...</div></div>
<div class="hint">Click keys, use keyboard (A-L row = white, W-U row = black), or Komplete Kontrol</div>
<script>
(function() {
  var NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var audioCtx = null;
  var masterGain, compressor;
  var activeNotes = new Map();
  var currentWave = 'sine';
  var octaveShift = 0;
  var atkMs = 10, relMs = 150;
  var logEl = document.getElementById('log');
  var logLines = [];

  function logMsg(msg, active) {
    logLines.unshift(msg);
    if (logLines.length > 15) logLines.pop();
    logEl.innerHTML = logLines.map(function(m, i) {
      return '<div class="log-row' + (i === 0 && active ? ' active' : '') + '">' + m + '</div>';
    }).join('');
  }

  function calcMidiFreq(noteNum) {
    return 440 * Math.pow(2, (noteNum - 69 + octaveShift * 12) / 12);
  }

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -6;
    compressor.ratio.value = 4;
    compressor.knee.value = 3;
    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);
    logMsg('Audio ready', false);
  }

  function playNote(noteNum, velocity) {
    initAudio();
    if (activeNotes.has(noteNum)) return;
    var osc = audioCtx.createOscillator();
    var noteGain = audioCtx.createGain();
    osc.type = currentWave;
    osc.frequency.value = calcMidiFreq(noteNum);
    noteGain.gain.value = 0;
    var now = audioCtx.currentTime;
    noteGain.gain.setTargetAtTime(velocity * 0.35, now, atkMs / 1000);
    osc.connect(noteGain);
    noteGain.connect(masterGain);
    osc.start();
    activeNotes.set(noteNum, { osc: osc, noteGain: noteGain });
    var noteName = NOTES[(noteNum + octaveShift * 12) % 12] + Math.floor((noteNum + octaveShift * 12) / 12);
    logMsg('▶ ' + noteName + ' vel:' + Math.round(velocity * 127), true);
  }

  function stopNote(noteNum) {
    var node = activeNotes.get(noteNum);
    if (!node) return;
    var osc = node.osc;
    var noteGain = node.noteGain;
    var now = audioCtx.currentTime;
    noteGain.gain.cancelScheduledValues(now);
    noteGain.gain.setValueAtTime(noteGain.gain.value, now);
    noteGain.gain.exponentialRampToValueAtTime(0.0001, now + relMs / 1000);
    setTimeout(function() { try { osc.stop(); } catch(e) {} }, relMs + 50);
    activeNotes.delete(noteNum);
  }

  function buildPiano() {
    var piano = document.getElementById('piano');
    var octaves = [3, 4];
    var whiteCount = 14;

    for (var o = 0; o < octaves.length; o++) {
      for (var i = 0; i < 12; i++) {
        var note = NOTES[i];
        if (!note.includes('#')) {
          var noteNum = (octaves[o] + 1) * 12 + i;
          var key = document.createElement('div');
          key.className = 'key white';
          key.dataset.noteNum = noteNum;
          var label = document.createElement('span');
          label.className = 'note-label';
          label.textContent = note + octaves[o];
          key.appendChild(label);
          piano.appendChild(key);
        }
      }
    }

    var offsets = { 'C#': 0.65, 'D#': 1.75, 'F#': 3.9, 'G#': 4.95, 'A#': 6.1 };
    for (var o = 0; o < octaves.length; o++) {
      for (var i = 0; i < 12; i++) {
        var note = NOTES[i];
        if (note.includes('#')) {
          var noteNum = (octaves[o] + 1) * 12 + i;
          var offset = offsets[note];
          var leftPct = ((o * 7) + offset) / whiteCount * 100;
          var key = document.createElement('div');
          key.className = 'key black';
          key.dataset.noteNum = noteNum;
          key.style.left = leftPct + '%';
          key.style.width = (100 / whiteCount) * 0.65 + '%';
          var label = document.createElement('span');
          label.className = 'note-label';
          label.textContent = note;
          key.appendChild(label);
          piano.appendChild(key);
        }
      }
    }

    piano.querySelectorAll('.key').forEach(function(key) {
      var noteNum = parseInt(key.dataset.noteNum);
      var press = function(e) { e.preventDefault(); initAudio(); playNote(noteNum, 0.8); key.classList.add('pressed'); };
      var release = function() { stopNote(noteNum); key.classList.remove('pressed'); };
      key.addEventListener('mousedown', press);
      key.addEventListener('mouseup', release);
      key.addEventListener('mouseleave', release);
      key.addEventListener('touchstart', press, { passive: false });
      key.addEventListener('touchend', release);
    });

    piano.addEventListener('touchmove', function(e) {
      e.preventDefault();
      for (var t = 0; t < e.changedTouches.length; t++) {
        var touch = e.changedTouches[t];
        var el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.classList.contains('key')) {
          var n = parseInt(el.dataset.noteNum);
          initAudio();
          if (!activeNotes.has(n)) playNote(n, 0.7);
          piano.querySelectorAll('.key.pressed').forEach(function(k) { if (k !== el) k.classList.remove('pressed'); });
          el.classList.add('pressed');
        }
      }
    }, { passive: false });
  }

  async function initMIDI() {
    if (!navigator.requestMIDIAccess) {
      logMsg('Web MIDI not supported', false);
      return;
    }
    try {
      var midiAccess = await navigator.requestMIDIAccess({ sysex: false });
      logMsg('MIDI ready — ' + midiAccess.inputs.size + ' input(s)', false);
      midiAccess.inputs.forEach(function(input) { wireMIDI(input); });
      midiAccess.onstatechange = function(e) {
        if (e.port.state === 'connected') {
          wireMIDI(e.port);
          logMsg('Connected: ' + e.port.name, false);
        }
      };
    } catch(e) {
      logMsg('MIDI denied', false);
    }
  }

  function wireMIDI(input) {
    input.onmidimessage = handleMIDIMessage;
  }

  function handleMIDIMessage(event) {
    var data = event.data;
    var status = data[0];
    var d1 = data[1];
    var d2 = data[2];
    var cmd = status & 0xf0;
    var port = event.target;
    var isKK = port.name && port.name.toLowerCase().includes('komplete kontrol');

    if (cmd === 0x90 && d2 > 0) {
      playNote(d1, d2 / 127);
      if (isKK) updateMIDIStatus('🎹 ' + port.name + ' connected');
    } else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) {
      stopNote(d1);
    }
  }

  function updateMIDIStatus(msg) {
    var el = document.getElementById('midi-status');
    if (msg) { el.textContent = msg; el.classList.add('connected'); }
  }

  // Controls
  document.getElementById('wave-select').addEventListener('change', function(e) {
    currentWave = e.target.value;
  });

  document.getElementById('vol-slider').addEventListener('input', function(e) {
    var v = e.target.value / 100;
    document.getElementById('vol-val').textContent = e.target.value + '%';
    if (masterGain) masterGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
  });

  document.getElementById('atk-slider').addEventListener('input', function(e) {
    atkMs = parseInt(e.target.value);
    document.getElementById('atk-val').textContent = atkMs + 'ms';
  });

  document.getElementById('rel-slider').addEventListener('input', function(e) {
    relMs = parseInt(e.target.value);
    document.getElementById('rel-val').textContent = relMs + 'ms';
  });

  document.getElementById('oct-select').addEventListener('change', function(e) {
    octaveShift = parseInt(e.target.value);
  });

  // Keyboard: A-L = C3-B3 white keys, W-U = black keys
  var keyMap = {
    'a': 60, 'w': 61, 's': 62, 'e': 63, 'd': 64, 'f': 65, 't': 66, 'g': 67, 'y': 68, 'h': 69,
    'u': 70, 'j': 71, 'k': 72, 'o': 73, 'l': 74, 'p': 75, ';': 76
  };
  var keyboardKeys = new Set();
  document.addEventListener('keydown', function(e) {
    if (e.repeat || keyboardKeys.has(e.key)) return;
    keyboardKeys.add(e.key);
    var note = keyMap[e.key.toLowerCase()];
    if (note !== undefined) { initAudio(); playNote(note, 0.8); }
  });
  document.addEventListener('keyup', function(e) {
    keyboardKeys.delete(e.key);
    var note = keyMap[e.key.toLowerCase()];
    if (note !== undefined) stopNote(note);
  });

  buildPiano();
  initMIDI();
})();
</script>
</body>
</html>
