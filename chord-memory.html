<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090b10;
    --surface: #0f1218;
    --surface2: #161b24;
    --surface3: #1c2230;
    --border: #222d3d;
    --text: #c0c8d8;
    --muted: #4a5568;
    --amber: #e8a832;
    --amber-dim: #7a5418;
    --cyan: #00d4c8;
    --green: #50e880;
    --pink: #e840a0;
    --white: #f0f4f8;
    --key-white: #d0d8e8;
    --key-black: #1a1e28;
    --key-active: #00d4c8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--amber);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .logo em { color: var(--muted); font-style: normal; }

  /* BPM */
  .bpm-control {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px;
  }
  .bpm-value {
    font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700;
    color: var(--amber); min-width: 48px; text-align: center;
  }
  .bpm-label { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
  .tap-btn {
    background: var(--surface2); border: 1px solid var(--amber-dim); color: var(--amber);
    padding: 5px 10px; border-radius: 6px; font-family: 'Space Mono', monospace;
    font-size: 10px; cursor: pointer; letter-spacing: 1px; transition: all 0.1s;
  }
  .tap-btn:hover { background: var(--amber-dim); }
  .tap-btn:active { background: var(--amber); color: #000; transform: scale(0.95); }

  /* Transport */
  .transport { display: flex; align-items: center; gap: 6px; }
  .transport-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--surface2);
    color: var(--text); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
  }
  .transport-btn:hover { border-color: var(--amber); color: var(--amber); }
  .transport-btn.active { background: var(--amber); border-color: var(--amber); color: #000; }
  .transport-btn:active { transform: scale(0.92); }
  .transport-btn svg { width: 14px; height: 14px; }

  /* Voicing selector */
  .voicing-group { display: flex; gap: 4px; }
  .voicing-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); padding: 4px 8px; border-radius: 5px;
    font-size: 9px; font-family: 'DM Sans', sans-serif; cursor: pointer;
    transition: all 0.1s; letter-spacing: 0.5px;
  }
  .voicing-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .voicing-btn.active { background: var(--cyan); border-color: var(--cyan); color: #000; font-weight: 600; }

  /* Pattern selector */
  .pattern-group { display: flex; gap: 3px; }
  .pattern-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); padding: 4px 8px; border-radius: 5px;
    font-size: 9px; font-family: 'DM Sans', sans-serif; cursor: pointer;
    transition: all 0.1s; letter-spacing: 0.5px;
  }
  .pattern-btn:hover { border-color: var(--pink); color: var(--pink); }
  .pattern-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 600; }

  /* Key selector */
  .key-selector { display: flex; align-items: center; gap: 4px; }
  .key-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); padding: 4px 8px; border-radius: 5px;
    font-size: 10px; font-family: 'Space Mono', monospace; cursor: pointer;
    transition: all 0.1s; min-width: 28px; text-align: center;
  }
  .key-btn:hover { border-color: var(--green); color: var(--green); }
  .key-btn.active { background: var(--green); border-color: var(--green); color: #000; font-weight: 700; }

  /* Main */
  .main { flex: 1; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 14px; }

  /* Piano display */
  .piano-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; overflow-x: auto;
  }
  .piano-title {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  .piano-container { position: relative; height: 90px; min-width: 600px; }
  .piano-white-keys {
    display: flex; height: 90px; gap: 1px;
  }
  .piano-white-key {
    flex: 1; background: var(--key-white); border-radius: 0 0 3px 3px;
    border: 1px solid #aaa; position: relative; cursor: pointer;
    transition: background 0.05s;
  }
  .piano-white-key:hover { background: #e0e8f0; }
  .piano-white-key.active { background: var(--key-active); }
  .piano-white-key .note-label {
    position: absolute; bottom: 4px; width: 100%; text-align: center;
    font-size: 8px; color: var(--muted); font-family: 'Space Mono', monospace;
    pointer-events: none;
  }
  .piano-white-key.active .note-label { color: #000; }
  .piano-black-keys {
    position: absolute; top: 0; left: 0; right: 0; height: 58px;
    display: flex; pointer-events: none;
  }
  .piano-black-key {
    position: absolute; width: 5.5%; height: 58px;
    background: var(--key-black); border-radius: 0 0 2px 2px;
    z-index: 2; pointer-events: all; cursor: pointer;
    transition: background 0.05s;
  }
  .piano-black-key:hover { background: #2a3040; }
  .piano-black-key.active { background: var(--key-active); }
  .piano-black-key .note-label {
    position: absolute; bottom: 3px; width: 100%; text-align: center;
    font-size: 7px; color: #888; font-family: 'Space Mono', monospace;
    pointer-events: none;
  }
  .piano-black-key.active .note-label { color: #000; }

  /* Current chord display */
  .chord-display {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; display: flex;
    align-items: center; gap: 14px;
  }
  .chord-name {
    font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700;
    color: var(--amber); min-width: 80px;
  }
  .chord-type {
    font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted);
    letter-spacing: 1px;
  }
  .chord-notes {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .chord-note {
    background: var(--surface3); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 8px;
    font-family: 'Space Mono', monospace; font-size: 10px; color: var(--cyan);
  }
  .chord-note.root { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }

  /* Progression grid */
  .progression-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .prog-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }
  .prog-title { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .prog-hint { font-size: 9px; color: var(--muted); }
  .prog-grid {
    display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px;
  }
  .prog-grid::-webkit-scrollbar { height: 3px; }
  .prog-grid::-webkit-scrollbar-track { background: var(--bg); }
  .prog-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .prog-cell {
    min-width: 56px; height: 52px; border-radius: 6px;
    border: 1.5px solid var(--border); background: var(--surface2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.1s; gap: 2px; flex-shrink: 0;
  }
  .prog-cell:hover { border-color: var(--cyan); }
  .prog-cell.active { background: var(--cyan); border-color: var(--cyan); }
  .prog-cell.current { border-color: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .prog-cell .cell-num { font-size: 8px; color: var(--muted); font-family: 'Space Mono', monospace; }
  .prog-cell .cell-chord { font-size: 12px; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--text); }
  .prog-cell.active .cell-chord { color: #000; }
  .prog-cell .cell-type { font-size: 8px; color: var(--muted); }
  .prog-cell.active .cell-type { color: #000; }

  /* Bank selector */
  .bank-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .bank-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .bank-btns { display: flex; gap: 4px; }
  .bank-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); padding: 5px 12px; border-radius: 6px;
    font-size: 11px; font-family: 'DM Sans', sans-serif; cursor: pointer;
    transition: all 0.1s;
  }
  .bank-btn:hover { border-color: var(--amber); color: var(--amber); }
  .bank-btn.active { background: var(--amber); border-color: var(--amber); color: #000; font-weight: 600; }
  .clear-btn {
    background: var(--surface2); border: 1px solid #3a2020;
    color: #e85050; padding: 5px 10px; border-radius: 6px;
    font-size: 10px; cursor: pointer; transition: all 0.1s;
  }
  .clear-btn:hover { background: #3a2020; }
  .save-btn {
    background: var(--surface2); border: 1px solid #203a28;
    color: #50e880; padding: 5px 10px; border-radius: 6px;
    font-size: 10px; cursor: pointer; transition: all 0.1s;
  }
  .save-btn:hover { background: #203a28; }

  /* Swipe hint */
  .swipe-hint {
    font-size: 9px; color: var(--muted); text-align: center;
    font-family: 'Space Mono', monospace; letter-spacing: 0.5px;
    padding: 4px 0;
  }

  /* Playback position bar */
  .playhead-bar {
    display: flex; gap: 5px; margin-bottom: 6px; padding-left: 0;
  }
  .playhead-dot {
    min-width: 56px; height: 4px; border-radius: 2px;
    background: var(--border); flex-shrink: 0; transition: background 0.05s;
  }
  .playhead-dot.current { background: var(--amber); }
  .playhead-dot.done { background: var(--surface3); }

  /* Hint bar */
  .hint-bar {
    padding: 6px 20px; border-top: 1px solid var(--border);
    background: var(--surface); font-size: 10px; color: var(--muted);
    font-family: 'Space Mono', monospace; letter-spacing: 0.5px; flex-shrink: 0;
  }
  .hint-bar kbd {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 5px; font-size: 9px; color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="logo">Chord<em>Memory</em></div>

  <div class="bpm-control">
    <div>
      <div class="bpm-value" id="bpmDisplay">122</div>
      <div class="bpm-label">BPM</div>
    </div>
  </div>
  <button class="tap-btn" id="tapBtn">TAP</button>

  <div class="transport">
    <button class="transport-btn" id="playBtn" title="Play/Pause (Space)">
      <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
    <button class="transport-btn" id="stopBtn" title="Stop (S)">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg>
    </button>
  </div>

  <div class="voicing-group">
    <button class="voicing-btn active" data-v="close">Close</button>
    <button class="voicing-btn" data-v="spread">Spread</button>
    <button class="voicing-btn" data-v="shell">Shell</button>
    <button class="voicing-btn" data-v="piano">Piano</button>
  </div>

  <div class="pattern-group">
    <button class="pattern-btn active" data-p="rhythm">Rhythm</button>
    <button class="pattern-btn" data-p="staccato">Staccato</button>
    <button class="pattern-btn" data-p="sustain">Sustain</button>
    <button class="pattern-btn" data-p="groove">Groove</button>
  </div>

  <div class="key-selector" id="keySelector"></div>
</header>

<div class="main">
  <!-- Playhead -->
  <div class="playhead-bar" id="playheadBar"></div>

  <!-- Piano display -->
  <div class="piano-section">
    <div class="piano-title">Chord Voicing</div>
    <div class="piano-container" id="pianoContainer"></div>
  </div>

  <!-- Current chord -->
  <div class="chord-display">
    <div>
      <div class="chord-name" id="chordName">—</div>
      <div class="chord-type" id="chordType">select a chord</div>
    </div>
    <div class="chord-notes" id="chordNotes"></div>
  </div>

  <!-- Progression grid -->
  <div class="progression-section">
    <div class="prog-header">
      <div class="prog-title">Progression</div>
      <div class="prog-hint">click = add chord · swipe across = select range</div>
    </div>
    <div class="bank-row">
      <span class="bank-label">Bank</span>
      <div class="bank-btns" id="bankBtns">
        <button class="bank-btn active" data-bank="0">A</button>
        <button class="bank-btn" data-bank="1">B</button>
        <button class="bank-btn" data-bank="2">C</button>
      </div>
      <button class="clear-btn" id="clearBtn">Clear</button>
      <button class="save-btn" id="saveBtn">Save</button>
    </div>
    <div class="swipe-hint">SWIPE across cells to select · 1-7 keys to set degree</div>
    <div class="prog-grid" id="progGrid"></div>
  </div>
</div>

<div class="hint-bar">
  <kbd>Space</kbd> play/pause &nbsp;·&nbsp; <kbd>S</kbd> stop &nbsp;·&nbsp; <kbd>T</kbd> tap tempo &nbsp;·&nbsp; <kbd>1-7</kbd> set degree &nbsp;·&nbsp; <kbd>R</kbd> reset progression &nbsp;·&nbsp; swipe cells to multi-select
</div>

<script>
(function() {
  const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const KEY_NAMES = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const DEGREES = ['I','ii','iii','IV','V','vi','vii°'];
  const DEGREE_TYPES = ['maj','min','min','maj','maj','min','dim'];
  const SEMITONES = [0,2,4,5,7,9,11];
  const SCALE = [0,2,4,5,7,9,11]; // major scale intervals
  const STEPS = 8;

  // State
  let bpm = 122;
  let playing = false;
  let currentStep = -1;
  let nextStepTime = 0;
  let schedulerTimer = null;
  let selectedKey = 0; // C
  let voicing = 'close';
  let pattern = 'rhythm';
  let selectedBank = 0;

  // Banks: 3 banks × 8 steps
  const banks = [
    Array(STEPS).fill(null),
    Array(STEPS).fill(null),
    Array(STEPS).fill(null)
  ];

  // Chord cache: [root, degree, type] → midi notes
  function getChord(rootNote, degree) {
    const scaleRoot = (rootNote + SCALE[degree]) % 12;
    const type = DEGREE_TYPES[degree];
    let notes;
    if (type === 'maj') {
      notes = [scaleRoot, (scaleRoot+4)%12, (scaleRoot+7)%12];
    } else if (type === 'min') {
      notes = [scaleRoot, (scaleRoot+3)%12, (scaleRoot+7)%12];
    } else { // dim
      notes = [scaleRoot, (scaleRoot+3)%12, (scaleRoot+6)%12];
    }
    return notes;
  }

  function getVoicedNotes(rootNote, degree, voi) {
    const chord = getChord(rootNote, degree);
    const scaleRoot = (rootNote + SCALE[degree]) % 12;
    if (voi === 'close') {
      // Close voicing: root pos, all within 1 octave
      return chord.map(n => n);
    } else if (voi === 'spread') {
      // Spread: add octave above root
      return [chord[0], chord[1], chord[2], (chord[0]+12)];
    } else if (voi === 'shell') {
      // Shell: 3rd + 7th (or closest equivalent) — just root + 3rd + 5th
      return [chord[0], chord[1], chord[2]];
    } else { // piano
      // Piano voicing: octave-spaced, warm
      return [(chord[0]+12), chord[1], (chord[0]+24), chord[2]];
    }
  }

  // ===== Audio =====
  let audioCtx = null;
  let masterGain = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.AudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.7;
    masterGain.connect(audioCtx.destination);
  }

  function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

  function playChord(notes, duration, time) {
    if (!audioCtx) return;
    notes.forEach((midi, i) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const gv = 0.18 / notes.length;

      // Piano-like: triangle wave with slight detune
      osc.type = i === 0 ? 'triangle' : 'sine';
      osc.frequency.value = midiToFreq(midi + 48); // shift to piano range
      if (i > 0) osc.detune.value = (Math.random() - 0.5) * 6;

      // ADSR
      const t = time;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gv, t + 0.01);
      g.gain.exponentialRampToValueAtTime(gv * 0.7, t + 0.05);
      g.gain.exponentialRampToValueAtTime(gv * 0.4, t + duration * 0.3);
      g.gain.exponentialRampToValueAtTime(0.001, t + duration);

      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t + duration + 0.05);
    });
  }

  // Pattern rhythms (note durations as fraction of beat)
  const patterns = {
    rhythm: [
      { beat: 0, dur: 0.25 },
      { beat: 0.375, dur: 0.15 },
      { beat: 0.75, dur: 0.2 },
    ],
    staccato: [
      { beat: 0, dur: 0.15 },
      { beat: 0.5, dur: 0.15 },
      { beat: 1.0, dur: 0.15 },
      { beat: 1.5, dur: 0.15 },
    ],
    sustain: [
      { beat: 0, dur: 1.8 },
    ],
    groove: [
      { beat: 0, dur: 0.3 },
      { beat: 0.625, dur: 0.15 },
      { beat: 1.0, dur: 0.15 },
      { beat: 1.625, dur: 0.25 },
    ],
  };

  function scheduleChord(step, time) {
    const chord = banks[selectedBank][step];
    if (!chord) return;
    const notes = getVoicedNotes(selectedKey, chord, voicing);
    const beats = patterns[pattern];
    const secPerBeat = 60.0 / bpm;
    beats.forEach(b => {
      const nTime = time + b.beat * secPerBeat;
      playChord(notes, b.dur * secPerBeat, nTime);
    });
  }

  // ===== Scheduler =====
  const LOOKAHEAD = 0.1;

  function scheduler() {
    if (!playing) return;
    while (nextStepTime < audioCtx.currentTime + LOOKAHEAD) {
      currentStep = (currentStep + 1) % STEPS;
      scheduleChord(currentStep, nextStepTime);
      updatePlayhead(currentStep);

      const secPerBeat = 60.0 / bpm;
      nextStepTime += secPerBeat;
    }
    schedulerTimer = setTimeout(scheduler, 25);
  }

  function updatePlayhead(step) {
    document.querySelectorAll('.playhead-dot').forEach((d, i) => {
      d.classList.remove('current', 'done');
      if (i === step) d.classList.add('current');
      else if (i < step) d.classList.add('done');
    });
    document.querySelectorAll('.prog-cell').forEach(c => c.classList.remove('current'));
    const cell = document.querySelector(`.prog-cell[data-step="${step}"]`);
    if (cell) cell.classList.add('current');
  }

  // ===== Transport =====
  function startPlayback() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playing = true;
    currentStep = -1;
    nextStepTime = audioCtx.currentTime + 0.05;
    document.getElementById('playIcon').innerHTML = '<rect x="5" y="3" width="5" height="18"/><rect x="14" y="3" width="5" height="18"/>';
    scheduler();
  }

  function stopPlayback() {
    playing = false;
    clearTimeout(schedulerTimer);
    currentStep = -1;
    document.querySelectorAll('.playhead-dot').forEach(d => d.classList.remove('current', 'done'));
    document.querySelectorAll('.prog-cell').forEach(c => c.classList.remove('current'));
    document.getElementById('playIcon').innerHTML = '<polygon points="5,3 19,12 5,21"/>';
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    if (playing) stopPlayback(); else startPlayback();
  });
  document.getElementById('stopBtn').addEventListener('click', stopPlayback);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); playing ? stopPlayback() : startPlayback(); }
    if (e.code === 'KeyS') stopPlayback();
    if (e.code === 'KeyT') document.getElementById('tapBtn').click();
    if (e.code === 'KeyR') clearProgression();
    if (e.code >= 'Digit1' && e.code <= 'Digit7') {
      const degree = parseInt(e.code.slice(-1)) - 1;
      addChordToSelected(degree);
    }
  });

  // ===== BPM =====
  let tapTimes = [];
  document.getElementById('tapBtn').addEventListener('click', () => {
    initAudio();
    const now = performance.now();
    tapTimes.push(now);
    if (tapTimes.length > 4) tapTimes.shift();
    if (tapTimes.length >= 2) {
      const intervals = tapTimes.slice(1).map((t, i) => t - tapTimes[i]);
      const avg = intervals.reduce((a,b) => a+b) / intervals.length;
      bpm = Math.max(60, Math.min(200, Math.round(60000 / avg)));
      document.getElementById('bpmDisplay').textContent = bpm;
    }
    setTimeout(() => { if (tapTimes.length && (performance.now() - tapTimes[tapTimes.length-1]) > 2000) tapTimes = []; }, 2100);
  });

  // ===== Voicing =====
  document.querySelectorAll('.voicing-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.voicing-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      voicing = btn.dataset.v;
      updateChordDisplay();
      updatePiano();
    });
  });

  // ===== Pattern =====
  document.querySelectorAll('.pattern-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      pattern = btn.dataset.p;
    });
  });

  // ===== Key selector =====
  const keySel = document.getElementById('keySelector');
  NOTES.forEach((n, i) => {
    const btn = document.createElement('button');
    btn.className = 'key-btn' + (i === 0 ? ' active' : '');
    btn.textContent = KEY_NAMES[i];
    btn.addEventListener('click', () => {
      document.querySelectorAll('.key-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedKey = i;
      updateChordDisplay();
      updatePiano();
    });
    keySel.appendChild(btn);
  });

  // ===== Build piano =====
  function buildPiano() {
    const container = document.getElementById('pianoContainer');
    container.innerHTML = '';
    const whiteKeys = document.createElement('div');
    whiteKeys.className = 'piano-white-keys';
    const blackKeys = document.createElement('div');
    blackKeys.className = 'piano-black-keys';

    const whiteNotes = [0,2,4,5,7,9,11]; // C D E F G A B
    const blackMap = {1: 1, 3: 3, 6: 6, 8: 8, 10: 10}; // offset index → note index
    const blackPositions = [0, 1, 3, 4, 5]; // positions relative to white keys

    whiteNotes.forEach((note, idx) => {
      const key = document.createElement('div');
      key.className = 'piano-white-key';
      key.dataset.note = note;
      const label = document.createElement('span');
      label.className = 'note-label';
      label.textContent = NOTES[note];
      key.appendChild(label);
      whiteKeys.appendChild(key);
    });

    // Black keys at correct positions
    const bPos = [7.14, 14.28, 35.71, 50.0, 64.28, 78.57, 92.86];
    [1,3,6,8,10].forEach((note, i) => {
      const key = document.createElement('div');
      key.className = 'piano-black-key';
      key.dataset.note = note;
      key.style.left = bPos[i] + '%';
      const label = document.createElement('span');
      label.className = 'note-label';
      label.textContent = NOTES[note].replace('#', '♯');
      key.appendChild(label);
      blackKeys.appendChild(key);
    });

    container.appendChild(whiteKeys);
    container.appendChild(blackKeys);
  }

  function updatePiano(activeNotes) {
    document.querySelectorAll('.piano-white-key, .piano-black-key').forEach(k => {
      k.classList.remove('active');
    });
    if (!activeNotes) return;
    activeNotes.forEach(n => {
      const key = document.querySelector(`.piano-white-key[data-note="${n % 12}"], .piano-black-key[data-note="${n % 12}"]`);
      if (key) key.classList.add('active');
    });
  }

  // ===== Build progression grid =====
  function buildProgressionGrid() {
    const grid = document.getElementById('progGrid');
    grid.innerHTML = '';
    const bar = document.getElementById('playheadBar');
    bar.innerHTML = '';

    for (let i = 0; i < STEPS; i++) {
      // Playhead dot
      const dot = document.createElement('div');
      dot.className = 'playhead-dot';
      bar.appendChild(dot);

      // Cell
      const cell = document.createElement('div');
      cell.className = 'prog-cell';
      cell.dataset.step = i;

      const num = document.createElement('div');
      num.className = 'cell-num';
      num.textContent = i + 1;
      cell.appendChild(num);

      const chord = banks[selectedBank][i];
      if (chord !== null) {
        const degree = chord;
        const notes = getChord(selectedKey, degree);
        const rootNote = (selectedKey + SCALE[degree]) % 12;
        cell.classList.add('active');
        const chordDiv = document.createElement('div');
        chordDiv.className = 'cell-chord';
        chordDiv.textContent = DEGREES[degree];
        cell.appendChild(chordDiv);
        const typeDiv = document.createElement('div');
        typeDiv.className = 'cell-type';
        typeDiv.textContent = DEGREE_TYPES[degree];
        cell.appendChild(typeDiv);
      } else {
        const chordDiv = document.createElement('div');
        chordDiv.className = 'cell-chord';
        chordDiv.textContent = '—';
        chordDiv.style.color = 'var(--muted)';
        cell.appendChild(chordDiv);
      }

      // Click to add/remove chord
      cell.addEventListener('click', () => {
        const existing = banks[selectedBank][i];
        if (existing !== null) {
          banks[selectedBank][i] = null;
        } else {
          banks[selectedBank][i] = 0; // default to I
        }
        buildProgressionGrid();
        updateChordDisplay();
      });

      grid.appendChild(cell);
    }

    // Swipe to select range
    let swipeStart = -1;
    grid.addEventListener('mousedown', e => {
      const cell = e.target.closest('.prog-cell');
      if (!cell) return;
      swipeStart = parseInt(cell.dataset.step);
    });
    grid.addEventListener('mousemove', e => {
      if (swipeStart < 0) return;
      const cell = e.target.closest('.prog-cell');
      if (!cell) return;
      const idx = parseInt(cell.dataset.step);
      const start = Math.min(swipeStart, idx);
      const end = Math.max(swipeStart, idx);
      // Highlight range
      document.querySelectorAll('.prog-cell').forEach(c => c.classList.remove('current'));
      for (let i = start; i <= end; i++) {
        document.querySelector(`.prog-cell[data-step="${i}"]`).classList.add('current');
      }
    });
    grid.addEventListener('mouseup', e => {
      const cell = e.target.closest('.prog-cell');
      if (cell && swipeStart >= 0) {
        const idx = parseInt(cell.dataset.step);
        const start = Math.min(swipeStart, idx);
        const end = Math.max(swipeStart, idx);
        // Set all in range to last selected degree or default
        for (let i = start; i <= end; i++) {
          if (banks[selectedBank][i] === null) banks[selectedBank][i] = 0;
        }
        buildProgressionGrid();
      }
      swipeStart = -1;
      document.querySelectorAll('.prog-cell').forEach(c => c.classList.remove('current'));
    });
  }

  function addChordToSelected(degree) {
    // Add to first empty slot or last slot
    const idx = banks[selectedBank].findIndex(c => c === null);
    const target = idx >= 0 ? idx : STEPS - 1;
    banks[selectedBank][target] = degree;
    buildProgressionGrid();
    updateChordDisplay();
    // Preview sound
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = getVoicedNotes(selectedKey, degree, voicing);
    playChord(notes, 0.5, audioCtx.currentTime + 0.02);
  }

  function clearProgression() {
    banks[selectedBank] = Array(STEPS).fill(null);
    buildProgressionGrid();
    updateChordDisplay();
  }

  // ===== Chord display =====
  function updateChordDisplay() {
    const activeChord = banks[selectedBank].find(c => c !== null);
    if (activeChord === null) {
      document.getElementById('chordName').textContent = '—';
      document.getElementById('chordType').textContent = 'select a chord';
      document.getElementById('chordNotes').innerHTML = '';
      updatePiano(null);
      return;
    }
    const degree = activeChord;
    const notes = getChord(selectedKey, degree);
    const scaleRoot = (selectedKey + SCALE[degree]) % 12;
    document.getElementById('chordName').textContent = DEGREES[degree];
    document.getElementById('chordType').textContent = DEGREE_TYPES[degree].toUpperCase() + ' — ' + KEY_NAMES[scaleRoot];
    const notesEl = document.getElementById('chordNotes');
    notesEl.innerHTML = '';
    notes.forEach((n, i) => {
      const span = document.createElement('span');
      span.className = 'chord-note' + (i === 0 ? ' root' : '');
      span.textContent = NOTES[n];
      notesEl.appendChild(span);
    });
    // Update piano
    const voiced = getVoicedNotes(selectedKey, degree, voicing);
    const midiNotes = voiced.map(n => n + 48);
    updatePiano(midiNotes.map(m => m % 12));
  }

  // ===== Banks =====
  document.querySelectorAll('.bank-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bank-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedBank = parseInt(btn.dataset.bank);
      buildProgressionGrid();
      updateChordDisplay();
    });
  });

  document.getElementById('clearBtn').addEventListener('click', clearProgression);

  document.getElementById('saveBtn').addEventListener('click', () => {
    try {
      localStorage.setItem('chord-memory-banks', JSON.stringify(banks));
      const btn = document.getElementById('saveBtn');
      btn.textContent = 'Saved ✓';
      btn.style.background = '#203a28';
      setTimeout(() => { btn.textContent = 'Save'; btn.style.background = ''; }, 1500);
    } catch(e) {}
  });

  // Load saved banks
  try {
    const saved = localStorage.getItem('chord-memory-banks');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length === 3) {
        for (let i = 0; i < 3; i++) {
          if (parsed[i].length === STEPS) banks[i] = parsed[i];
        }
      }
    }
  } catch(e) {}

  // ===== Init =====
  buildPiano();
  buildProgressionGrid();

})();
</script>
</body>
</html>
