<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dub Delay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050508;
    --surface: #0a0a10;
    --border: #141420;
    --cyan: #00f5ff;
    --cyan-dim: #00a5aa;
    --gold: #ffb800;
    --gold-dim: #997a00;
    --text: #c8c8e0;
    --text-dim: #5a5a78;
    --green: #00ff88;
    --accent: #ff6600;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    user-select: none;
  }

  header {
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .logo span { color: var(--text-dim); }

  .bpm-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .bpm-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cyan);
    font-family: inherit;
    font-size: 18px;
    font-weight: 300;
    width: 70px;
    padding: 6px 10px;
    text-align: center;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
    letter-spacing: -0.02em;
  }

  .bpm-input:focus { border-color: var(--cyan); }
  .bpm-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .bpm-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; }

  .main-area {
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Timeline */
  .timeline-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 18px 20px;
  }

  .timeline-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .timeline {
    position: relative;
    height: 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .timeline-beat-marks {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 16px;
    display: flex;
    align-items: flex-end;
    padding: 0 4px;
  }

  .beat-mark {
    flex: 1;
    height: 8px;
    border-left: 1px solid rgba(255,255,255,0.06);
    font-size: 7px;
    color: var(--text-dim);
    padding-left: 3px;
    display: flex;
    align-items: flex-end;
  }

  .beat-mark:first-child { border-left: none; }

  .timeline-ticks {
    position: absolute;
    top: 16px; left: 0; right: 0; bottom: 0;
  }

  .delay-tick {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    transform: translateX(-1px);
    border-radius: 1px;
  }

  .delay-tick.line { background: rgba(255,102,0,0.5); }
  .delay-tick.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .delay-ms-label {
    position: absolute;
    top: 4px;
    transform: translateX(-50%);
    font-size: 8px;
    color: var(--accent);
    letter-spacing: 0.05em;
    white-space: nowrap;
    font-weight: 500;
  }

  .origin-tick {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    transform: translateX(-0.5px);
  }

  .origin-label {
    position: absolute;
    bottom: 5px;
    transform: translateX(-50%);
    font-size: 7px;
    color: var(--cyan);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  /* Delay taps grid */
  .taps-grid {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 18px 20px;
  }

  .taps-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .taps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }

  .tap-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 12px;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
  }

  .tap-card:hover { border-color: var(--cyan-dim); }
  .tap-card.selected { border-color: var(--accent); background: rgba(255,102,0,0.04); }

  .tap-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
    letter-spacing: 0.04em;
  }

  .tap-note {
    font-size: 9px;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.06em;
  }

  .tap-ms {
    font-size: 20px;
    font-weight: 300;
    color: var(--accent);
    line-height: 1;
  }

  .tap-ms span {
    font-size: 9px;
    color: var(--text-dim);
    margin-left: 3px;
    font-weight: 400;
  }

  /* Custom tap builder */
  .custom-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 18px 20px;
  }

  .custom-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .custom-controls {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    flex-wrap: wrap;
  }

  .custom-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .custom-field-label {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .custom-select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 7px 10px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    min-width: 90px;
    transition: border-color 0.15s;
  }

  .custom-select:focus { border-color: var(--cyan); }
  .custom-select option { background: var(--surface); }

  .mult-field {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mult-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cyan);
    font-family: inherit;
    font-size: 18px;
    font-weight: 300;
    width: 60px;
    padding: 6px 8px;
    text-align: center;
    border-radius: 2px;
    outline: none;
    letter-spacing: -0.02em;
    transition: border-color 0.15s;
  }

  .mult-input:focus { border-color: var(--cyan); }
  .mult-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .mult-x {
    font-size: 12px;
    color: var(--text-dim);
  }

  .result-ms {
    font-size: 28px;
    font-weight: 300;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1;
    min-width: 90px;
  }

  .result-ms span {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 3px;
  }

  /* Tap tempo */
  .tap-tempo-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .tap-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.12em;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.1s, box-shadow 0.1s;
    min-width: 100px;
  }

  .tap-btn:hover { background: rgba(255,102,0,0.08); box-shadow: 0 0 12px rgba(255,102,0,0.2); }
  .tap-btn:active { background: rgba(255,102,0,0.15); transform: scale(0.98); }

  .tap-result {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .tap-bpm-label {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .tap-bpm-value {
    font-size: 24px;
    font-weight: 300;
    color: var(--cyan);
    letter-spacing: -0.02em;
  }

  .tap-bpm-value span { font-size: 10px; color: var(--text-dim); margin-left: 3px; }

  .tap-history {
    display: flex;
    gap: 3px;
    align-items: center;
    margin-top: 4px;
  }

  .tap-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.2s;
  }

  .tap-dot.fresh { background: var(--accent); }

  /* Bottom bar */
  .bottom-bar {
    padding: 10px 28px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Dub <span>Delay</span></div>
  <div class="bpm-input-wrap">
    <input type="number" class="bpm-input" id="bpmInput" value="124" min="40" max="220">
    <span class="bpm-label">BPM</span>
  </div>
</header>

<div class="main-area">
  <!-- Timeline -->
  <div class="timeline-wrap">
    <div class="timeline-label">Echo Timeline — 1 bar · <span id="barMsLabel">483.9</span> ms</div>
    <div class="timeline" id="timeline">
      <div class="timeline-beat-marks" id="beatMarks"></div>
      <div class="timeline-ticks" id="timelineTicks">
        <div class="origin-tick" id="originTick">
          <div class="origin-label">T+0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Preset Taps -->
  <div class="taps-grid">
    <div class="taps-label">Note Division Delays</div>
    <div class="taps" id="tapsGrid"></div>
  </div>

  <!-- Custom Builder -->
  <div class="custom-row">
    <div class="custom-label">Custom Delay</div>
    <div class="custom-controls">
      <div class="custom-field">
        <span class="custom-field-label">Division</span>
        <select class="custom-select" id="customDiv">
          <option value="1">1/1 (bar)</option>
          <option value="0.5">1/2 (half)</option>
          <option value="0.25" selected>1/4 (quarter)</option>
          <option value="0.1667">1/4T (quarter triplet)</option>
          <option value="0.125">1/8 (eighth)</option>
          <option value="0.0833">1/8T (eighth triplet)</option>
          <option value="0.0625">1/16 (sixteenth)</option>
        </select>
      </div>
      <div class="custom-field">
        <span class="custom-field-label">Multiplier</span>
        <div class="mult-field">
          <input type="number" class="mult-input" id="customMult" value="1" min="0.25" max="16" step="0.25">
          <span class="mult-x">×</span>
        </div>
      </div>
      <div class="custom-field">
        <span class="custom-field-label">Result</span>
        <div class="result-ms" id="customResult">242.0<span>ms</span></div>
      </div>
    </div>
  </div>

  <!-- Tap Tempo -->
  <div class="tap-tempo-row">
    <button class="tap-btn" id="tapBtn">TAP TEMPO</button>
    <div class="tap-result">
      <div class="tap-bpm-label">Detected BPM</div>
      <div class="tap-bpm-value" id="tapBpmValue">—<span>BPM</span></div>
      <div class="tap-history" id="tapHistory"></div>
    </div>
    <div class="tap-result">
      <div class="tap-bpm-label">Avg Delay (1/4)</div>
      <div class="result-ms" id="tapDelayResult">—<span>ms</span></div>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <div>Space = tap tempo · Arrow keys = BPM ±1</div>
  <div>Deep house: try 1/8T at 2× or 3× for dub echo feel</div>
</div>

<script>
(function() {
  var bpm = 124;
  var tapTimes = [];
  var tapTimeout = null;

  var divisions = [
    { name: 'Bar',    note: '1/1',  div: 1,    mult: 1 },
    { name: 'Half',   note: '1/2',  div: 0.5,  mult: 1 },
    { name: 'Quarter',note: '1/4',  div: 0.25, mult: 1 },
    { name: 'Q-Trip',note: '1/4T', div: 0.1667, mult: 1 },
    { name: 'Eighth', note: '1/8',  div: 0.125, mult: 1 },
    { name: '8-Trip', note: '1/8T', div: 0.0833, mult: 1 },
    { name: 'Sixteenth', note: '1/16', div: 0.0625, mult: 1 },
  ];

  var presets = [
    { name: 'Dotted 1/8', note: '1/8D', div: 0.1875, mult: 1, color: '#ff6600' },
    { name: 'Long Echo',  note: '1/4',  div: 0.25,   mult: 3, color: '#ff6600' },
    { name: 'Dub 1/4',    note: '1/4',  div: 0.25,   mult: 2, color: '#ff6600' },
    { name: 'Double 1/8', note: '1/8',  div: 0.125,  mult: 2, color: '#ff6600' },
    { name: 'Slap 1/16',  note: '1/16', div: 0.0625, mult: 2, color: '#ff6600' },
    { name: 'Six 1/8T',   note: '1/8T', div: 0.0833, mult: 3, color: '#ff6600' },
  ];

  function msPerBeat(b) { return 60000 / b; }
  function msPerBar(b) { return msPerBeat(b) * 4; }
  function delayMs(b, div, mult) { return msPerBeat(b) * div * mult; }

  function renderBeatMarks() {
    var container = document.getElementById('beatMarks');
    container.innerHTML = '';
    for (var i = 0; i < 4; i++) {
      var m = document.createElement('div');
      m.className = 'beat-mark';
      var ms = msPerBeat(bpm) * i;
      m.textContent = i + 1;
      container.appendChild(m);
    }
  }

  function renderTapsGrid() {
    var grid = document.getElementById('tapsGrid');
    grid.innerHTML = '';
    divisions.forEach(function(d) {
      var ms = delayMs(bpm, d.div, 1);
      var card = document.createElement('div');
      card.className = 'tap-card';
      card.dataset.div = d.div;
      card.dataset.mult = 1;
      card.innerHTML =
        '<div class="tap-name">' + d.name + '</div>' +
        '<div class="tap-note">' + d.note + '</div>' +
        '<div class="tap-ms">' + ms.toFixed(1) + '<span>ms</span></div>';
      card.addEventListener('click', function() {
        document.querySelectorAll('.tap-card').forEach(function(c) { c.classList.remove('selected'); });
        card.classList.add('selected');
        renderCustomTimeline(delayMs(bpm, d.div, 1), d.note);
      });
      grid.appendChild(card);
    });
  }

  function renderCustomTimeline(delayTime, label) {
    var container = document.getElementById('timelineTicks');
    // Clear existing delay ticks
    container.querySelectorAll('.delay-tick, .delay-ms-label').forEach(function(el) { el.remove(); });

    var barWidth = container.offsetWidth || 600;
    var barMs = msPerBar(bpm);

    // Add up to 8 echo ticks
    for (var i = 1; i <= 8; i++) {
      var t = delayTime * i;
      if (t > barMs * 2) break; // Don't overflow 2 bars
      var xFrac = t / (barMs * 2);
      var x = xFrac * barWidth;

      var tick = document.createElement('div');
      tick.className = 'delay-tick' + (i === 1 ? ' active' : '');
      tick.style.left = x + 'px';
      container.appendChild(tick);

      if (i <= 4) {
        var lbl = document.createElement('div');
        lbl.className = 'delay-ms-label';
        lbl.style.left = x + 'px';
        lbl.textContent = Math.round(t) + 'ms';
        container.appendChild(lbl);
      }
    }
  }

  function updateBpm(newBpm) {
    bpm = Math.max(40, Math.min(220, newBpm));
    document.getElementById('bpmInput').value = bpm;
    document.getElementById('barMsLabel').textContent = msPerBar(bpm).toFixed(1);
    renderBeatMarks();
    renderTapsGrid();

    // Update custom
    var div = parseFloat(document.getElementById('customDiv').value);
    var mult = parseFloat(document.getElementById('customMult').value) || 1;
    var result = delayMs(bpm, div, mult);
    document.getElementById('customResult').innerHTML = result.toFixed(1) + '<span>ms</span>';

    // Update tap delay
    if (tapTimes.length > 1) {
      var avgMs = 0;
      for (var i = 1; i < tapTimes.length; i++) avgMs += tapTimes[i] - tapTimes[i-1];
      avgMs /= (tapTimes.length - 1);
      var detectedBpm = 60000 / avgMs;
      document.getElementById('tapBpmValue').innerHTML = Math.round(detectedBpm) + '<span>BPM</span>';
      document.getElementById('tapDelayResult').innerHTML = (avgMs / 4).toFixed(1) + '<span>ms</span>';
    }

    // Re-render timeline with selected card
    var selected = document.querySelector('.tap-card.selected');
    if (selected) {
      var d = parseFloat(selected.dataset.div);
      var m = parseFloat(selected.dataset.mult);
      renderCustomTimeline(delayMs(bpm, d, m), '');
    }
  }

  function buildTapHistory() {
    var hist = document.getElementById('tapHistory');
    hist.innerHTML = '';
    for (var i = 0; i < 6; i++) {
      var dot = document.createElement('div');
      dot.className = 'tap-dot';
      hist.appendChild(dot);
    }
  }

  function animateTapDots() {
    var hist = document.getElementById('tapHistory');
    var dots = hist.querySelectorAll('.tap-dot');
    dots.forEach(function(d) { d.classList.remove('fresh'); });
    // Shift in fresh
    dots[dots.length - 1].classList.add('fresh');
    // Reorder
    var last = hist.removeChild(dots[dots.length - 1]);
    hist.insertBefore(last, dots[0]);
  }

  // Tap tempo
  function handleTap() {
    var now = Date.now();
    if (tapTimeout) clearTimeout(tapTimeout);

    if (tapTimes.length === 0 || now - tapTimes[tapTimes.length - 1] > 3000) {
      tapTimes = [now];
    } else {
      tapTimes.push(now);
      if (tapTimes.length > 8) tapTimes.shift();

      var avgMs = 0;
      for (var i = 1; i < tapTimes.length; i++) avgMs += tapTimes[i] - tapTimes[i-1];
      avgMs /= (tapTimes.length - 1);
      var detectedBpm = Math.round(60000 / avgMs);
      document.getElementById('tapBpmValue').innerHTML = detectedBpm + '<span>BPM</span>';
      document.getElementById('tapDelayResult').innerHTML = (avgMs / 4).toFixed(1) + '<span>ms</span>';
      updateBpm(detectedBpm);
    }

    animateTapDots();
    tapTimeout = setTimeout(function() {
      tapTimes = [];
      document.getElementById('tapBpmValue').innerHTML = '—<span>BPM</span>';
      document.getElementById('tapDelayResult').innerHTML = '—<span>ms</span>';
    }, 3000);
  }

  // Events
  document.getElementById('bpmInput').addEventListener('change', function() {
    updateBpm(parseInt(this.value) || 124);
  });

  document.getElementById('customDiv').addEventListener('change', function() {
    var div = parseFloat(this.value);
    var mult = parseFloat(document.getElementById('customMult').value) || 1;
    var result = delayMs(bpm, div, mult);
    document.getElementById('customResult').innerHTML = result.toFixed(1) + '<span>ms</span>';
    renderCustomTimeline(result, '');
  });

  document.getElementById('customMult').addEventListener('change', function() {
    var div = parseFloat(document.getElementById('customDiv').value);
    var mult = parseFloat(this.value) || 1;
    var result = delayMs(bpm, div, mult);
    document.getElementById('customResult').innerHTML = result.toFixed(1) + '<span>ms</span>';
    renderCustomTimeline(result, '');
  });

  document.getElementById('tapBtn').addEventListener('click', handleTap);

  window.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); handleTap(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); updateBpm(bpm + 1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); updateBpm(bpm - 1); }
  });

  // Resize timeline
  window.addEventListener('resize', function() {
    var selected = document.querySelector('.tap-card.selected');
    if (selected) {
      var d = parseFloat(selected.dataset.div);
      var m = parseFloat(selected.dataset.mult);
      renderCustomTimeline(delayMs(bpm, d, m), '');
    }
  });

  // Init
  renderBeatMarks();
  renderTapsGrid();
  buildTapHistory();
  updateBpm(124);

  // Auto-select quarter
  setTimeout(function() {
    var cards = document.querySelectorAll('.tap-card');
    if (cards[2]) { cards[2].click(); }
  }, 50);

})();
</script>
</body>
</html>
