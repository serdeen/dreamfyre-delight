<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rainbow Drum 🥁</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #0a0a16;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    gap: 32px;
    padding: 24px;
  }

  h1 {
    color: #fff;
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 0 40px rgba(255,255,255,0.1);
    user-select: none;
  }

  h1 span { display: inline-block; animation: bounce 0.6s ease infinite alternate; }
  h1 span:nth-child(2) { animation-delay: 0.1s; }
  h1 span:nth-child(3) { animation-delay: 0.2s; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 420px;
    width: 100%;
  }

  .pad {
    aspect-ratio: 1;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: visible;
  }

  .pad::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .pad.hit::after {
    content: '';
    position: absolute;
    width: 130%;
    height: 130%;
    border-radius: 50%;
    border: 3px solid currentColor;
    opacity: 0;
    animation: ring 0.4s ease-out forwards;
    pointer-events: none;
  }

  @keyframes ring {
    0%   { transform: scale(0.8); opacity: 0.8; }
    100% { transform: scale(1.3); opacity: 0; }
  }

  .pad:active, .pad.pressed {
    transform: scale(0.91) !important;
  }

  .pad:hover {
    transform: scale(1.05);
  }

  /* Colors */
  .pad-red    { background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b); color: #ff6b6b; box-shadow: 0 0 30px rgba(255,107,107,0.4), inset 0 -4px 12px rgba(0,0,0,0.4), inset 0 4px 8px rgba(255,255,255,0.15); }
  .pad-orange { background: radial-gradient(circle at 35% 35%, #ffa94d, #e67700); color: #ffa94d; box-shadow: 0 0 30px rgba(255,169,77,0.4), inset 0 -4px 12px rgba(0,0,0,0.4), inset 0 4px 8px rgba(255,255,255,0.15); }
  .pad-yellow { background: radial-gradient(circle at 35% 35%, #ffd43b, #fab005); color: #ffd43b; box-shadow: 0 0 30px rgba(255,212,59,0.4), inset 0 -4px 12px rgba(0,0,0,0.4), inset 0 4px 8px rgba(255,255,255,0.15); }
  .pad-green  { background: radial-gradient(circle at 35% 35%, #51cf66, #2b8a3e); color: #51cf66; box-shadow: 0 0 30px rgba(81,207,102,0.4), inset 0 -4px 12px rgba(0,0,0,0.4), inset 0 4px 8px rgba(255,255,255,0.15); }
  .pad-blue   { background: radial-gradient(circle at 35% 35%, #4dabf7, #1971c2); color: #4dabf7; box-shadow: 0 0 30px rgba(77,171,247,0.4), inset 0 -4px 12px rgba(0,0,0,0.4), inset 0 4px 8px rgba(255,255,255,0.15); }
  .pad-purple { background: radial-gradient(circle at 35% 35%, #da77f2, #9c36b5); color: #da77f2; box-shadow: 0 0 30px rgba(218,119,242,0.4), inset 0 -4px 12px rgba(0,0,0,0.4), inset 0 4px 8px rgba(255,255,255,0.15); }

  .icon {
    font-size: clamp(2.2rem, 10vw, 3.2rem);
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    position: relative;
    z-index: 1;
  }

  /* Floating particles on hit */
  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    pointer-events: none;
    animation: particle-fly 0.6s ease-out forwards;
  }

  @keyframes particle-fly {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  .hint {
    color: rgba(255,255,255,0.25);
    font-size: 0.9rem;
    text-align: center;
    letter-spacing: 1px;
    user-select: none;
  }

  /* Big center record button */
  .center-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1a1a2e;
    border: 2px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
    color: rgba(255,255,255,0.4);
    font-size: 1.4rem;
  }

  .center-btn:hover { transform: scale(1.1); border-color: rgba(255,255,255,0.3); color: #fff; }
  .center-btn:active { transform: scale(0.95); }

  .center-btn.recording {
    background: #c0392b;
    border-color: #ff6b6b;
    color: #fff;
    box-shadow: 0 0 20px rgba(192,57,43,0.6);
    animation: pulse-rec 1s ease infinite;
  }

  @keyframes pulse-rec {
    0%, 100% { box-shadow: 0 0 20px rgba(192,57,43,0.6); }
    50% { box-shadow: 0 0 30px rgba(255,107,107,0.9); }
  }
</style>
</head>
<body>

<h1><span>🌈</span> <span>🥁</span> <span>Rainbow</span></h1>

<div class="grid" id="grid"></div>

<p class="hint">tap the colors · hear the drums</p>

<div class="center-btn" id="beatBtn" title="Loop Beat">▶</div>

<script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();

// ── Sound synthesis ───────────────────────────────────────────────────────────
function kick() {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.setValueAtTime(160, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.12);
  g.gain.setValueAtTime(1.0, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
  o.start(); o.stop(ctx.currentTime + 0.35);
}

function snare() {
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.5;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.8, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start();
  // Add body thump
  const o = ctx.createOscillator();
  const og = ctx.createGain();
  o.connect(og); og.connect(ctx.destination);
  o.frequency.setValueAtTime(200, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.05);
  og.gain.setValueAtTime(0.4, ctx.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  o.start(); o.stop(ctx.currentTime + 0.08);
}

function hihat(open) {
  const dur = open ? 0.4 : 0.06;
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 7000;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.5, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  src.connect(hp); hp.connect(g); g.connect(ctx.destination);
  src.start();
}

function tom(freq) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.setValueAtTime(freq, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq * 0.5, ctx.currentTime + 0.15);
  g.gain.setValueAtTime(0.7, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
  o.start(); o.stop(ctx.currentTime + 0.25);
}

function cymbal() {
  const buf = ctx.createBuffer(1, ctx.sampleRate * 1.2, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 5000;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.4, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
  src.connect(hp); hp.connect(g); g.connect(ctx.destination);
  src.start();
}

function rim() {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'triangle';
  o.connect(g); g.connect(ctx.destination);
  o.frequency.setValueAtTime(800, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.04);
  g.gain.setValueAtTime(0.6, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
  o.start(); o.stop(ctx.currentTime + 0.06);
}

// ── Pad layout ───────────────────────────────────────────────────────────────
const pads = [
  { cls: 'pad-red',    sound: kick,    icon: '🥁' },
  { cls: 'pad-orange', sound: () => hihat(false), icon: '🔔' },
  { cls: 'pad-yellow', sound: () => tom(280), icon: '🟡' },
  { cls: 'pad-green',  sound: snare,  icon: '💥' },
  { cls: 'pad-blue',   sound: () => hihat(true), icon: '🎵' },
  { cls: 'pad-purple', sound: cymbal,  icon: '✨' },
];

const grid = document.getElementById('grid');
pads.forEach((pad, i) => {
  const el = document.createElement('div');
  el.className = `pad ${pad.cls}`;
  el.innerHTML = `<span class="icon">${pad.icon}</span>`;
  el.dataset.i = i;

  const play = (e) => {
    e.preventDefault();
    if (ctx.state === 'suspended') ctx.resume();
    pad.sound();
    el.classList.add('hit');
    el.style.transform = 'scale(0.91)';
    spawnParticles(el, pad.cls);
    setTimeout(() => { el.classList.remove('hit'); el.style.transform = ''; }, 120);
  };

  el.addEventListener('mousedown', play);
  el.addEventListener('touchstart', play, { passive: false });
  grid.appendChild(el);
});

function spawnParticles(el, cls) {
  const colors = {
    'pad-red': '#ff6b6b', 'pad-orange': '#ffa94d', 'pad-yellow': '#ffd43b',
    'pad-green': '#51cf66', 'pad-blue': '#4dabf7', 'pad-purple': '#da77f2'
  };
  const color = colors[cls] || '#fff';
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i / 6) * Math.PI * 2;
    const dist = 50 + Math.random() * 40;
    p.style.cssText = `
      left: 50%; top: 50%;
      background: ${color};
      --tx: ${Math.cos(angle) * dist}px;
      --ty: ${Math.sin(angle) * dist}px;
      box-shadow: 0 0 6px ${color};
    `;
    el.appendChild(p);
    setTimeout(() => p.remove(), 600);
  }
}

// ── Loop beat button ─────────────────────────────────────────────────────────
const beatBtn = document.getElementById('beatBtn');
let beatInterval = null;
const beatPattern = [
  { pad: 0, time: 0 },    // kick on 1
  { pad: 1, time: 0.25 }, // closed hh
  { pad: 3, time: 0.5 },   // snare on 2
  { pad: 1, time: 0.75 }, // hh
  { pad: 0, time: 1.0 },  // kick on 3
  { pad: 1, time: 1.25 },
  { pad: 3, time: 1.5 },  // snare on 4
  { pad: 1, time: 1.75 },
];
let beatIndex = 0;
let beatTimeout = null;
let isRecording = false;

function scheduleNext() {
  const item = beatPattern[beatIndex];
  const delay = item.time * 1000;
  beatTimeout = setTimeout(() => {
    const el = grid.children[item.pad];
    if (ctx.state === 'suspended') ctx.resume();
    pads[item.pad].sound();
    el.classList.add('hit');
    setTimeout(() => el.classList.remove('hit'), 100);
    beatIndex = (beatIndex + 1) % beatPattern.length;
    if (isRecording) scheduleNext();
  }, delay);
}

beatBtn.addEventListener('click', () => {
  if (isRecording) {
    isRecording = false;
    clearTimeout(beatTimeout);
    beatBtn.textContent = '▶';
    beatBtn.classList.remove('recording');
  } else {
    if (ctx.state === 'suspended') ctx.resume();
    isRecording = true;
    beatIndex = 0;
    beatBtn.textContent = '■';
    beatBtn.classList.add('recording');
    scheduleNext();
  }
});
</script>
</body>
</html>
